<!DOCTYPE html>
<html lang="nl" data-thema="espresso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bed &amp; Wellness Flevoland — portaal</title>
<meta name="theme-color" id="themaKleur" content="#F4F1ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   KLEURENSCHEMA'S — zelfde opzet als het VR Dashboard.
   Kies er een via de knopjes onderaan of pas de waarden aan.
   ═══════════════════════════════════════════════════════════ */

[data-thema="espresso"]{
  --bg:#F4F1ED; --surface:#FFFFFF; --surface-2:#FAF7F3;
  --line:#E3DAD0; --line-soft:#EFE8E1;
  --ink:#241E19; --ink-2:#4B4239; --muted:#7B6E62;
  --accent:#483C34; --accent-ink:#FFFFFF; --accent-soft:#E8DFD5;
  --brass:#9A7B4F; --ok:#3F7A55; --warn:#8F6420; --warn-soft:#F6EBD9;
  --crit:#A34434; --crit-soft:#F7E2DC;
}
[data-thema="salie"]{
  --bg:#F3F6F2; --surface:#FFFFFF; --surface-2:#F7FAF6;
  --line:#DCE4DA; --line-soft:#E9EFE7;
  --ink:#1B2620; --ink-2:#3D4A41; --muted:#66756B;
  --accent:#40584B; --accent-ink:#FFFFFF; --accent-soft:#DDE8E0;
  --brass:#8C6F42; --ok:#397052; --warn:#8A6420; --warn-soft:#F3ECDC;
  --crit:#A75446; --crit-soft:#F7E3DE;
}
[data-thema="leisteen"]{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#F8FAFB;
  --line:#DBE2E6; --line-soft:#E9EEF1;
  --ink:#16212A; --ink-2:#3A4750; --muted:#5F6E76;
  --accent:#293D4A; --accent-ink:#FFFFFF; --accent-soft:#DCE5EA;
  --brass:#96793F; --ok:#3F756C; --warn:#8A6420; --warn-soft:#F2EDDF;
  --crit:#98505A; --crit-soft:#F5E2E5;
}

:root{
  --shadow:0 1px 2px rgba(36,30,25,.06), 0 8px 24px -16px rgba(36,30,25,.30);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input{font:inherit;color:inherit;cursor:pointer}
input{cursor:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ───────────── inloggen ───────────── */
#login{min-height:100dvh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
#login::before{content:'';position:absolute;inset:0;
  background:url('https://bedenwellnessflevoland.nl/Hero_images/Main_Bed_en_wellness_malina_deluxe_zwembad.webp') center/cover no-repeat}
#login::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--bg) 86%, transparent) 0%,
    color-mix(in srgb, var(--surface-2) 94%, transparent) 100%)}
.paneel{position:relative;z-index:1;width:100%;max-width:400px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);
  padding:26px 24px;text-align:center}
.logo{width:120px;height:auto;margin:0 auto 16px;display:block}
.welkom{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:13px;margin:6px 0 18px}
.veld{text-align:left;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
input[type=email],input[type=password]{width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-s);padding:8px 10px;font-size:14px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
input::placeholder{color:color-mix(in srgb, var(--muted) 65%, white)}
.btn{width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  padding:9px 16px;border-radius:var(--r-s);font-size:13.5px;font-weight:600}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-rand{width:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r-s);padding:6px 11px;font-size:12.5px;font-weight:600}
.btn-rand:hover{border-color:var(--accent);color:var(--accent)}
.reset{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;
  text-underline-offset:3px;padding:12px 0 0}
.reset:hover{color:var(--accent)}
.msg{font-size:13px;margin:12px 0 0;padding:10px 13px;display:none;text-align:left;border-radius:var(--r-m)}
.msg.err{display:block;background:var(--crit-soft);color:var(--crit)}
.msg.ok{display:block;background:var(--warn-soft);color:var(--ok)}

/* ───────────── zijbalk ───────────── */
.zijbalk{display:none}
@media (min-width:1024px){
  .navbalk{display:none}
  .zijbalk{display:flex;flex-direction:column;gap:22px;position:fixed;top:0;left:0;bottom:0;width:258px;
    z-index:30;background:var(--surface);border-right:1px solid var(--line);padding:20px 16px;overflow-y:auto}
  .zij-merk img{width:112px;height:auto;display:block}
  .zij-wie{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
  .initialen{width:34px;height:34px;flex:none;border-radius:11px;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
  .zij-mail{font-size:12px;color:var(--muted);line-height:1.3;word-break:break-word}
  .zij-nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .zij-kop{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin:16px 0 6px}
  .zij-kop:first-child{margin-top:0}
  .zij-link{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;
    color:var(--ink);font-size:13.5px;font-weight:500;padding:8px 11px;border-radius:var(--r-s)}
  .zij-link:hover,.zij-link:focus-visible{background:var(--surface-2);color:var(--accent)}
  .zij-link .aantal{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line-soft);color:var(--muted)}
  .zij-kaart{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-m);
    padding:14px;margin-top:auto}
  .zij-kaart b{display:block;font-family:var(--f-display);font-size:14px;font-weight:600;margin-bottom:4px}
  .zij-kaart p{margin:0 0 10px;font-size:12px;color:var(--muted);line-height:1.5}
  .zij-kaart .btn-rand{width:100%;text-align:center}
  .inhoud{margin-left:258px;min-height:100dvh}
  .wrap{max-width:none;padding:0 32px}
}

/* ───────────── navigatiebalk (telefoon en tablet) ───────────── */
.navbalk{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.navinner{max-width:1120px;margin:0 auto;padding:0 20px;display:grid;
  grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.navlogo{height:28px;width:auto;display:block}
.navlinks{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlink{text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:500;white-space:nowrap;
  padding:11px 12px 13px;border-bottom:2px solid transparent}
.navlink:hover,.navlink:focus-visible{color:var(--ink);background:var(--surface-2);border-bottom-color:var(--accent)}

/* ───────────── kop ───────────── */
header{padding:22px 0 4px}
h1{font-family:var(--f-display);font-size:clamp(22px,3.4vw,30px);font-weight:700;
  letter-spacing:-.02em;margin:0;line-height:1.15}
.datum{color:var(--muted);font-size:14px;margin:6px 0 0}
.regel{height:1px;background:var(--line);border:0;margin:18px 0 0}
.scheiding{display:none}

/* ───────────── secties ───────────── */
section{padding:22px 0}
h2{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0 0 14px}
.subkop{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--brass);margin:22px 0 8px}
.subkop:first-of-type{margin-top:0}

/* tellers */
.tellers{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:0 0 18px}
.teller{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;position:relative;overflow:hidden}
.teller::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
.teller:nth-child(2)::before{background:var(--brass)}
.teller:nth-child(3)::before{background:var(--ok)}
.teller b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.teller span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-top:4px}

/* lijstregels */
.rij{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:baseline;
  padding:11px 12px;border-bottom:1px solid var(--line-soft);background:var(--surface);
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
.rij:first-child{border-top:1px solid var(--line);border-radius:var(--r-m) var(--r-m) 0 0}
.rij:last-child{border-bottom:1px solid var(--line);border-radius:0 0 var(--r-m) var(--r-m)}
.rij:hover{background:var(--surface-2)}
.tijd{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.tijd.laat{color:var(--crit);font-weight:600}
.naam{font-weight:600;font-size:14px}
.plek{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.plek.laat{color:var(--crit)}
.prio{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.prio.hoog{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
a.prio:hover{border-color:var(--accent);color:var(--accent)}
.leeg{padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin:0}
.fout{font-size:13px;line-height:1.5;background:var(--crit-soft);color:var(--crit);
  padding:11px 14px;border-radius:var(--r-m);margin:0}
.fout code{font-family:var(--f-mono);font-size:.9em}

/* ───────────── tegels ───────────── */
#groepen h2{margin-top:26px}
#groepen h2:first-child{margin-top:0}
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tegel{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--shadow);padding:15px 16px 17px;position:relative;overflow:hidden}
.tegel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
.tegel:hover,.tegel:focus-visible{border-color:var(--accent)}
.tegel:hover .t{color:var(--accent)}
.tegel .t{display:block;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:-.01em}
.tegel .d{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
.tegel.binnenkort{background:var(--surface-2);box-shadow:none;cursor:default}
.tegel.binnenkort::before{background:var(--line)}
.tegel.binnenkort:hover{border-color:var(--line)}
.tegel.binnenkort .t{color:var(--muted)}
.tag{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--line-soft);
  padding:2px 7px;border-radius:999px}

.extern{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.pil{display:inline-flex;align-items:center;text-decoration:none;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);
  padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--ink)}
.pil:hover,.pil:focus-visible{border-color:var(--accent);color:var(--accent)}

/* ───────────── voet en kleurkeuze ───────────── */
footer{border-top:1px solid var(--line);margin-top:8px;padding:16px 0 40px;color:var(--muted);
  font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.themas{display:flex;align-items:center;gap:8px}
.themas .kop{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.staal{width:24px;height:24px;border-radius:8px;padding:0;border:1px solid var(--line)}
.staal[aria-pressed="true"]{border-color:var(--accent);border-width:2px}
.staal.espresso{background:linear-gradient(135deg,#483C34 50%,#9A7B4F 50%)}
.staal.salie   {background:linear-gradient(135deg,#40584B 50%,#8C6F42 50%)}
.staal.leisteen{background:linear-gradient(135deg,#293D4A 50%,#96793F 50%)}

@media (max-width:520px){
  .wrap,.navinner{padding:0 14px}
  .tellers{grid-template-columns:1fr 1fr}
  .tegels{grid-template-columns:1fr}
  .rij{grid-template-columns:48px 1fr auto;gap:9px}
}
@media (hover:none){ .staal{width:28px;height:28px} }
</style>
</head>
<body>

<!-- ══════════ INLOGGEN ══════════ -->
<div id="login">
  <div class="paneel">
    <img class="logo" src="https://bedenwellnessflevoland.nl/Logo/1_Logo.webp" alt="Bed &amp; Wellness Flevoland">
    <p class="welkom">Welkom terug</p>
    <p class="sub">Log in om verder te gaan.</p>

    <div class="veld">
      <label for="email">E-mailadres</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="naam@bedenwellnessflevoland.nl">
    </div>
    <div class="veld">
      <label for="ww">Wachtwoord</label>
      <input id="ww" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="btn" id="knopIn">Inloggen</button>
    <button class="reset" id="knopReset">Wachtwoord vergeten</button>
    <p class="msg" id="loginMsg"></p>
  </div>
</div>

<!-- ══════════ PORTAAL ══════════ -->
<main id="portaal" class="hidden">

  <div class="navbalk">
    <div class="navinner">
      <img class="navlogo" src="https://bedenwellnessflevoland.nl/Logo/1_Logo.webp" alt="BWF">
      <div class="navlinks" id="navlinks"></div>
      <button class="btn-rand" id="knopUit">Uitloggen</button>
    </div>
  </div>

  <aside class="zijbalk">
    <div class="zij-merk">
      <img src="https://bedenwellnessflevoland.nl/Logo/1_Logo.webp" alt="Bed &amp; Wellness Flevoland">
    </div>

    <div class="zij-wie">
      <span class="initialen" id="initialen">–</span>
      <span class="zij-mail" id="zijMail"></span>
    </div>

    <nav class="zij-nav" id="zijNav"></nav>

    <div class="zij-kaart">
      <b>Meer toevoegen</b>
      <p id="zijTeller"></p>
      <button class="btn-rand" id="knopUit2">Uitloggen</button>
    </div>
  </aside>

  <div class="inhoud">
  <div class="wrap">

    <header>
      <h1 id="groet">Goedemorgen</h1>
      <p class="datum" id="datum"></p>
    </header>
    <hr class="regel">

    <div class="kolommen">
    <section aria-labelledby="vandaag">
      <h2 id="vandaag">Vandaag</h2>
      <div class="tellers">
        <div class="teller"><b id="cVandaag">–</b><span>taken vandaag</span></div>
        <div class="teller"><b id="cOpen">–</b><span>open taken</span></div>
        <div class="teller"><b id="cCalls">–</b><span>welkomstcalls</span></div>
      </div>

      <p class="subkop">Taken</p>
      <div id="lijstTaken"><p class="leeg">Bezig met laden…</p></div>

      <p class="subkop">Welkomstcalls</p>
      <div id="lijstCalls"><p class="leeg">Bezig met laden…</p></div>
    </section>
    <hr class="regel scheiding">

    <section aria-label="Onderdelen">
      <div id="groepen"></div>
      <h2>Boekingskanalen</h2>
      <div class="extern" id="extern"></div>
    </section>
    </div>

    <footer>
      <span id="wieben"></span>
      <div class="themas">
        <span class="kop">Kleuren</span>
        <button class="staal espresso" data-kies="espresso" aria-pressed="true"  title="Espresso &amp; goud"        aria-label="Espresso en goud"></button>
        <button class="staal salie"    data-kies="salie"    aria-pressed="false" title="Salie &amp; champagnebrons" aria-label="Salie en champagnebrons"></button>
        <button class="staal leisteen" data-kies="leisteen" aria-pressed="false" title="Leisteenblauw &amp; goud"   aria-label="Leisteenblauw en zacht goud"></button>
      </div>
    </footer>

  </div>
  </div>
</main>

      { t:'Voorraad',            d:'Voorraad en bestellingen',
        url:'dashboard.html', rollen:['eigenaar','medewerker'] },
      { t:'Planning',            d:'Maandkalender per medewerker',    url:null },
      { t:'Contracten',          d:'Overeenkomsten en tarieven',      url:null }
    ]
  },
  {
    kop:'Administratie',
    tegels:[
      { t:'Klantbeheer',        d:'Klantenbestand, nachtregister en members',
        url:'klantbeheer.html', rollen:['eigenaar','medewerker'] },
      { t:'Toeristenbelasting', d:'Aangifte per gemeente',  url:'klantbeheer.html?tab=aangifte' },
      { t:'Financieel',         d:'Omzet, kosten en btw',   url:null },
      { t:'Documenten',         d:'Huisregels en voorwaarden', url:null },
      { t:'Leveranciers',       d:'Vaste afspraken en bestellingen', url:null }
    ]
  },
  {
    kop:'Marketing',
    tegels:[
      { t:'Contentplanning', d:'Social media en berichten', url:null },
      { t:'Advertenties',    d:'Campagnes en budget',       url:null },
      { t:'Events',          d:'Retreats en arrangementen', url:null }
    ]
  },
  {
    kop:'Assistent',
    tegels:[
      { t:'Claude Cowork',      d:'Werksessie voor bouwen en administratie',
        url:'https://claude.ai/cowork/cse_01JzWXnAo3DjUGtDVmaLawdy', extern:true },
      { t:'Virtuele assistent', d:'Vragen stellen over je eigen gegevens', url:null }
    ]
  }
];
// rollen: wie de tegel ziet. Zonder rollen ziet alleen de eigenaar hem.
//   rollen:['eigenaar','medewerker']  → iedereen die inlogt
// url:null maakt de tegel grijs met "nog te bouwen".

const EXTERN = [
  { t:'Planyo',                url:'https://www.planyo.com' },
  { t:'Booking.com',           url:'https://admin.booking.com' },
  { t:'Privésauna',            url:'https://www.privesauna.nl' },
  { t:'Origineel Overnachten', url:'https://www.origineelovernachten.nl' },
  { t:'Mollie',                url:'https://my.mollie.com' }
];
/* ═══════════ EINDE CONFIGURATIE ═══════════ */

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const sb = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);

/* ---------- kleurenschema ---------- */
const ACHTERGROND = { espresso:'#F4F1ED', salie:'#F3F6F2', leisteen:'#F2F5F7' };

function zetThema(naam){
  if(!ACHTERGROND[naam]) naam = 'espresso';
  document.documentElement.dataset.thema = naam;
  $('#themaKleur').setAttribute('content', ACHTERGROND[naam]);
  $$('.staal').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kies === naam)));
  try{ localStorage.setItem('bwf-thema', naam); }catch(e){}
}

let bewaard = null;
try{ bewaard = localStorage.getItem('bwf-thema'); }catch(e){}
zetThema(bewaard || CONFIG.standaardThema);

$$('.staal').forEach(b => b.addEventListener('click', () => zetThema(b.dataset.kies)));

/* ---------- inloggen ---------- */
function toon(soort, tekst){
  const m = $('#loginMsg');
  m.className = 'msg ' + soort;
  m.textContent = tekst;
}

$('#knopIn').addEventListener('click', async () => {
  const email = $('#email').value.trim();
  const ww    = $('#ww').value;
  if(!email || !ww){ toon('err','Vul je e-mailadres en wachtwoord in.'); return; }

  $('#knopIn').disabled = true;
  $('#knopIn').textContent = 'Bezig…';
  const { error } = await sb.auth.signInWithPassword({ email, password: ww });
  $('#knopIn').disabled = false;
  $('#knopIn').textContent = 'Inloggen';

  if(error){
    toon('err', error.message.includes('Invalid')
      ? 'E-mailadres of wachtwoord klopt niet.'
      : 'Inloggen lukte niet: ' + error.message);
  }
});

$('#ww').addEventListener('keydown', e => { if(e.key === 'Enter') $('#knopIn').click(); });

$('#knopReset').addEventListener('click', async () => {
  const email = $('#email').value.trim();
  if(!email){ toon('err','Vul eerst je e-mailadres in.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
  toon(error ? 'err' : 'ok', error ? error.message : 'Er staat een herstelmail in je inbox.');
});

async function uitloggen(){
  await sb.auth.signOut();
  location.reload();
}
$('#knopUit').addEventListener('click', uitloggen);
$('#knopUit2').addEventListener('click', uitloggen);

sb.auth.onAuthStateChange((_e, sessie) => {
  if(sessie){
    $('#login').classList.add('hidden');
    $('#portaal').classList.remove('hidden');
    $('#wieben').textContent = sessie.user.email;
    $('#zijMail').textContent = sessie.user.email;
    $('#initialen').textContent =
      (sessie.user.email || '?').replace(/@.*/,'').slice(0,2).toUpperCase();
    HUIDIGE_ID = sessie.user.id;
    haalRol(sessie.user.id).then(startPortaal);
  }else{
    $('#login').classList.remove('hidden');
    $('#portaal').classList.add('hidden');
  }
});

/* ---------- portaal ---------- */
let gestart = false;
let ROL = 'medewerker';
let rolBekend = false;
let HUIDIGE_ID = null;

async function haalRol(userId){
  try{
    const R = CONFIG.rollen;
    const { data } = await sb.from(R.tabel).select(R.rol).eq('id', userId).maybeSingle();
    if(data && data[R.rol]){ ROL = data[R.rol]; rolBekend = true; }
  }catch(e){}
}

function magZien(tegel){
  if(ROL === 'eigenaar') return true;
  return Array.isArray(tegel.rollen) && tegel.rollen.indexOf(ROL) >= 0;
}

function startPortaal(){
  if(gestart) return;
  gestart = true;

  const nu  = new Date();
  const uur = nu.getHours();
  $('#groet').textContent = uur < 6 ? 'Goedenacht' : uur < 12 ? 'Goedemorgen'
                          : uur < 18 ? 'Goedemiddag' : 'Goedenavond';
  $('#datum').textContent = nu.toLocaleDateString('nl-NL',
    { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  const slug = t => t.toLowerCase().replace(/[^a-z]/g,'');

  const ZICHTBAAR = GROEPEN
    .map(g => ({ kop:g.kop, tegels:g.tegels.filter(magZien) }))
    .filter(g => g.tegels.length > 0);

  const nogTeBouwen = ZICHTBAAR.flatMap(g => g.tegels).filter(t => !t.url).length;

  $('#zijNav').innerHTML =
    `<span class="zij-kop">Overzicht</span>
     <a class="zij-link" href="#vandaag">Vandaag</a>
     <span class="zij-kop">Onderdelen</span>` +
    ZICHTBAAR.map(g => {
      const klaar = g.tegels.filter(t => t.url).length;
      return `<a class="zij-link" href="#${slug(g.kop)}">${g.kop}
              <span class="aantal">${klaar}/${g.tegels.length}</span></a>`;
    }).join('');

  $('#zijTeller').textContent =
    `${nogTeBouwen} onderdelen staan klaar als tegel maar zijn nog niet gebouwd.`;

  $('#navlinks').innerHTML =
    `<a class="navlink" href="#vandaag">Vandaag</a>` +
    ZICHTBAAR.map(g => `<a class="navlink" href="#${slug(g.kop)}">${g.kop}</a>`).join('');

  $('#groepen').innerHTML = ZICHTBAAR.map(g => `
    <h2 id="${slug(g.kop)}">${g.kop}</h2>
    <div class="tegels">` + g.tegels.map(x => x.url
      ? `<a class="tegel" href="${x.url}"${x.extern ? ' target="_blank" rel="noopener"' : ''}><span class="t">${x.t}</span><span class="d">${x.d}</span></a>`
      : `<div class="tegel binnenkort"><span class="t">${x.t}</span><span class="d">${x.d}</span>
         <span class="tag">nog te bouwen</span></div>`
    ).join('') + `</div>`).join('');

  $('#extern').innerHTML = EXTERN.map(x =>
    `<a class="pil" href="${x.url}" target="_blank" rel="noopener">${x.t}</a>`
  ).join('');

  laadDag();

  if(!rolBekend){
    $('#zijTeller').textContent =
      'Beperkte weergave: je staat nog niet als eigenaar in de tabel bwf_rollen.';
  }
}

const vandaag = () => new Date().toLocaleDateString('sv-SE'); // JJJJ-MM-DD, lokale tijd

function fout(waar, tabel, melding){
  $(waar).innerHTML =
    `<p class="fout">Kon niet laden uit <code>${tabel}</code>. ${melding}</p>`;
}

async function laadDag(){
  laadTaken();
  laadCalls();
}

async function laadTaken(){
  const T = CONFIG.taken, dag = vandaag();

  let vraag = sb.from(T.tabel)
    .select([T.titel, T.deadline, T.prioriteit, T.medewerker].join(','))
    .is(T.afgerond, null)
    .order(T.deadline, { ascending:true, nullsFirst:false });

  if(ROL !== 'eigenaar' && HUIDIGE_ID) vraag = vraag.eq(T.medewerker, HUIDIGE_ID);

  const { data, error } = await vraag;
  if(error){ fout('lijstTaken', T.tabel, error.message); return; }

  const rijen = data || [];
  const vandaagOfEerder = rijen.filter(r => r[T.deadline] && r[T.deadline] <= dag);

  $('#cVandaag').textContent = vandaagOfEerder.length;
  $('#cOpen').textContent    = rijen.length;

  $('#lijstTaken').innerHTML = rijen.length === 0
    ? `<p class="leeg">Geen openstaande taken.</p>`
    : rijen.slice(0, 12).map(r => {
        const d = r[T.deadline];
        const laat = d && d < dag;
        const prio = (r[T.prioriteit] || '').toLowerCase();
        return `
        <div class="rij">
          <span class="tijd ${laat ? 'laat' : ''}">${d ? d.slice(8,10) + '-' + d.slice(5,7) : '—'}</span>
          <span><span class="naam">${r[T.titel] || 'Zonder titel'}</span>
                ${laat ? '<span class="plek laat">te laat</span>' : ''}</span>
          <span>${prio ? `<span class="prio ${prio === 'hoog' ? 'hoog' : ''}">${prio}</span>` : ''}</span>
        </div>`;
      }).join('');
}

async function laadCalls(){
  const W = CONFIG.welkomstcalls;

  const { data, error } = await sb.from(W.tabel)
    .select([W.naam, W.datum, W.locatie, W.telefoon].join(','))
    .is(W.gebeld, null)
    .order(W.datum, { ascending:true, nullsFirst:false });

  if(error){ fout('lijstCalls', W.tabel, error.message); $('#cCalls').textContent = '–'; return; }

  const rijen = data || [];
  $('#cCalls').textContent = rijen.length;

  $('#lijstCalls').innerHTML = rijen.length === 0
    ? `<p class="leeg">Alles gebeld.</p>`
    : rijen.slice(0, 12).map(r => {
        const d = r[W.datum];
        return `
        <div class="rij">
          <span class="tijd">${d ? d.slice(8,10) + '-' + d.slice(5,7) : '—'}</span>
          <span><span class="naam">${r[W.naam] || 'Naam onbekend'}</span>
                <span class="plek">${r[W.locatie] || ''}</span></span>
          <span>${r[W.telefoon] ? `<a class="prio" href="tel:${r[W.telefoon]}">bellen</a>` : ''}</span>
        </div>`;
      }).join('');
}
</script>
</body>
</html>
