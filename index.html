<!DOCTYPE html>
<html lang="nl" data-thema="espresso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bed &amp; Wellness Flevoland — portaal</title>
<meta name="theme-color" id="themaKleur" content="#FAF9F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   KLEURENSCHEMA'S — kies er een via de knopjes onderaan,
   of pas hier de waarden aan.
   ═══════════════════════════════════════════════════════════ */

/* 1 — Espresso & goud (standaard) */
[data-thema="espresso"]{
  --paper:#FAF9F7;   /* achtergrond, warm gebroken wit */
  --wit:#FFFFFF;     /* kaarten en panelen            */
  --brand:#483C34;   /* primair, donker espresso      */
  --muted:#5C4F45;   /* secundaire tekst, warm taupe  */
  --zacht:#E8E3DE;   /* zachte vlakken, licht beige   */
  --gold:#D2AF37;    /* accent, luxe goud             */
  --gold-tekst:#9A7E1F; /* accent op wit, leesbaar    */
  --ok:#66735B;      /* positief, olijfgroen          */
  --fout:#A6534F;    /* foutmelding, gedempt rood     */
}

/* 2 — Salie & champagnebrons */
[data-thema="salie"]{
  --paper:#F5F7F3;
  --wit:#FFFFFF;
  --brand:#40584B;
  --muted:#655A50;
  --zacht:#E3EAE3;
  --gold:#B08D57;
  --gold-tekst:#8C6F42;
  --ok:#397052;
  --fout:#A75446;
}

/* 3 — Leisteenblauw & zacht goud */
[data-thema="leisteen"]{
  --paper:#F5F7F8;
  --wit:#FFFFFF;
  --brand:#293D4A;
  --muted:#576369;
  --zacht:#E5EBEE;
  --gold:#C3A15B;
  --gold-tekst:#96793F;
  --ok:#3F756C;
  --fout:#98505A;
}

:root{
  --line:color-mix(in srgb, var(--brand) 24%, transparent);
  --goldline:color-mix(in srgb, var(--gold) 55%, transparent);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--brand);
  font-family:'Jost',system-ui,-apple-system,sans-serif;
  font-weight:400;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--gold-tekst);outline-offset:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 1.4rem}
.hidden{display:none !important}

/* ───────────── inloggen ───────────── */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:1.5rem;position:relative;overflow:hidden}
#login::before{
  content:'';position:absolute;inset:0;
  background:url('https://bedenwellnessflevoland.nl/Hero_images/Main_Bed_en_wellness_malina_deluxe_zwembad.webp') center/cover no-repeat;
  transform:scale(1.04);
}
#login::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--paper) 84%, transparent) 0%,
    color-mix(in srgb, var(--zacht) 94%, transparent) 100%);
}
.paneel{
  position:relative;z-index:1;width:100%;max-width:400px;
  background:var(--wit);border:1px solid var(--goldline);
  box-shadow:0 18px 50px color-mix(in srgb, var(--brand) 16%, transparent);
  padding:2.4rem 2rem 2rem;text-align:center;
}
.logo{width:132px;height:auto;margin:0 auto 1.4rem;display:block}
.welkom{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
  font-size:1.8rem;line-height:1.25;margin:0 0 .35rem;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 1.9rem}
.veld{text-align:left;margin:0 0 1.05rem}
label{display:block;font-size:.79rem;font-weight:500;color:var(--muted);margin:0 0 .4rem;letter-spacing:.04em}
input[type=email],input[type=password]{
  width:100%;padding:.72rem .85rem;background:var(--paper);color:var(--brand);
  border:1px solid var(--line);border-radius:0;font:inherit;font-size:.95rem;
}
input:focus{border-color:var(--gold-tekst);outline:none;background:var(--wit)}
input::placeholder{color:color-mix(in srgb, var(--muted) 60%, white)}
.btn{
  width:100%;padding:.8rem 1rem;border:1px solid var(--brand);border-radius:0;
  background:var(--brand);color:var(--paper);font-weight:500;letter-spacing:.06em;font-size:.9rem;
  transition:background .2s ease,color .2s ease;
}
.btn:hover:not(:disabled){background:transparent;color:var(--brand)}
.btn:disabled{opacity:.5;cursor:wait}
.btn-rand{background:transparent;color:var(--muted);border:1px solid var(--line);
  padding:.48rem .9rem;width:auto;font-size:.8rem;letter-spacing:.05em;
  transition:border-color .2s ease,color .2s ease}
.btn-rand:hover{border-color:var(--gold-tekst);color:var(--gold-tekst)}
.reset{background:none;border:none;color:var(--muted);font-size:.8rem;
  text-decoration:underline;text-underline-offset:3px;padding:.9rem 0 0}
.reset:hover{color:var(--gold-tekst)}
.msg{font-size:.85rem;margin:1rem 0 0;padding:.65rem .8rem;display:none;
  text-align:left;border-left:2px solid}
.msg.err{display:block;color:var(--fout);border-color:var(--fout);
  background:color-mix(in srgb, var(--fout) 8%, white)}
.msg.ok{display:block;color:var(--ok);border-color:var(--ok);
  background:color-mix(in srgb, var(--ok) 8%, white)}

/* ───────────── zijbalk (alleen desktop) ───────────── */
.zijbalk{display:none}

@media (min-width:1024px){
  .navbalk{display:none}

  .zijbalk{
    display:flex;flex-direction:column;gap:2rem;
    position:fixed;top:0;left:0;bottom:0;width:264px;z-index:30;
    background:var(--wit);border-right:1px solid var(--line);
    padding:2rem 1.5rem;overflow-y:auto;
  }
  .zij-merk img{width:118px;height:auto;display:block}

  .zij-wie{display:flex;align-items:center;gap:.75rem;
    padding-bottom:1.4rem;border-bottom:1px solid var(--line)}
  .initialen{
    width:38px;height:38px;flex:0 0 38px;border-radius:50%;
    background:var(--brand);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-size:.82rem;font-weight:500;letter-spacing:.04em;
  }
  .zij-mail{font-size:.78rem;color:var(--muted);line-height:1.3;word-break:break-word}

  .zij-nav{display:flex;flex-direction:column;gap:.15rem;flex:1}
  .zij-kop{font-size:.68rem;letter-spacing:.14em;color:var(--muted);
    text-transform:uppercase;margin:1.4rem 0 .5rem;font-weight:500}
  .zij-kop:first-child{margin-top:0}
  .zij-link{
    display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    text-decoration:none;color:var(--brand);font-size:.92rem;font-weight:500;
    padding:.55rem .7rem;border-left:2px solid transparent;
    transition:background .18s ease,border-color .18s ease,color .18s ease;
  }
  .zij-link:hover,.zij-link:focus-visible{background:var(--zacht);border-left-color:var(--gold)}
  .zij-link .aantal{font-size:.72rem;color:var(--muted);font-weight:400}

  .zij-kaart{background:var(--zacht);padding:1.1rem;margin-top:auto}
  .zij-kaart b{display:block;font-family:'Cormorant Garamond',serif;
    font-size:1.15rem;font-weight:600;margin-bottom:.25rem}
  .zij-kaart p{margin:0 0 .9rem;font-size:.78rem;color:var(--muted);line-height:1.45}
  .zij-kaart .btn-rand{width:100%;text-align:center;background:var(--wit)}

  .inhoud{margin-left:264px;min-height:100dvh}
}

/* ───────────── navigatiebalk (telefoon en tablet) ───────────── */
.navbalk{position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.navinner{max-width:760px;margin:0 auto;padding:0 1.4rem;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem}
.navlogo{height:30px;width:auto;display:block}
.navlinks{display:flex;gap:1.4rem;overflow-x:auto;scrollbar-width:none;padding:.85rem 0}
.navlinks::-webkit-scrollbar{display:none}
.navlink{text-decoration:none;color:var(--muted);font-size:.87rem;font-weight:500;
  white-space:nowrap;padding-bottom:.2rem;border-bottom:2px solid transparent;
  transition:color .2s ease,border-color .2s ease}
.navlink:hover,.navlink:focus-visible{color:var(--brand);border-color:var(--gold)}

/* ───────────── kop ───────────── */
header{padding:2rem 0 1.4rem}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:1.2rem}
.logo-klein{width:96px;height:auto;display:block;margin:0 0 1.5rem}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
  font-size:2.1rem;margin:0;line-height:1.15;letter-spacing:.01em}
.datum{color:var(--muted);font-size:.85rem;margin:.35rem 0 0;letter-spacing:.03em}
.regel{height:1px;background:var(--line);border:none;margin:0}

/* ───────────── vandaag ───────────── */
section{padding:2rem 0}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
  font-size:1.6rem;margin:0 0 1.2rem;letter-spacing:.01em;scroll-margin-top:5rem}
.tellers{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);margin:0 0 1.8rem}
.teller{background:var(--wit);padding:1.1rem .9rem}
.teller b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:2.5rem;line-height:1;color:var(--brand)}
.teller span{display:block;color:var(--muted);font-size:.76rem;margin-top:.45rem;letter-spacing:.04em;font-weight:500}
.rij{display:grid;grid-template-columns:3.8rem 1fr auto;gap:1rem;align-items:baseline;
  padding:1rem 0;border-bottom:1px solid var(--line)}
.rij:first-child{border-top:1px solid var(--line)}
.tijd{color:var(--gold-tekst);font-variant-numeric:tabular-nums;font-weight:500;
  font-size:1.05rem;letter-spacing:.02em}
.naam{font-weight:500;font-size:1.02rem}
.plek{color:var(--muted);font-size:.85rem;display:block;margin-top:.1rem}
.leeg{color:var(--muted);font-size:.9rem;padding:1.1rem 0;font-style:italic}
.fout{color:var(--fout);line-height:1.55;font-size:.9rem;
  background:color-mix(in srgb, var(--fout) 7%, white);
  padding:.9rem 1rem;border-left:2px solid var(--fout);margin:1rem 0 0}
.fout code{background:var(--zacht);padding:.1rem .35rem;font-size:.88em}

/* ───────────── tegels ───────────── */
.tegels{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line)}
.tegel:hover .t{color:var(--gold-tekst)}
.tegel{display:block;text-decoration:none;background:var(--wit);
  padding:1.5rem 1.15rem 1.6rem;min-height:7rem;transition:background .2s ease}
.tegel:hover,.tegel:focus-visible{background:var(--zacht)}
.tegel .t{display:block;font-family:'Cormorant Garamond',serif;font-size:1.42rem;
  font-weight:600;line-height:1.2}
.tegel .d{display:block;color:var(--muted);font-size:.83rem;margin-top:.45rem;line-height:1.45}
#groepen h2{margin-top:2.2rem}
#groepen h2:first-child{margin-top:0}
.tegel.binnenkort{position:relative;background:var(--paper);cursor:default;opacity:.72}
.tegel.binnenkort .t{color:var(--muted)}
.tegel.binnenkort:hover{background:var(--paper)}
.tag{position:absolute;top:.8rem;right:.8rem;font-size:.63rem;letter-spacing:.08em;
  color:var(--muted);border:1px solid var(--line);padding:.15rem .45rem}
.extern{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}
.pil{text-decoration:none;font-size:.85rem;font-weight:500;color:var(--brand);letter-spacing:.03em;
  background:var(--wit);border:1px solid var(--line);padding:.5rem 1rem;
  transition:border-color .2s ease,color .2s ease}
.pil:hover,.pil:focus-visible{border-color:var(--gold-tekst);color:var(--gold-tekst)}

/* ───────────── kleurkeuze ───────────── */
footer{border-top:1px solid var(--line);padding:1.5rem 0 2.5rem;color:var(--muted);
  font-size:.78rem;display:flex;justify-content:space-between;align-items:center;
  gap:1rem;letter-spacing:.04em;flex-wrap:wrap}
.themas{display:flex;align-items:center;gap:.5rem}
.themas .kop{font-size:.75rem;color:var(--muted)}
.staal{width:22px;height:22px;border-radius:50%;padding:0;
  border:1px solid var(--line);transition:transform .18s ease,border-color .18s ease}
.staal:hover{transform:scale(1.15)}
.staal[aria-pressed="true"]{border-color:var(--gold-tekst);border-width:2px;transform:scale(1.15)}
.staal.espresso{background:linear-gradient(135deg,#483C34 50%,#D2AF37 50%)}
.staal.salie   {background:linear-gradient(135deg,#40584B 50%,#B08D57 50%)}
.staal.leisteen{background:linear-gradient(135deg,#293D4A 50%,#C3A15B 50%)}

/* ═══════════ SCHERMFORMATEN ═══════════ */

/* Kleine telefoon (tot 420px) — alles onder elkaar */
@media (max-width:419px){
  .wrap,.navinner{padding:0 1.1rem}
  .navlinks{gap:1.1rem}
  .navlink{font-size:.82rem}
  h1{font-size:1.75rem}
  h2{font-size:1.35rem}
  .teller b{font-size:1.9rem}
  .teller{padding:.85rem .6rem}
  .teller span{font-size:.68rem}
  .tegels{grid-template-columns:1fr}
  .tegel{min-height:0;padding:1.1rem 1rem}
  .logo-klein{width:78px;margin-bottom:1.1rem}
  .rij{grid-template-columns:3.2rem 1fr;gap:.7rem}
  .paneel{padding:2rem 1.4rem 1.6rem}
}

/* Telefoon liggend en kleine tablet (420–767px) */
@media (min-width:420px) and (max-width:767px){
  .tegels{grid-template-columns:repeat(2,1fr)}
}

/* Tablet (768–1023px) */
@media (min-width:768px){
  .wrap,.navinner{max-width:860px;padding:0 2rem}
  .tegels{grid-template-columns:repeat(3,1fr)}
  h1{font-size:2.3rem}
  .logo-klein{width:110px}
  header{padding:2.6rem 0 1.6rem}
  section{padding:2.4rem 0}
}

/* Desktop (vanaf 1024px) — dagoverzicht en tegels naast elkaar */
@media (min-width:1024px){
  .wrap,.navinner{max-width:none;padding:0 3rem}
  .kolommen{display:grid;grid-template-columns:minmax(300px,.85fr) 1.15fr;
    gap:3.5rem;align-items:start}
  .kolommen section{padding:2.6rem 0}
  .scheiding{display:none}
  .tellers{grid-template-columns:repeat(3,1fr)}
  .tegels{grid-template-columns:repeat(2,1fr)}
  .tegel{min-height:8rem;padding:1.7rem 1.3rem}
  h1{font-size:2.5rem}
  .logo-klein{width:120px}
  footer{padding:1.8rem 0 3rem}
}

/* Groot scherm (vanaf 1440px) */
@media (min-width:1440px){
  .tegels{grid-template-columns:repeat(3,1fr)}
  .kolommen{grid-template-columns:minmax(320px,.7fr) 1.3fr;gap:4rem}
}
@media (min-width:1800px){
  .wrap{padding:0 5rem}
}

/* Aanraakschermen — grotere trefvlakken */
@media (hover:none){
  .staal{width:28px;height:28px}
  .themas{gap:.7rem}
  .pil{padding:.6rem 1.1rem}
  .btn-rand{padding:.6rem 1rem}
}

@media (prefers-reduced-motion:reduce){*{transition:none !important}#login::before{transform:none}}
</style>
</head>
<body>

<!-- ══════════ INLOGGEN ══════════ -->
<div id="login">
  <div class="paneel">
    <img class="logo" src="https://bedenwellnessflevoland.nl/Logo/1_Logo.webp" alt="Bed &amp; Wellness Flevoland">
    <p class="welkom">Welkom terug</p>
    <p class="sub">Log in om verder te gaan.</p>

    <div class="veld">
      <label for="email">E-mailadres</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="naam@bedenwellnessflevoland.nl">
    </div>
    <div class="veld">
      <label for="ww">Wachtwoord</label>
      <input id="ww" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="btn" id="knopIn">Inloggen</button>
    <button class="reset" id="knopReset">Wachtwoord vergeten</button>
    <p class="msg" id="loginMsg"></p>
  </div>
</div>

<!-- ══════════ PORTAAL ══════════ -->
<main id="portaal" class="hidden">

  <div class="navbalk">
    <div class="navinner">
      <img class="navlogo" src="https://bedenwellnessflevoland.nl/Logo/1_Logo.webp" alt="BWF">
      <div class="navlinks" id="navlinks"></div>
      <button class="btn-rand" id="knopUit">Uitloggen</button>
    </div>
  </div>

  <aside class="zijbalk">
    <div class="zij-merk">
      <img src="https://bedenwellnessflevoland.nl/Logo/1_Logo.webp" alt="Bed &amp; Wellness Flevoland">
    </div>

    <div class="zij-wie">
      <span class="initialen" id="initialen">–</span>
      <span class="zij-mail" id="zijMail"></span>
    </div>

    <nav class="zij-nav" id="zijNav"></nav>

    <div class="zij-kaart">
      <b>Meer toevoegen</b>
      <p id="zijTeller"></p>
      <button class="btn-rand" id="knopUit2">Uitloggen</button>
    </div>
  </aside>

  <div class="inhoud">
  <div class="wrap">

    <header>
      <h1 id="groet">Goedemorgen</h1>
      <p class="datum" id="datum"></p>
    </header>
    <hr class="regel">

    <div class="kolommen">
    <section aria-labelledby="vandaag">
      <h2 id="vandaag">Vandaag</h2>
      <div class="tellers">
        <div class="teller"><b id="cAankomst">–</b><span>aankomsten</span></div>
        <div class="teller"><b id="cVertrek">–</b><span>vertrekken</span></div>
        <div class="teller"><b id="cIncheck">–</b><span>online ingecheckt</span></div>
      </div>
      <div id="lijst"><p class="leeg">Bezig met laden…</p></div>
    </section>
    <hr class="regel scheiding">

    <section aria-label="Onderdelen">
      <div id="groepen"></div>
      <h2>Boekingskanalen</h2>
      <div class="extern" id="extern"></div>
    </section>
    </div>

    <footer>
      <span id="wieben"></span>
      <div class="themas">
        <span class="kop">Kleuren</span>
        <button class="staal espresso" data-kies="espresso" aria-pressed="true"  title="Espresso &amp; goud"        aria-label="Espresso en goud"></button>
        <button class="staal salie"    data-kies="salie"    aria-pressed="false" title="Salie &amp; champagnebrons" aria-label="Salie en champagnebrons"></button>
        <button class="staal leisteen" data-kies="leisteen" aria-pressed="false" title="Leisteenblauw &amp; goud"   aria-label="Leisteenblauw en zacht goud"></button>
      </div>
    </footer>

  </div>
  </div>
</main>

      { t:'Urenregistratie',     d:'Uren per medewerker',            url:'uren-ruth.html' },
      { t:'Contracten',          d:'Overeenkomsten en tarieven',     url:null },
      { t:'Werkzaamheden',       d:'Taken en bellijsten',            url:null }
    ]
  },
  {
    kop:'Administratie',
    tegels:[
      { t:'Gastenregister',  d:'Nachtregister en toeristenbelasting', url:null },
      { t:'Klantenbestand',  d:'Gasten, segmenten en historie',       url:null },
      { t:'Financieel',      d:'Omzet, kosten en btw',                url:null },
      { t:'Documenten',      d:'Huisregels en voorwaarden',           url:null },
      { t:'Leveranciers',    d:'Vaste afspraken en bestellingen',     url:null }
    ]
  },
  {
    kop:'Marketing',
    tegels:[
      { t:'Contentplanning', d:'Social media en berichten', url:null },
      { t:'Advertenties',    d:'Campagnes en budget',       url:null },
      { t:'Events',          d:'Retreats en arrangementen', url:null }
    ]
  },
  {
    kop:'Assistent',
    tegels:[
      { t:'Virtuele assistent', d:'Vragen stellen over je eigen gegevens', url:null }
    ]
  }
];
// url:null = tegel wordt grijs met "nog te bouwen". Zodra de pagina bestaat,
// vervang null door de bestandsnaam tussen aanhalingstekens, bijvoorbeeld:
//   url:'bwf-gastenapp.html?suite=angie'
// Een pagina in een andere repo? Zet de volledige https-link neer.

const EXTERN = [
  { t:'Planyo',                url:'https://www.planyo.com' },
  { t:'Booking.com',           url:'https://admin.booking.com' },
  { t:'Privésauna',            url:'https://www.privesauna.nl' },
  { t:'Origineel Overnachten', url:'https://www.origineelovernachten.nl' },
  { t:'Mollie',                url:'https://my.mollie.com' }
];
/* ═══════════ EINDE CONFIGURATIE ═══════════ */

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const sb = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);

/* ---------- kleurenschema ---------- */
const ACHTERGROND = { espresso:'#FAF9F7', salie:'#F5F7F3', leisteen:'#F5F7F8' };

function zetThema(naam){
  if(!ACHTERGROND[naam]) naam = 'espresso';
  document.documentElement.dataset.thema = naam;
  $('#themaKleur').setAttribute('content', ACHTERGROND[naam]);
  $$('.staal').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kies === naam)));
  try{ localStorage.setItem('bwf-thema', naam); }catch(e){}
}

let bewaard = null;
try{ bewaard = localStorage.getItem('bwf-thema'); }catch(e){}
zetThema(bewaard || CONFIG.standaardThema);

$$('.staal').forEach(b => b.addEventListener('click', () => zetThema(b.dataset.kies)));

/* ---------- inloggen ---------- */
function toon(soort, tekst){
  const m = $('#loginMsg');
  m.className = 'msg ' + soort;
  m.textContent = tekst;
}

$('#knopIn').addEventListener('click', async () => {
  const email = $('#email').value.trim();
  const ww    = $('#ww').value;
  if(!email || !ww){ toon('err','Vul je e-mailadres en wachtwoord in.'); return; }

  $('#knopIn').disabled = true;
  $('#knopIn').textContent = 'Bezig…';
  const { error } = await sb.auth.signInWithPassword({ email, password: ww });
  $('#knopIn').disabled = false;
  $('#knopIn').textContent = 'Inloggen';

  if(error){
    toon('err', error.message.includes('Invalid')
      ? 'E-mailadres of wachtwoord klopt niet.'
      : 'Inloggen lukte niet: ' + error.message);
  }
});

$('#ww').addEventListener('keydown', e => { if(e.key === 'Enter') $('#knopIn').click(); });

$('#knopReset').addEventListener('click', async () => {
  const email = $('#email').value.trim();
  if(!email){ toon('err','Vul eerst je e-mailadres in.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
  toon(error ? 'err' : 'ok', error ? error.message : 'Er staat een herstelmail in je inbox.');
});

async function uitloggen(){
  await sb.auth.signOut();
  location.reload();
}
$('#knopUit').addEventListener('click', uitloggen);
$('#knopUit2').addEventListener('click', uitloggen);

sb.auth.onAuthStateChange((_e, sessie) => {
  if(sessie){
    $('#login').classList.add('hidden');
    $('#portaal').classList.remove('hidden');
    $('#wieben').textContent = sessie.user.email;
    $('#zijMail').textContent = sessie.user.email;
    $('#initialen').textContent =
      (sessie.user.email || '?').replace(/@.*/,'').slice(0,2).toUpperCase();
    startPortaal();
  }else{
    $('#login').classList.remove('hidden');
    $('#portaal').classList.add('hidden');
  }
});

/* ---------- portaal ---------- */
let gestart = false;
function startPortaal(){
  if(gestart) return;
  gestart = true;

  const nu  = new Date();
  const uur = nu.getHours();
  $('#groet').textContent = uur < 6 ? 'Goedenacht' : uur < 12 ? 'Goedemorgen'
                          : uur < 18 ? 'Goedemiddag' : 'Goedenavond';
  $('#datum').textContent = nu.toLocaleDateString('nl-NL',
    { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  const slug = t => t.toLowerCase().replace(/[^a-z]/g,'');

  const nogTeBouwen = GROEPEN.flatMap(g => g.tegels).filter(t => !t.url).length;

  $('#zijNav').innerHTML =
    `<span class="zij-kop">Overzicht</span>
     <a class="zij-link" href="#vandaag">Vandaag</a>
     <span class="zij-kop">Onderdelen</span>` +
    GROEPEN.map(g => {
      const klaar = g.tegels.filter(t => t.url).length;
      return `<a class="zij-link" href="#${slug(g.kop)}">${g.kop}
              <span class="aantal">${klaar}/${g.tegels.length}</span></a>`;
    }).join('');

  $('#zijTeller').textContent =
    `${nogTeBouwen} onderdelen staan klaar als tegel maar zijn nog niet gebouwd.`;

  $('#navlinks').innerHTML =
    `<a class="navlink" href="#vandaag">Vandaag</a>` +
    GROEPEN.map(g => `<a class="navlink" href="#${slug(g.kop)}">${g.kop}</a>`).join('');

  $('#groepen').innerHTML = GROEPEN.map(g => `
    <h2 id="${slug(g.kop)}">${g.kop}</h2>
    <div class="tegels">` + g.tegels.map(x => x.url
      ? `<a class="tegel" href="${x.url}"><span class="t">${x.t}</span><span class="d">${x.d}</span></a>`
      : `<div class="tegel binnenkort"><span class="t">${x.t}</span><span class="d">${x.d}</span>
         <span class="tag">nog te bouwen</span></div>`
    ).join('') + `</div>`).join('');

  $('#extern').innerHTML = EXTERN.map(x =>
    `<a class="pil" href="${x.url}" target="_blank" rel="noopener">${x.t}</a>`
  ).join('');

  laadDag();
}

const vandaag = () => new Date().toLocaleDateString('sv-SE'); // JJJJ-MM-DD, lokale tijd

async function laadDag(){
  const R = CONFIG.reserveringen;
  const dag = vandaag();

  const naamVelden = Array.isArray(R.naam) ? R.naam : [R.naam];
  let velden = [R.aankomst, ...naamVelden, R.locatie];
  if(R.tijd) velden.push(R.tijd);

  const { data: aank, error: fout } = await sb
    .from(R.tabel)
    .select(velden.join(','))
    .eq(R.aankomst, dag);

  if(fout){
    $('#lijst').innerHTML =
      `<p class="fout">Het dagoverzicht kon niet laden. Controleer tabel- en kolomnamen in het
       configuratieblok (nu: <code>${R.tabel}</code>). Melding: ${fout.message}</p>`;
    return;
  }

  const rijen = (aank || []).sort((a,b) =>
    String(a[R.tijd] || '').localeCompare(String(b[R.tijd] || '')));

  $('#cAankomst').textContent = rijen.length;

  $('#lijst').innerHTML = rijen.length === 0
    ? `<p class="leeg">Geen aankomsten vandaag.</p>`
    : rijen.map(r => `
        <div class="rij">
          <span class="tijd">${(r[R.tijd] || '').toString().slice(0,5) || '—'}</span>
          <span><span class="naam">${naamVelden.map(v => r[v]).filter(Boolean).join(' ') || 'Naam onbekend'}</span>
                <span class="plek">${r[R.locatie] || ''}</span></span>
          <span></span>
        </div>`).join('');

  if(R.vertrek){
    const { count } = await sb.from(R.tabel)
      .select('*', { count:'exact', head:true }).eq(R.vertrek, dag);
    $('#cVertrek').textContent = count ?? '–';
  }

  const C = CONFIG.checkins;
  const { count: ci } = await sb.from(C.tabel)
    .select('*', { count:'exact', head:true })
    .gte(C.datum, dag + 'T00:00:00');
  $('#cIncheck').textContent = ci ?? '–';
}
</script>
