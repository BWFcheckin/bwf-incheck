<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14342A">
<title>Werkzaamheden overzicht — Bed &amp; Wellness Flevoland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F1; --surface:#FFFFFF; --surface-2:#FBF9F5; --line:#E6E1D7; --line-soft:#F0ECE4;
  --ink:#1D2420; --ink-2:#46514A; --muted:#7E8A82;
  --groen:#14342A; --groen-2:#1F4D3D; --groen-zacht:#E7EFEA;
  --goud:#B9975B; --goud-zacht:#F6EFE1;
  --ok:#2E7D53; --ok-zacht:#E6F2EA;
  --warn:#B8860B; --warn-zacht:#FBF1DA;
  --crit:#B3453A; --crit-zacht:#FBEAE7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12160F; --surface:#1A201A; --surface-2:#161B15; --line:#2C3329; --line-soft:#232A22;
    --ink:#E9EEE6; --ink-2:#B6C0B2; --muted:#8B978A;
    --groen-zacht:#1B2C24; --goud-zacht:#2A2314; --ok-zacht:#152A1E;
    --warn-zacht:#2A2314; --crit-zacht:#2C1917;
  }
}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1A201A; --surface-2:#161B15; --line:#2C3329; --line-soft:#232A22;
  --ink:#E9EEE6; --ink-2:#B6C0B2; --muted:#8B978A;
  --groen-zacht:#1B2C24; --goud-zacht:#2A2314; --ok-zacht:#152A1E;
  --warn-zacht:#2A2314; --crit-zacht:#2C1917;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{overscroll-behavior-x:none;overflow-x:clip}
body{margin:0;max-width:100%;overflow-x:clip;overscroll-behavior-x:none;
  background:var(--bg);color:var(--ink);
  font:15px/1.5 "Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 70px}
h1{font:600 27px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 3px}
h2{font:600 19px/1.25 "Cormorant Garamond",Georgia,serif;margin:0}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}

.melding{border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:13.5px;
  background:var(--groen-zacht);border:1px solid var(--line)}
.melding.fout{background:var(--crit-zacht);border-color:var(--crit);color:var(--crit)}
.melding.let{background:var(--warn-zacht);border-color:var(--warn)}
.melding.goed{background:var(--ok-zacht);border-color:var(--ok);color:var(--ok)}

.kaart{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:0 0 14px}
.kaart-kop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 10px}
.kaart-kop .hint{color:var(--muted);font-size:12.5px}

label.veld{display:block;font-size:12.5px;color:var(--ink-2)}
input,select{font:inherit;font-size:16px;margin-top:3px;padding:9px 10px;min-height:42px;
  max-width:100%;border:1px solid var(--line);border-radius:9px;
  background:var(--surface-2);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--groen-2);outline-offset:-1px}
.knop{font:inherit;font-size:14px;padding:9px 14px;border-radius:9px;cursor:pointer;min-height:42px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.knop.vol{background:var(--groen);border-color:var(--groen);color:#fff;font-weight:600}
.knop.klein{min-height:34px;padding:5px 10px;font-size:12.5px}
.knop:hover{border-color:var(--groen-2)}
.knop[disabled]{opacity:.45;cursor:default}

/* ---- de werkzaamheden om aan te tikken ---- */
/* Alles krimpt mee en breekt naar een nieuwe regel als het niet past. Op een
   telefoon van 390px liep het notitieveld anders buiten de kaart: de pagina
   schoof niet (overflow-x:clip), maar het veld was half onbruikbaar. */
.werk{display:flex;flex-wrap:wrap;gap:9px 12px;align-items:flex-end;
  padding:13px 0;border-top:1px solid var(--line-soft)}
.werk:first-of-type{border-top:0}
.werk-naam{flex:1 1 100%;min-width:0}
.werk-naam b{display:block;font-size:14.5px;font-weight:600}
.werk-naam span{display:block;color:var(--muted);font-size:12.5px}
.werk-prijs{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;
  color:var(--groen-2);background:var(--groen-zacht);border-radius:99px;padding:2px 9px}
.werk-invoer{flex:1 1 100%;min-width:0;display:flex;gap:8px;align-items:flex-end}
.werk-invoer label{flex:1 1 auto;min-width:0}
.werk-invoer label.getal{flex:0 0 124px}
.werk-invoer input{width:100%}
.werk-invoer input[type=number]{font-variant-numeric:tabular-nums}
/* bedrag en knop samen op één regel, rechts uitgelijnd */
.werk-voet{flex:1 1 100%;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.werk-uit{font-weight:700;font-size:16.5px;font-variant-numeric:tabular-nums}
@media (min-width:700px){
  .werk-naam{flex:1 1 240px}
  .werk-invoer{flex:0 1 auto}
  .werk-invoer label{flex:0 1 160px}
  .werk-voet{flex:0 0 auto}
}

/* ---- rekenhulp bij een percentage-tarief ---- */
.hulp{flex:1 1 100%;margin-top:2px}
.hulp>summary{cursor:pointer;font-size:13px;color:var(--groen-2);font-weight:600;
  padding:5px 0;list-style:none;display:inline-flex;align-items:center;gap:6px}
.hulp>summary::-webkit-details-marker{display:none}
.hulp>summary::before{content:"▸";font-size:11px;transition:transform .15s}
.hulp[open]>summary::before{transform:rotate(90deg)}
.hulp-binnen{border:1px solid var(--line);border-radius:11px;padding:11px 12px;
  background:var(--surface-2);margin-top:4px}
/* Bewust GEEN max-height met eigen scrollbalk: met vier categorieën viel de
   laatste dan onder de rand, zonder dat iets liet zien dat er meer was. De
   categorieën zijn uitklapbaar; dat is de manier om het kort te houden. */
.hulp-lijst{margin-top:10px}
.cat{border-top:1px solid var(--line-soft);padding:4px 0}
.cat:first-child{border-top:0}
.cat>summary{cursor:pointer;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);padding:5px 0}
.cat>summary span{font-weight:500;text-transform:none;letter-spacing:0;opacity:.7}
.pos{display:flex;gap:10px;align-items:center;padding:4px 0 4px 2px}
.pos-naam{flex:1 1 auto;min-width:0;font-size:13.5px;line-height:1.3}
.pos-naam span{display:block;color:var(--muted);font-size:12px;
  font-variant-numeric:tabular-nums}
.pos input{flex:0 0 64px;width:64px;min-height:36px;padding:5px 7px;font-size:15px;
  text-align:center;font-variant-numeric:tabular-nums;margin-top:0}
.hulp-voet{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.hulp-voet>div{flex:1 1 auto;font-size:13.5px;color:var(--muted)}
.hulp-voet b{color:var(--ink);font-size:16.5px;font-variant-numeric:tabular-nums}

/* ---- totalen ---- */
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 12px}
.tegel{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.tegel span{display:block;font-size:12px;color:var(--muted)}
.tegel b{display:block;font-size:21px;font-variant-numeric:tabular-nums;margin-top:2px}
.tegel.open b{color:var(--goud)}
.tegel.uitbetaald b{color:var(--ok)}

/* ---- lijst ---- */
.dag{border-top:1px solid var(--line-soft);padding:10px 0}
.dag:first-child{border-top:0}
.dag-kop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  font-size:12.5px;color:var(--muted);margin:0 0 5px}
.dag-kop b{color:var(--ink);font-size:13.5px;font-variant-numeric:tabular-nums}
.regel{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
/* Het vakje om een opgeslagen regel te wijzigen. Angela, 08-10-2026. */
.regel{flex-wrap:wrap}
.regelbewerk{flex-basis:100%}
.bewerkrij{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  border-top:1px solid var(--rand,#E4E0D8);margin-top:8px;padding-top:10px}
.bewerkrij .veld{flex:0 1 150px}
.bewerkrij .veld.breed{flex:1 1 220px}
.bewerkknoppen{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bewerkmeld{font-size:12.5px;color:var(--stil,#6E7872)}
.regel .wat{flex:1 1 auto;min-width:0}
.regel .wat em{font-style:normal;color:var(--muted);font-size:12.5px}
.regel .bed{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.vlag{font-size:11px;border-radius:99px;padding:2px 8px;white-space:nowrap;
  background:var(--goud-zacht);color:var(--warn);border:1px solid var(--warn)}
.vlag.uit{background:var(--ok-zacht);color:var(--ok);border-color:var(--ok)}
.leeg{color:var(--muted);font-size:13.5px;padding:14px 0}

#slot{position:fixed;inset:0;z-index:99;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px}
body.bwf-vergrendeld .wrap{display:none}
.uitleg{font-size:12.5px;color:var(--muted);margin:8px 0 0}
@media print{.kaart.geen-print,.knop,#bwfTop{display:none !important}}
</style>
</head>
<body>

<div id="bwfTop"></div>

<div id="slot" hidden>
  <div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:18px;max-width:340px;width:100%">
    <h2 style="margin:0 0 8px">Inloggen</h2>
    <p class="uitleg" id="lgFout" style="color:var(--crit)"></p>
    <label class="veld">E-mailadres <input type="email" id="lgMail" autocomplete="username" style="width:100%"></label>
    <label class="veld" style="margin-top:8px">Wachtwoord
      <input type="password" id="lgWw" autocomplete="current-password" style="width:100%"></label>
    <div style="margin-top:12px"><button class="knop vol" type="button" id="lgKnop">Inloggen</button></div>
  </div>
</div>

<div class="wrap">
  <h1>Werkzaamheden overzicht</h1>
  <p class="sub" id="subtitel">Zet erbij wat je hebt gedaan. Het bedrag rekent zichzelf uit.</p>
  <div class="melding" id="melding" hidden></div>

  <!-- ============ registreren ============ -->
  <div class="kaart geen-print" id="kaartInvoer" hidden>
    <div class="kaart-kop">
      <h2>Wat heb je gedaan?</h2>
      <span class="hint">Kies eerst de datum, vul dan in bij de regel die klopt.</span>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:0 0 4px">
      <label class="veld">Datum <input type="date" id="iDatum"></label>
      <label class="veld" id="wieVak" hidden>Voor wie <select id="iWie"></select></label>
    </div>

    <div id="werkLijst"></div>
  </div>

  <!-- ============ uren bijhouden ============
       Angela, 06-10-2026: "een invoerveld waarin per dag met datum uren
       geplaatst kunnen worden, keuze aantal uur of start- en eindtijd, zonder
       bedrag. Dit is om de maanduren bij te houden."

       Bewust een eigen blok en niet een extra tarief: hier hoort geen bedrag
       bij, en een tarief van 0,00 tussen de echte tarieven nodigt uit tot
       vergissingen. De regels komen wel in hetzelfde overzicht terecht, zodat
       je ze per maand bij elkaar ziet. -->
  <div class="kaart geen-print" id="kaartUren" hidden>
    <div class="kaart-kop">
      <h2>Uren bijhouden</h2>
      <span class="hint">zonder bedrag &mdash; alleen om de maanduren bij te houden</span>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <label class="veld">Datum <input type="date" id="uDatum"></label>
      <label class="veld" id="uWieVak" hidden>Voor wie <select id="uWie"></select></label>
      <label class="veld">Invoeren als
        <select id="uWijze">
          <option value="aantal">Aantal uur</option>
          <option value="tijden">Start- en eindtijd</option>
        </select></label>
      <!-- Bewust type=text en geen type=number: een getalveld weigert de komma,
           en dan leest "3,5" als leeg. Gemeten op 06-10-2026: het vakje zei
           dan 0 uur terwijl er 3,5 stond. -->
      <label class="veld" id="uAantalVak">Aantal uur
        <input type="text" id="uAantal" inputmode="decimal" autocomplete="off"
               placeholder="bijv. 3,5"></label>
      <label class="veld" id="uVanVak" hidden>Van <input type="time" id="uVan"></label>
      <label class="veld" id="uTotVak" hidden>Tot <input type="time" id="uTot"></label>
    </div>

    <label class="veld" style="display:block;margin-top:10px">Notitie
      <span style="color:var(--stil,#6E7872);font-weight:400">(mag leeg)</span>
      <input type="text" id="uNotitie" placeholder="bijv. voorbereiding weekend, administratie"></label>

    <div class="werk-voet" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px">
      <div class="werk-uit" id="uUit">0 uur</div>
      <button class="knop vol" type="button" id="uZet">Uren erbij zetten</button>
    </div>
  </div>

  <!-- ============ overzicht ============ -->
  <div class="kaart">
    <div class="kaart-kop">
      <h2>Overzicht</h2>
      <span class="hint" id="periodeHint"></span>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:0 0 12px">
      <label class="veld">Maand <input type="month" id="fMaand"></label>
      <label class="veld">Tonen
        <select id="fStand">
          <option value="">Alles</option>
          <option value="open">Nog te ontvangen</option>
          <option value="uitbetaald">Al uitbetaald</option>
        </select></label>
      <button class="knop geen-print" type="button" id="fVernieuw">Vernieuwen</button>
      <button class="knop geen-print" type="button" id="fCsv">Uitdraai (CSV)</button>
    </div>

    <div class="tegels" id="tegels"></div>
    <div id="lijst"><p class="leeg">Bezig met laden&hellip;</p></div>
  </div>

  <p class="uitleg" id="voetnoot"></p>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const eur = (n) => "€ " + (Number(n) || 0).toLocaleString("nl-NL",
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const CFG = {
  url: "https://iuyjvtlauktnjprbmbjj.supabase.co",
  key: "sb_publishable_SfQjQTwKa3BgCtjwE-8ljw_mTpqEY3U",
  ls:  "sb-iuyjvtlauktnjprbmbjj-auth-token"
};

let SESSIE = null, verversBezig = null;
let ROL = null, IK = null;          /* IK = {id, naam, uurtarief} uit wz_medewerkers */
const TABEL_WERK = "wz_werkzaamheden";
let TARIEVEN = [], WERK = [], MENSEN = [], EXTRAS = [];
/* Met ?mw=<id> toont deze pagina één persoon in plaats van iedereen. Het
   dashboard gebruikt dat om per medewerker een eigen balk te tonen. Alleen de
   eigenaar ziet meer dan zichzelf, dus voor Kelly verandert er niets: de
   database geeft haar toch alleen haar eigen regels. Angela, 06-10-2026. */
const ALLEEN_WIE = (function () {
  try {
    const p = new URLSearchParams(location.search).get("mw");
    return p ? String(p).trim() : "";
  } catch (e) { return ""; }
})();
const ALLEEN_NAAM = (function () {
  try {
    const p = new URLSearchParams(location.search).get("naam");
    return p ? String(p).trim() : "";
  } catch (e) { return ""; }
})();

/* =========================================================
   sessie en netwerk — zelfde aanpak als het financieel overzicht
   ========================================================= */
function jwtDeel(t) {
  try { return JSON.parse(atob(String(t).split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))); }
  catch (e) { return {}; }
}
function leesSessie() {
  try { SESSIE = JSON.parse(localStorage.getItem(CFG.ls) || "null"); } catch (e) { SESSIE = null; }
  return SESSIE;
}
function bewaarSessie(d) {
  SESSIE = d;
  try { localStorage.setItem(CFG.ls, JSON.stringify(d)); } catch (e) {}
}
async function ververs() {
  if (!SESSIE || !SESSIE.refresh_token) return null;
  try {
    const r = await fetch(CFG.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: { apikey: CFG.key, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: SESSIE.refresh_token })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) return null;
    bewaarSessie(d);
    return d.access_token;
  } catch (e) { return null; }
}
async function geldigToken() {
  if (!SESSIE || !SESSIE.access_token) return null;
  const exp = (jwtDeel(SESSIE.access_token).exp || 0) * 1000;
  if (exp - Date.now() > 60000) return SESSIE.access_token;
  if (!verversBezig) verversBezig = ververs().finally(() => { verversBezig = null; });
  return verversBezig;
}
function toonSlot(t) {
  document.body.classList.add("bwf-vergrendeld");
  $("#slot").hidden = false;
  $("#lgFout").textContent = t || "";
  setTimeout(() => $("#lgMail").focus(), 60);
}
function verbergSlot() {
  document.body.classList.remove("bwf-vergrendeld");
  $("#slot").hidden = true;
}
async function api(pad, opties = {}) {
  const token = await geldigToken();
  if (!token) { toonSlot("Je sessie is verlopen. Log opnieuw in."); throw new Error("Niet ingelogd."); }
  const headers = { apikey: CFG.key, Authorization: "Bearer " + token };
  if (opties.body !== undefined) {
    headers["Content-Type"] = "application/json";
    headers.Prefer = opties.prefer || "return=representation";
  }
  const r = await fetch(CFG.url + "/rest/v1/" + pad, {
    method: opties.method || "GET", headers,
    body: opties.body === undefined ? undefined : JSON.stringify(opties.body)
  });
  const tekst = await r.text();
  if (r.status === 401) { toonSlot("Je sessie is verlopen."); throw new Error("Niet ingelogd."); }
  if (!r.ok) {
    let m = tekst;
    try { m = JSON.parse(tekst).message || tekst; } catch (e) {}
    throw new Error(m || "Fout " + r.status);
  }
  return tekst ? JSON.parse(tekst) : null;
}
function melding(t, soort) {
  const m = $("#melding");
  m.textContent = t || "";
  m.className = "melding" + (soort ? " " + soort : "");
  m.hidden = !t;
}

/* =========================================================
   De rekenregel
   =========================================================
   Angela, 30-09-2026: "Extra omzet upsel Kelly geeft aan wat ze heeft
   bijgeboekt en over het totaal wordt dan 10% berekend."

   Er zijn drie soorten tarieven, en de EENHEID zegt welke:

     eenheid 'omzet'   het ingevulde getal is een BEDRAG in euro's, en
                       `tarief` is een deel van 1 (0.10 = tien procent).
                       bedrag = omzet x 0,10
     soort 'uur'       het ingevulde getal is een aantal keer, elke keer
                       kost `uren` uur, maal het uurloon van de persoon.
     de rest           het ingevulde getal is een stuktal.
                       bedrag = aantal x tarief

   Het uurloon hangt aan de persoon, niet aan het tarief. Wie geen uurloon
   heeft ingevuld kan geen uurwerk registreren: dat zou stilletjes op nul
   uitkomen en dat is erger dan een duidelijke melding.
   ========================================================= */
const isProcent = (t) => t && t.eenheid === "omzet";

function rekenRegel(tarief, invoer, uurloon) {
  const t = Number(tarief && tarief.tarief) || 0;
  const a = Number(invoer) || 0;
  if (!tarief || a <= 0) return { bedrag: 0, uren: 0, perEenheid: t, uitleg: "" };

  if (isProcent(tarief)) {
    return { bedrag: a * t, uren: 0, perEenheid: t,
      uitleg: pct(t) + " van " + eur(a) };
  }
  if (tarief.soort === "uur") {
    const urenPer = Number(tarief.uren) || 0, loon = Number(uurloon) || 0;
    return { bedrag: a * urenPer * loon, uren: a * urenPer, perEenheid: urenPer * loon,
      uitleg: a + " × " + urenPer + " uur × " + eur(loon) };
  }
  return { bedrag: a * t, uren: 0, perEenheid: t,
    uitleg: a + " × " + eur(t) };
}
function pct(fractie) {
  const p = Math.round(Number(fractie) * 10000) / 100;
  return String(p).replace(".", ",") + "%";
}
/* Wat staat er op het bolletje achter de naam van een werkzaamheid */
function prijsTekst(t, uurloon) {
  if (isProcent(t)) return pct(t.tarief) + " van de omzet";
  if (t.soort === "uur") {
    const loon = Number(uurloon) || 0;
    if (!loon) return "uurwerk — geen uurtarief ingesteld";
    return eur((Number(t.uren) || 0) * loon) + " per keer";
  }
  return eur(t.tarief) + " per " + (t.eenheid === "record" ? "klant" : t.eenheid);
}
/* Wat vraagt het invoerveld */
function invoerLabel(t) {
  if (isProcent(t)) return "Omzet €";
  if (t.eenheid === "record") return "Aantal klanten";
  if (t.eenheid === "dag") return "Aantal dagen";
  if (t.soort === "uur") return "Aantal keer";
  return "Aantal";
}
/* Een dagtarief betaalt het bereikbaar zijn, niet het tellen. Angela,
   30-09-2026, over de appjes: "per dag". Daarom staat er alvast een 1 in:
   Kelly hoeft alleen nog op "Zet erbij" te tikken. */
const isPerDag = (t) => t && t.eenheid === "dag";

/* =========================================================
   Het invulblok
   ========================================================= */
/* Welke werkzaamheden staan er in de lijst?
   =========================================================
   Angela, 30-09-2026: "voor haar alleen de opties in de keuzelijst laten zien
   bij het opgeven van de werkzaamheden, en later eventueel extra
   werkzaamheden toevoegen."

   De hele tarievenlijst tonen was verkeerd: daar staat ook het wellness-werk
   in (dagverblijf, uitcheck, schoonmaak) en dat doet Kelly niet. De categorie
   maakt het onderscheid dat er al is: alles onder BACKOFFICE is haar werk.

   Wil je er later iets bij: zet in vr2 (Werk & tarieven -> Tarieven) een nieuw
   tarief neer met categorie Backoffice, en het staat hier vanzelf tussen. Een
   tarief op Wellness of Marketing komt hier niet in beeld.

   De eigenaar ziet wél alles, want die boekt ook voor anderen. */
const VOOR_BACKOFFICE = "Backoffice";

function bruikbareTarieven() {
  const loon = Number(IK && IK.uurtarief) || 0;
  return TARIEVEN
    .filter((t) => t.actief !== false)
    .filter((t) => ROL === "eigenaar" || String(t.categorie || "") === VOOR_BACKOFFICE)
    /* Uurwerk zonder uurloon levert altijd nul op. Dat verstopt een fout,
       dus die regel laten we weg in plaats van hem op nul te tonen. */
    .filter((t) => t.soort !== "uur" || loon > 0)
    .sort((a, b) => (Number(a.sortering) || 0) - (Number(b.sortering) || 0));
}

      "</div>" +
      "<div class='werk-invoer'>" +
        "<label class='veld getal'>" + esc(invoerLabel(t)) +
          "<input type='number' inputmode='decimal' min='0' step='" + stap + "' " +
          (isPerDag(t) ? "value='1' " : "") +
          "id='in-" + esc(t.id) + "' data-in='" + esc(t.id) + "'></label>" +

/* =========================================================
   De rekenhulp bij een percentage-tarief
   =========================================================
   Angela, 30-09-2026: "dropdown menu calculator arrangementen menu en drinken
   services etc de hele lijst om uit te kiezen per categorie."

   De lijst komt uit wz_extras - dezelfde tabel die het reserveringenscherm en
   het locatiedashboard gebruiken. Dat is met opzet: zet je daar een prijs bij,
   dan rekent deze hulp er meteen mee, en kunnen de twee nooit uiteenlopen.

   Wat Kelly hier optelt vult daarna het omzetvak. Ze mag het bedrag ook
   gewoon intypen - bij een nieuwe reservering zit de omzet immers vooral in
   het verblijf zelf, en dat staat niet in deze lijst.
   ========================================================= */
function rekenhulpHtml(t) {
  if (!EXTRAS.length) return "";
  return "<details class='hulp' data-hulp='" + esc(t.id) + "'>" +
    "<summary>Reken uit met de kaart</summary>" +
    "<div class='hulp-binnen'>" +
      "<label class='veld'>Locatie" +
        "<select data-hulploc='" + esc(t.id) + "'>" +
          "<option value=''>Alles</option>" +
          "<option value='Almere'>Almere</option>" +
          "<option value='Lelystad'>Lelystad</option>" +
        "</select></label>" +
      "<div class='hulp-lijst' id='hulplijst-" + esc(t.id) + "'></div>" +
      "<div class='hulp-voet'>" +
        "<div>Samen <b id='hulpsom-" + esc(t.id) + "'>" + eur(0) + "</b></div>" +
        "<button class='knop' type='button' data-hulpneem='" + esc(t.id) + "'>Neem over</button>" +
        "<button class='knop' type='button' data-hulpwis='" + esc(t.id) + "'>Wissen</button>" +
      "</div>" +
    "</div></details>";
}

/* De kaart voor één locatie. Een item zonder locatie geldt overal - zo staat
   het ook in wz_extras (kolom locatie mag leeg zijn). */
function kaartVoor(loc) {
  return EXTRAS.filter((x) => !loc || !x.locatie || x.locatie === loc);
}

function tekenHulpLijst(tarId) {
  const vak = document.getElementById("hulplijst-" + tarId);
  if (!vak) return;
  /* Wat al ingevuld is bewaren: wie halverwege van locatie wisselt raakte
     anders zonder waarschuwing zijn hele telling kwijt. */
  const bewaard = {};
  vak.querySelectorAll("[data-pos]").forEach((el) => {
    if (el.value) bewaard[el.dataset.naam] = el.value;
  });

  const kiezer = document.querySelector("[data-hulploc='" + tarId + "']");
  const lijst = kaartVoor(kiezer ? kiezer.value : "");
  if (!lijst.length) { vak.innerHTML = "<p class='leeg'>Geen items op deze locatie.</p>"; return; }

  const perCat = {};
  lijst.forEach((x) => { (perCat[x.categorie || "Overig"] = perCat[x.categorie || "Overig"] || []).push(x); });

  vak.innerHTML = Object.keys(perCat).sort().map((cat) =>
    "<details class='cat' open><summary>" + esc(cat) +
      " <span>" + perCat[cat].length + "</span></summary>" +
      perCat[cat].map((x) =>
        "<div class='pos'>" +
          "<div class='pos-naam'>" + esc(x.naam) +
            "<span>" + eur(x.prijs) + (x.per_persoon ? " p.p." : "") +
            (x.locatie ? " · " + esc(x.locatie) : "") + "</span></div>" +
          "<input type='number' min='0' step='1' inputmode='numeric' " +
            "data-pos='" + esc(tarId) + "' data-prijs='" + esc(x.prijs) + "' " +
            "data-naam='" + esc(x.naam) + "' aria-label='Aantal " + esc(x.naam) + "'>" +
        "</div>").join("") +
    "</details>").join("");

  vak.querySelectorAll("[data-pos]").forEach((el) => {
    if (bewaard[el.dataset.naam]) el.value = bewaard[el.dataset.naam];
  });
  telHulpOp(tarId);
}

/* Wat staat er geteld, en waaruit bestaat het */
function hulpStand(tarId) {
  let som = 0;
  const stukken = [];
  document.querySelectorAll("[data-pos='" + tarId + "']").forEach((el) => {
    const n = Number(el.value) || 0;
    if (n <= 0) return;
    const prijs = Number(el.dataset.prijs) || 0;
    som += n * prijs;
    stukken.push((n > 1 ? n + "× " : "") + el.dataset.naam);
  });
  return { som: Math.round(som * 100) / 100, stukken };
}

function telHulpOp(tarId) {
  const b = document.getElementById("hulpsom-" + tarId);
  if (b) b.textContent = eur(hulpStand(tarId).som);
}

function neemHulpOver(tarId) {
  const st = hulpStand(tarId);
  if (st.som <= 0) { melding("Vul eerst bij een paar items een aantal in.", "let"); return; }
  const veld = document.getElementById("in-" + tarId);
  const notitie = document.getElementById("nt-" + tarId);
  if (veld) { veld.value = st.som; herrekenRij(tarId); }
  /* De notitie invullen scheelt Kelly typewerk en maakt achteraf duidelijk
     waar het bedrag vandaan komt. Wat ze zelf al had getypt blijft staan. */
  if (notitie && !notitie.value.trim()) notitie.value = st.stukken.join(", ").slice(0, 180);
  const uit = document.querySelector("[data-hulp='" + tarId + "']");
  if (uit) uit.open = false;
  melding("Omzet overgenomen: " + eur(st.som), "goed");
}

function wisHulp(tarId) {
  document.querySelectorAll("[data-pos='" + tarId + "']").forEach((el) => { el.value = ""; });
  telHulpOp(tarId);
}

/* De id komt uit een data-attribuut en is dus ALTIJD tekst; wz_tarieven.id is
   een getal. Met === vond hij nooit iets, keerde zonder melding terug, en dan
   bleef het bedrag op nul en deed "Zet erbij" niets. Kelly kon daardoor geen
   enkele werkzaamheid registreren. Angela, 05-10-2026. Vergelijk daarom als
   tekst - dat werkt ongeacht of de database een getal of een uuid teruggeeft. */
const zelfdeId = (a, b) => String(a) === String(b);

function herrekenRij(id) {
  const t = TARIEVEN.find((x) => zelfdeId(x.id, id));
  const veld = document.getElementById("in-" + id);
  const uit = document.getElementById("uit-" + id);

/* ---- een opgeslagen regel wijzigen ----
   Angela, 08-10-2026: "iedereen moet ook de uren kunnen wijzigen als zij een
   fout hebben gemaakt."

   Het kon tot nu toe alleen door weggooien en opnieuw invoeren. Nu klapt er
   onder de regel een vakje open met de datum, het aantal en de notitie. Bij een
   urenregel staat daar het aantal uur; bij een tariefregel het aantal, en dan
   rekent het bedrag mee met het tarief dat eraan hangt.

   Alleen je eigen regels, en alleen zolang ze niet zijn uitbetaald. De
   database houdt dat ook tegen; dit scherm verbergt alleen wat toch zou
   falen. */
function wzBewerkRij(id) {
  const vak = document.querySelector("[data-vak='" + id + "']");
  if (!vak) return;
  if (!vak.hidden) { vak.hidden = true; vak.innerHTML = ""; return; }
  const w = WERK.find((x) => zelfdeId(x.id, id));
  if (!w) return;
  const uren = isUren(w);
  const tijden = !!(w.begintijd || w.eindtijd);

  vak.hidden = false;
  vak.innerHTML =
    "<div class='bewerkrij'>" +
      "<label class='veld'>Datum<input type='date' data-bw='datum' value='" +
        esc(String(w.datum || "").slice(0, 10)) + "'></label>" +
      (uren
        ? "<label class='veld'>" + (tijden ? "Aantal uur (volgt uit de tijden)" : "Aantal uur") +
          "<input type='text' inputmode='decimal' data-bw='uren'" + (tijden ? " readonly" : "") +
          " value='" + esc(String(w.uren != null ? w.uren : (w.aantal || "")).replace(".", ",")) + "'></label>" +
          (tijden
            ? "<label class='veld'>Van<input type='time' data-bw='van' value='" + esc(hhmm(w.begintijd)) + "'></label>" +
              "<label class='veld'>Tot<input type='time' data-bw='tot' value='" + esc(hhmm(w.eindtijd)) + "'></label>"
            : "")
        : "<label class='veld'>" + (String(w.eenheid || "") === "omzet" ? "Omzetbedrag" : "Aantal") +
          "<input type='text' inputmode='decimal' data-bw='aantal' value='" +
          esc(String(w.aantal != null ? w.aantal : "").replace(".", ",")) + "'></label>") +
      "<label class='veld breed'>Notitie<input type='text' data-bw='notitie' value='" +
        esc(w.notitie || "") + "'></label>" +
      "<div class='bewerkknoppen'>" +
        "<button class='knop vol klein' type='button' data-bwok='" + esc(id) + "'>Opslaan</button>" +
        "<button class='knop klein' type='button' data-bwaf='" + esc(id) + "'>Annuleren</button>" +
        "<span class='bewerkmeld'></span>" +
      "</div>" +
    "</div>";

  /* Bij een regel met tijden volgt het aantal uur uit van en tot; anders zou je
     een getal kunnen intikken dat niet klopt met de tijden ernaast. */
  if (uren && tijden) {
    const herreken = () => {
      const u = urenTussen(vak.querySelector("[data-bw='van']").value,
                           vak.querySelector("[data-bw='tot']").value);
      const veld = vak.querySelector("[data-bw='uren']");
      if (veld) veld.value = Number.isFinite(u) && u > 0 ? String(u).replace(".", ",") : "";
    };
    ["van", "tot"].forEach((k) => {
      const el = vak.querySelector("[data-bw='" + k + "']");
      if (el) { el.addEventListener("change", herreken); el.addEventListener("input", herreken); }
    });
  }
}

function wzGetal(v) {
  const n = Number(String(v == null ? "" : v).replace(/\s/g, "").replace(",", "."));
  return Number.isFinite(n) ? n : NaN;
}

async function wzBewaarRij(id) {
  const vak = document.querySelector("[data-vak='" + id + "']");
  if (!vak) return;
  const meld = vak.querySelector(".bewerkmeld");
  const zeg = (t, fout) => { if (meld) { meld.textContent = t; meld.style.color = fout ? "#B3261E" : ""; } };
  const w = WERK.find((x) => zelfdeId(x.id, id));
  if (!w) return;

  const datum = (vak.querySelector("[data-bw='datum']") || {}).value || String(w.datum || "").slice(0, 10);
  if (!datum) { zeg("Vul een datum in.", true); return; }

  const d = { datum: datum,
              notitie: ((vak.querySelector("[data-bw='notitie']") || {}).value || "").trim() || null };

  if (isUren(w)) {
    const van = vak.querySelector("[data-bw='van']"), tot = vak.querySelector("[data-bw='tot']");
    let u;
    if (van && tot && van.value && tot.value) u = urenTussen(van.value, tot.value);
    else u = wzGetal((vak.querySelector("[data-bw='uren']") || {}).value);
    if (!Number.isFinite(u) || u <= 0) { zeg("Vul een aantal uur in dat groter is dan nul.", true); return; }
    if (u > 24) { zeg("Meer dan 24 uur op één dag kan niet kloppen.", true); return; }
    d.uren = Math.round(u * 100) / 100;
    d.aantal = d.uren;
    if (van && tot) { d.begintijd = van.value || null; d.eindtijd = tot.value || null; }
  } else {
    const a = wzGetal((vak.querySelector("[data-bw='aantal']") || {}).value);
    if (!Number.isFinite(a) || a <= 0) { zeg("Vul een aantal groter dan nul in.", true); return; }
    d.aantal = Math.round(a * 100) / 100;
    /* Het bedrag opnieuw laten rekenen met het tarief dat aan deze regel hangt.
       Doen we dat niet, dan blijft het bedrag bij het oude aantal staan en
       klopt de uitbetaling niet meer. Is het tarief verdwenen, dan rekenen we
       met wat er op de regel zelf staat. */
    const t = TARIEVEN.find((x) => zelfdeId(x.id, w.tarief_id));
    if (t) {
      const r = rekenRegel(t, d.aantal, IK && IK.uurtarief);
      d.uren = Math.round(r.uren * 100) / 100;
      d.bedrag = Math.round(r.bedrag * 100) / 100;
    } else if (Number(w.tarief)) {
      d.bedrag = Math.round(d.aantal * Number(w.tarief) * 100) / 100;
    }
  }

  zeg("Bezig met opslaan…");
  try {
    const terug = await api(TABEL_WERK + "?id=eq." + encodeURIComponent(id),
      { method: "PATCH", body: d });
    if (!terug || !terug.length) throw new Error("de regel kwam niet terug — mag jouw rol dit wijzigen?");
    /* Springt de datum naar een andere maand, dan zou de regel uit beeld
       vallen; de maandkeuze gaat dan mee. */
    if ($("#fMaand") && $("#fMaand").value !== String(datum).slice(0, 7))
      $("#fMaand").value = String(datum).slice(0, 7);
    await laad();
    melding("De regel is bijgewerkt.", "goed");
  } catch (e) {
    zeg(/40[13]/.test(String(e.message))
      ? "✕ Wijzigen mag niet voor jouw rol, of het is niet je eigen regel."
      : "✕ Wijzigen lukte niet: " + e.message, true);
  }
}

async function zetErbij(id) {
  const t = TARIEVEN.find((x) => zelfdeId(x.id, id));
  const veld = document.getElementById("in-" + id);
  const notitie = document.getElementById("nt-" + id);
  const knop = document.querySelector("[data-zet='" + id + "']");
  /* Nooit stil teruggaan: hier zat de fout van 05-10-2026 en die was van buiten
     niet te zien - je drukt, en er gebeurt niets. */
  if (!t || !veld) {
    melding("Deze taak kon niet worden gevonden. Ververs de pagina en probeer het opnieuw.", "fout");
    return;
  }

  const invoer = Number(veld.value) || 0;
  if (invoer <= 0) {
    melding(isProcent(t) ? "Vul eerst het omzetbedrag in." : "Vul eerst een aantal in.", "let");
    veld.focus();
    return;
  }
  const datum = $("#iDatum").value || new Date().toISOString().slice(0, 10);
  const wieVak = $("#iWie");
  const mwId = (ROL === "eigenaar" && wieVak && wieVak.value) ? wieVak.value : (IK && IK.id);
  if (!mwId) { melding("Ik weet niet wie je bent in het medewerkersbestand. Vraag Angela.", "fout"); return; }

  /* Een dag twee keer afvinken is altijd een vergissing: er is maar één van.
     Bij de andere tarieven kan het wél kloppen (twee keer op een dag een
     paar welkomstcalls), dus daar wordt niets gevraagd. */
  if (isPerDag(t) && WERK.some((w) => w.tarief_id === t.id && w.datum === datum &&
                                      w.medewerker_id === mwId)) {
    if (!window.confirm(t.taak + " staat al op " + datumKort(datum) +
        ". Wil je die dag er nog een keer bij zetten?")) return;
  }

  const r = rekenRegel(t, invoer, IK && IK.uurtarief);
  knop.disabled = true; knop.textContent = "Bezig…";
  try {
    await api("wz_werkzaamheden", { method: "POST", body: {
      datum: datum,
      medewerker_id: mwId,
      tarief_id: t.id,
      taak_naam: t.taak,
      eenheid: t.eenheid,
      aantal: invoer,
      uren: Math.round(r.uren * 100) / 100,
      tarief: Number(t.tarief) || 0,
      bedrag: Math.round(r.bedrag * 100) / 100,
      notitie: (notitie && notitie.value.trim()) || null,
      betaald: false
    }});
    veld.value = isPerDag(t) ? "1" : "";
    if (notitie) notitie.value = "";
    herrekenRij(id);

    /* Het overzicht laten meebewegen, anders zegt de pagina "staat erbij" en
       zie je niets. Angela, 30-09-2026: "ik heb voor Kelly werkzaamheden
       geregistreerd maar ik zie de registratie niet."

       Twee manieren waarop een net opgeslagen regel buiten beeld valt:
         1. de datum ligt in een andere maand dan de maand die getoond wordt
            (je boekt op 30 september iets na voor augustus);
         2. het filter staat op "Al uitbetaald", en een nieuwe regel staat
            altijd open.
       Allebei worden ze hier rechtgezet, met een melding erbij zodat het
       verspringen van de maand geen verrassing is. */
    let sprong = "";
    const maandVanRegel = String(datum).slice(0, 7);
    if ($("#fMaand").value !== maandVanRegel) {
      $("#fMaand").value = maandVanRegel;
      sprong = " Het overzicht staat nu op " + maandNaam(maandVanRegel) + ".";
    }
    if ($("#fStand").value === "uitbetaald") {
      $("#fStand").value = "";
      sprong += " Het filter stond op 'al uitbetaald'; dat is teruggezet, " +
                "anders viel deze nieuwe regel weg.";
    }
    melding(t.taak + " van " + datumKort(datum) + " staat erbij: " +
            eur(r.bedrag) + "." + sprong, "goed");
    await laad();
  } catch (e) {
    melding("Opslaan lukte niet: " + e.message, "fout");
  } finally {
    knop.disabled = false; knop.textContent = "Zet erbij";
  }
}

/* =========================================================
   Het overzicht
   ========================================================= */
function maandNaam(jjjjmm) {
  const [j, m] = String(jjjjmm || "").split("-").map(Number);
  if (!j || !m) return String(jjjjmm || "");
  return new Date(j, m - 1, 1).toLocaleDateString("nl-NL",
    { month: "long", year: "numeric" });
}
function datumKort(d) {
  const dd = new Date(d + "T12:00:00");
  if (isNaN(dd)) return d;
  return dd.toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "long" });
}

function gefilterd() {
  const stand = $("#fStand").value;
  let l = WERK.slice();
  if (stand === "open") l = l.filter((w) => !w.betaald);
  if (stand === "uitbetaald") l = l.filter((w) => !!w.betaald);
  return l.sort((a, b) => (a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0));
}

function tekenOverzicht() {
  const lijst = gefilterd();
  const totaal = lijst.reduce((s, w) => s + (Number(w.bedrag) || 0), 0);
  const open = lijst.filter((w) => !w.betaald).reduce((s, w) => s + (Number(w.bedrag) || 0), 0);
  const uit = totaal - open;

  $("#tegels").innerHTML =
    "<div class='tegel'><span>Totaal deze maand</span><b>" + eur(totaal) + "</b></div>" +
    "<div class='tegel open'><span>Nog te ontvangen</span><b>" + eur(open) + "</b></div>" +
    "<div class='tegel uitbetaald'><span>Al uitbetaald</span><b>" + eur(uit) + "</b></div>" +
    "<div class='tegel'><span>Uren deze maand</span><b>" +
      uurTekst(lijst.reduce((s2, w) => s2 + (isUren(w) ? (Number(w.uren) || Number(w.aantal) || 0) : 0), 0)) +
      "</b></div>" +
    "<div class='tegel'><span>Regels</span><b>" + lijst.length + "</b></div>";

  if (!lijst.length) {
    $("#lijst").innerHTML = "<p class='leeg'>Nog niets geregistreerd in deze maand.</p>";
    return;
  }

  /* Regels zonder medewerker tellen wel mee in het totaal maar horen bij
     niemand. Ze verdwijnen zodra je per persoon kijkt, dus dat moet je zien. */
  const zonderNaam = lijst.filter((w) => !w.medewerker_id);
  const waarschuwing = (ROL === "eigenaar" && zonderNaam.length)
    ? "<p class='leeg' style='border-color:#B3261E;color:#B3261E'>" +
      zonderNaam.length + (zonderNaam.length === 1 ? " regel staat" : " regels staan") +
      " op niemands naam, samen " +
      eur(zonderNaam.reduce((s2, w) => s2 + (Number(w.bedrag) || 0), 0)) +
      ". Ze tellen hier wel mee, maar verdwijnen zodra je per persoon kijkt. " +
      "Hieronder staan ze gemerkt met ZONDER NAAM.</p>"
    : "";

  const perDag = {};
  lijst.forEach((w) => { (perDag[w.datum] = perDag[w.datum] || []).push(w); });

  const magAfvinken = ROL === "eigenaar";
  $("#lijst").innerHTML = waarschuwing + Object.keys(perDag).sort().reverse().map((d) => {
    const regels = perDag[d];
    const dagTot = regels.reduce((s, w) => s + (Number(w.bedrag) || 0), 0);
    return "<div class='dag'>" +
      "<div class='dag-kop'><span>" + esc(datumKort(d)) + "</span><b>" + eur(dagTot) + "</b></div>" +
      regels.map((w) => {
        const wie = MENSEN.find((m) => m.id === w.medewerker_id);
        /* Angela, 07-10-2026: "ik zie de cijfers van september van Kelly niet
           meer, er staat alleen 7 euro."

           De naam stond er alleen bij als de regel NIET van jezelf was. Een
           regel zonder medewerker_id zag er daardoor precies zo uit als je
           eigen regel - en zodra je per persoon filtert valt zo'n regel weg
           zonder dat iemand ziet waarom. Nu staat er altijd een naam, en
           "zonder naam" als er geen medewerker aan hangt. */
        const toon = ROL !== "eigenaar" ? ""
          : wie ? " · " + esc(wie.naam)
          : w.medewerker_id ? " · onbekende medewerker"
          : " · ZONDER NAAM";
        /* Een urenregel heeft geen tarief en geen bedrag; "3 × € 0,00" is dan
           onzin. Toon het aantal uur, met de tijden erbij als die er zijn. */
        const hoe = isUren(w)
          ? uurTekst(w.uren != null ? w.uren : w.aantal) +
            (w.begintijd && w.eindtijd ? " (" + hhmm(w.begintijd) + "–" + hhmm(w.eindtijd) + ")" : "")
          : w.eenheid === "omzet"
          ? pct(w.tarief) + " van " + eur(w.aantal)
          : (Number(w.aantal) || 0) + " × " + eur(w.tarief);
        return "<div class='regel'>" +
          "<div class='wat'>" + esc(w.taak_naam || "") +
            "<em> — " + esc(hoe) + (w.notitie ? " · " + esc(w.notitie) : "") + esc(toon) + "</em></div>" +
          "<div class='bed'>" + (isUren(w) ? uurTekst(w.uren != null ? w.uren : w.aantal) : eur(w.bedrag)) + "</div>" +
          (w.betaald
            ? "<span class='vlag uit'>uitbetaald</span>"
            : "<span class='vlag'>open</span>") +
          (magAfvinken && !w.betaald
            ? "<button class='knop klein geen-print' type='button' data-betaal='" + esc(w.id) + "'>Uitbetaald</button>"
            : "") +
          /* Angela, 08-10-2026: "iedereen moet ook de uren kunnen wijzigen als
             zij een fout hebben gemaakt." Alleen bij je eigen regels en alleen
             zolang ze niet zijn uitbetaald - een uitbetaalde regel aanpassen
             zou de administratie laten afwijken van wat er is overgemaakt. */
          (!w.betaald
            ? "<button class='knop klein geen-print' type='button' data-bewerk='" + esc(w.id) +
              "' title='Wijzigen'>&#9998;</button>" +
              "<button class='knop klein geen-print' type='button' data-weg='" + esc(w.id) + "' title='Verwijderen'>✕</button>"
            : "") +
          "<div class='regelbewerk' data-vak='" + esc(w.id) + "' hidden></div>" +
        "</div>";
      }).join("") +
    "</div>";
  }).join("");
}

/* =========================================================
   Uren bijhouden
   =========================================================
   Angela, 06-10-2026. Losse uren per dag, zonder bedrag, om de maanduren bij
   te houden. Een urenregel herken je eraan dat er geen tarief aan hangt en de
   eenheid 'uur' is - dan hoort er ook geen bedrag bij. */
const UREN_TAAK = "Uren";
function isUren(w) {
  return !!w && !w.tarief_id && String(w.eenheid || "") === "uur";
}
function hhmm(t) { return String(t || "").slice(0, 5); }
function uurTekst(u) {
  const n = Math.round((Number(u) || 0) * 100) / 100;
  return (Number.isInteger(n) ? String(n) : String(n).replace(".", ",")) + " uur";
}

/* Uit twee tijden het aantal uren. Loopt de eindtijd vóór de begintijd, dan is
   het over middernacht heen gegaan - dan telt de nacht mee in plaats van een
   negatief getal te geven. */
function urenTussen(van, tot) {
  const d = (t) => { const p = String(t || "").split(":"); return p.length >= 2 ? Number(p[0]) * 60 + Number(p[1]) : NaN; };
  const a = d(van), b = d(tot);
  if (!Number.isFinite(a) || !Number.isFinite(b)) return NaN;
  let m = b - a;
  if (m < 0) m += 24 * 60;
  return Math.round((m / 60) * 100) / 100;
}

function urenNu() {
  const wijze = $("#uWijze") ? $("#uWijze").value : "aantal";
  if (wijze === "tijden") return urenTussen($("#uVan").value, $("#uTot").value);
  const n = Number(String($("#uAantal").value).replace(",", "."));
  return Number.isFinite(n) ? n : NaN;
}

function urenToon() {
  const wijze = $("#uWijze") ? $("#uWijze").value : "aantal";
  const tijden = wijze === "tijden";
  if ($("#uAantalVak")) $("#uAantalVak").hidden = tijden;
  if ($("#uVanVak"))    $("#uVanVak").hidden = !tijden;
  if ($("#uTotVak"))    $("#uTotVak").hidden = !tijden;
  const u = urenNu();
  if ($("#uUit")) $("#uUit").textContent = Number.isFinite(u) && u > 0 ? uurTekst(u) : "0 uur";
}

function urenVoorbereiden() {
  const vak = $("#kaartUren"); if (!vak) return;
  vak.hidden = false;
  if ($("#uDatum") && !$("#uDatum").value) $("#uDatum").value = new Date().toISOString().slice(0, 10);
  /* De eigenaar mag uren voor een ander wegzetten; een medewerker alleen voor
     zichzelf - de database houdt dat ook tegen. */
  if (ROL === "eigenaar" && MENSEN.length) {

      "<option value='" + esc(m.id) + "'" + (String(m.id) === String(uVoorkeur) ? " selected" : "") +
      ">" + esc(m.naam) + "</option>").join("");
  }
  urenToon();
}

async function urenErbij() {
  const knop = $("#uZet"); if (!knop) return;
  const u = urenNu();
  if (!Number.isFinite(u) || u <= 0) {

  try {
    await api("wz_werkzaamheden", { method: "POST", body: {

    }});

    if ($("#uTot")) $("#uTot").value = "";
    if ($("#uNotitie")) $("#uNotitie").value = "";
    urenToon();
    /* Net als bij de werkzaamheden: springt de maand van het overzicht niet
       mee, dan lijkt het alsof er niets is opgeslagen. */

    if ($("#fStand") && $("#fStand").value === "uitbetaald") $("#fStand").value = "";
    await laad();
    melding(uurTekst(u) + " op " + datumKort(datum) + " erbij gezet.", "goed");
  } catch (e) {
    melding("Dat lukte niet: " + e.message, "fout");
  }
  knop.disabled = false; knop.textContent = "Uren erbij zetten";
}

function csv() {
  const lijst = gefilterd();
  if (!lijst.length) { melding("Er is niets om uit te draaien.", "let"); return; }
  const kop = ["Datum", "Wie", "Werkzaamheid", "Eenheid", "Aantal of omzet",
               "Tarief", "Bedrag", "Notitie", "Uitbetaald"];
  const veld = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rijen = lijst.map((w) => {
    const wie = MENSEN.find((m) => m.id === w.medewerker_id);
    return [w.datum, (wie && wie.naam) || "", w.taak_naam, w.eenheid, w.aantal,
            w.tarief, w.bedrag, w.notitie || "", w.betaald ? "ja" : "nee"].map(veld).join(";");
  });
  const tot = lijst.reduce((s, w) => s + (Number(w.bedrag) || 0), 0);
  rijen.push(["", "", "TOTAAL", "", "", "", Math.round(tot * 100) / 100, "", ""].map(veld).join(";"));
  const blob = new Blob(["﻿" + kop.map(veld).join(";") + "\n" + rijen.join("\n")],
    { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "werkzaamheden-" + ($("#fMaand").value || "") + ".csv";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* =========================================================
   laden
   ========================================================= */
function maandGrenzen(maand) {
  const [j, m] = String(maand || "").split("-").map(Number);
  if (!j || !m) {
    const n = new Date();
    return maandGrenzen(n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0"));
  }
  const van = j + "-" + String(m).padStart(2, "0") + "-01";
  const na = new Date(Date.UTC(j, m, 1)).toISOString().slice(0, 10);
  return { van, na };
}

/* Eén keer mogen terugvallen naar de laatste maand met regels. Zonder deze
   rem zou de pagina blijven springen als iemand echt nog niets heeft staan. */
let MAAND_TERUGVAL = false;

async function laad() {
  const g = maandGrenzen($("#fMaand").value);
  try {
    /* De database filtert zelf op persoon: wie geen eigenaar is krijgt alleen
       zijn eigen regels terug (policy "bwf rechten werkzaamheden"). Hier hoeft
       dus niet nog eens op medewerker_id gefilterd te worden. */
    WERK = await api("wz_werkzaamheden?select=*" +
      "&datum=gte." + g.van + "&datum=lt." + g.na +
      (ALLEEN_WIE ? "&medewerker_id=eq." + encodeURIComponent(ALLEEN_WIE) : "") +
      "&order=datum.desc") || [];
  } catch (e) {
    $("#lijst").innerHTML = "<p class='leeg'>De regels konden niet geladen worden: " + esc(e.message) + "</p>";
    return;
  }
  /* Staat de maand leeg, dan springen we naar de laatste maand waarin wél
     iets staat. Angela, 06-10-2026: "bij Kelly zie ik geen totaal en ik mis de
     gegevens van september." De pagina begon altijd in de huidige maand; stond
     daar nog niets, dan zag je nullen en leek het alsof er niets wás, terwijl
     september gewoon gevuld is. */
  if (!WERK.length && !MAAND_TERUGVAL) {
    MAAND_TERUGVAL = true;
    try {
      const laatste = await api(TABEL_WERK + "?select=datum" +
        (ALLEEN_WIE ? "&medewerker_id=eq." + encodeURIComponent(ALLEEN_WIE) : "") +
        "&order=datum.desc&limit=1", { stil: true });
      const d = laatste && laatste[0] && String(laatste[0].datum || "").slice(0, 7);
      if (d && d !== $("#fMaand").value) {
        $("#fMaand").value = d;
        return laad();
      }
    } catch (e) { /* dan blijft het bij de lege maand */ }
  }

  tekenOverzicht();
  $("#periodeHint").textContent = ALLEEN_WIE
    ? (ALLEEN_NAAM ? "Alleen de regels van " + ALLEEN_NAAM + "." : "Alleen de regels van één persoon.")
    : (ROL === "eigenaar" ? "Je ziet alles van iedereen." : "Je ziet alleen je eigen regels.");
}

      method: "POST", headers: { apikey: CFG.key, "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("#lgMail").value.trim().toLowerCase(), password: $("#lgWw").value })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) {
      throw new Error(d.error_description === "Invalid login credentials"
        ? "E-mailadres of wachtwoord klopt niet." : (d.error_description || d.msg || "Inloggen lukte niet."));
    }
    bewaarSessie(d);
    $("#lgWw").value = "";
    verbergSlot();
    await start();
  } catch (e) { f.textContent = e.message; }
  finally { k.disabled = false; k.textContent = "Inloggen"; }
}

start();
</script>
