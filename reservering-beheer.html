<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verhuisd naar Reserveringen — Bed &amp; Wellness Flevoland</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F7F5F1;color:#1D2420;font:15px/1.5 "Public Sans","Helvetica Neue",Arial,sans-serif;padding:24px}
  .doos{background:#fff;border:1px solid #E6E1D7;border-radius:14px;padding:26px 28px;max-width:440px;text-align:center}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:26px;color:#14342A;margin:0 0 8px}
  a{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;background:#14342A;color:#fff;
    text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="doos">
  <h1>Deze pagina is verhuisd</h1>
  <p>Reserveringen beheren zit nu in <strong>Reserveringen</strong>, samen met nieuwe boekingen en de incheckformulieren.</p>
  <p id="wacht">Je wordt doorgestuurd…</p>
  <a id="door" href="reserveringen.html">Nu naar Reserveringen</a>
</div>
<script>
/* Parameters meenemen: ?id=<uuid> opent daar dezelfde reservering. */
(function () {
  var p = new URLSearchParams(location.search);
  var naar = "reserveringen.html";
  var q = new URLSearchParams();
  if (p.get("id")) q.set("id", p.get("id"));
  if (p.get("tab")) q.set("tab", p.get("tab"));
  var url = naar + (q.toString() ? "?" + q.toString() : "");
  document.getElementById("door").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
