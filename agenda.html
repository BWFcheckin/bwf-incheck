<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14342A">
<title>Agenda — Bed &amp; Wellness Flevoland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F1; --surface:#FFFFFF; --surface-2:#FBF9F5; --line:#E6E1D7; --line-soft:#F0ECE4;
  --ink:#1D2420; --ink-2:#46514A; --muted:#7E8A82;
  --groen:#14342A; --groen-2:#1F4D3D; --groen-zacht:#E7EFEA;
  --goud:#B9975B; --crit:#B3453A; --crit-zacht:#FBEAE7;
  --f-titel:"Cormorant Garamond",Georgia,serif;
  --f-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --accent:#14342A; --accent-soft:#E7EFEA;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px}
a{color:var(--groen-2)}
:focus-visible{outline:2px solid var(--goud);outline-offset:2px;border-radius:6px}
button,input,select{font:inherit;color:inherit}

.slot:not([hidden]){position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--groen)}
.slot .doos{background:var(--surface);border-radius:18px;padding:30px 28px;width:min(380px,100%);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.merk{font-family:var(--f-titel);font-size:19px;letter-spacing:.16em;text-transform:uppercase;line-height:1.1;color:var(--groen)}
.merk small{display:block;font-size:10px;letter-spacing:.34em;color:var(--goud);margin-top:3px}
.slot label{display:block;font-size:12.5px;color:var(--ink-2);margin:14px 0 5px}
.slot input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.slot .fout{color:var(--crit);font-size:13px;min-height:1.2em;margin-top:10px}

.knop{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--groen);
  background:var(--groen);color:#fff;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.knop:hover{background:var(--groen-2)}
.knop.sec{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.slot .knop{width:100%;margin-top:18px}

.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 80px}
.kop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--goud)}
h1{font-family:var(--f-titel);font-weight:500;font-size:34px;margin:2px 0 0;color:var(--groen)}
.groet{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.kop-rechts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wie{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.melding{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:14px;background:var(--crit-zacht);color:var(--crit)}
.ingebed .kop,.ingebed #bwfBalk{display:none!important}
.ingebed .wrap{padding:8px}

dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100vw - 20px));box-shadow:0 30px 90px -30px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,52,42,.45)}
dialog form{padding:22px}
dialog h2{font-family:var(--f-titel);font-weight:500;font-size:24px;margin:0 0 4px;color:var(--groen)}
dialog p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
dialog label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
dialog input,dialog select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.voet{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.dlg-melding{font-size:13px;color:var(--crit);min-height:1.2em;margin-top:8px}
@media(max-width:620px){h1{font-size:28px}}
</style>
</head>
<body class="bwf-vergrendeld">

<div class="slot" id="slot">
  <div class="doos">
    <div class="merk">Bed &amp; Wellness<small>Flevoland</small></div>
    <label for="lgMail">E-mailadres</label><input id="lgMail" type="email" inputmode="email" autocomplete="username">
    <label for="lgWw">Wachtwoord</label><input id="lgWw" type="password" autocomplete="current-password">
    <button type="button" class="knop" id="lgKnop">Inloggen</button>
    <p style="margin:14px 0 0;font-size:13px"><a href="#" id="bwfVergeten">Wachtwoord vergeten?</a></p>
    <div class="fout" id="lgFout"></div>
  </div>
</div>

<main class="wrap">
  <div class="kop">
    <div>
      <span class="eyebrow">Agenda</span>
      <h1>Agenda</h1>
      <p class="groet" id="bwfGroet"></p>
    </div>
    <div class="kop-rechts">
      <span class="wie" id="wieBen"></span>
      <button type="button" class="knop sec" id="knopBlok" hidden>Suite blokkeren</button>
      <a class="knop sec" href="reservering-beheer.html" style="text-decoration:none">Reserveringen beheren</a>
    </div>
  </div>
  <div class="melding" id="melding" hidden></div>
  <div id="agendaKalender"></div>
</main>

<dialog id="blokVenster" aria-labelledby="blokTitel">
  <form method="dialog" id="blokForm">
    <h2 id="blokTitel">Suite blokkeren</h2>
    <p>De suite is dan niet beschikbaar, bijvoorbeeld voor onderhoud, schoonmaak of eigen gebruik.</p>
    <label>Suite <select id="bkSuite"></select></label>
    <div class="twee">
      <label>Van datum <input id="bkVanD" type="date"></label>
      <label>Vanaf <input id="bkVanT" type="time" value="00:00"></label>
      <label>Tot datum <input id="bkTotD" type="date"></label>
      <label>Tot <input id="bkTotT" type="time" value="23:59"></label>
    </div>
    <label>Reden <input id="bkReden" type="text" placeholder="onderhoud, schoonmaak, eigen gebruik"></label>
    <div class="voet">
      <button type="button" class="knop sec" id="bkAnnuleer">Annuleren</button>
      <button type="button" class="knop" id="bkBewaar">Blokkeren</button>
    </div>
    <div class="dlg-melding" id="bkMelding"></div>
  </form>
</dialog>

<script src="bwf-kalender.js?v=3"></script>
<script>
"use strict";
/* =========================================================
   Agenda — reserveringen en blokkades uit Supabase (fase 3).
   URL: ?datum=JJJJ-MM-DD  ?weergave=dag|week|maand  ?suite=angie|malina_jacuzzi|malina_deluxe
        ?loc=lelystad|almere  ?ingebed=1 (zonder kop, bijv. in een iframe)
   ========================================================= */
const CFG = {
  url: "https://iuyjvtlauktnjprbmbjj.supabase.co",
  key: "sb_publishable_SfQjQTwKa3BgCtjwE-8ljw_mTpqEY3U",
  ls:  "sb-iuyjvtlauktnjprbmbjj-auth-token"
};
const $ = (s) => document.querySelector(s);
const URLP = new URLSearchParams(location.search);
let SESSIE = null, ROL = null, NAAM = "";

if (URLP.get("ingebed") === "1") document.documentElement.classList.add("ingebed");

function jwtDeel(t) { try { return JSON.parse(atob(String(t).split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch (e) { return {}; } }
function leesSessie() { try { return JSON.parse(localStorage.getItem(CFG.ls) || "null"); } catch (e) { return null; } }
function bewaarSessie(d) { try { localStorage.setItem(CFG.ls, JSON.stringify(d)); } catch (e) {} SESSIE = d; }
let verversBezig = null;
async function geldigToken() {
  SESSIE = leesSessie();
  if (!SESSIE || !SESSIE.access_token) return null;
  if (((jwtDeel(SESSIE.access_token).exp || 0) * 1000) - Date.now() > 60000) return SESSIE.access_token;
  if (!SESSIE.refresh_token) return null;
  if (!verversBezig) {
    verversBezig = fetch(CFG.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: { apikey: CFG.key, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: SESSIE.refresh_token })
    }).then((r) => (r.ok ? r.json() : null)).then((d) => {
      if (!d || !d.access_token) return null;
      bewaarSessie(d); return d.access_token;
    }).catch(() => null).finally(() => { verversBezig = null; });
  }
  return verversBezig;
}
async function api(pad, opties = {}) {
  const token = await geldigToken();
  if (!token) { toonSlot("Je sessie is verlopen. Log opnieuw in."); throw new Error("Niet ingelogd."); }
  const headers = { apikey: CFG.key, Authorization: "Bearer " + token };
  if (opties.body !== undefined) { headers["Content-Type"] = "application/json"; headers.Prefer = "return=representation"; }
  const r = await fetch(CFG.url + "/rest/v1/" + pad, { method: opties.method || "GET", headers, body: opties.body === undefined ? undefined : JSON.stringify(opties.body) });
  const tekst = await r.text();
  if (!r.ok) { let m = tekst; try { m = JSON.parse(tekst).message || tekst; } catch (e) {} throw new Error(m || "Fout " + r.status); }
  return tekst ? JSON.parse(tekst) : null;
}

function toonSlot(tekst) {
  document.body.classList.add("bwf-vergrendeld");
  $("#slot").hidden = false;
  $("#lgFout").textContent = tekst || "";
  setTimeout(() => $("#lgMail").focus(), 60);
}
async function inloggen() {
  const k = $("#lgKnop"), f = $("#lgFout");
  f.textContent = ""; k.disabled = true; k.textContent = "Bezig…";
  try {
    const r = await fetch(CFG.url + "/auth/v1/token?grant_type=password", {
      method: "POST", headers: { apikey: CFG.key, "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("#lgMail").value.trim().toLowerCase(), password: $("#lgWw").value })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) throw new Error(d.error_description === "Invalid login credentials" ? "E-mailadres of wachtwoord klopt niet." : (d.error_description || d.msg || "Inloggen lukte niet."));
    bewaarSessie(d);
    location.reload();
  } catch (e) { f.textContent = e.message; }
  k.disabled = false; k.textContent = "Inloggen";
}

/* ---------- suite blokkeren (tabel blokkades) ---------- */
function openBlokVenster() {
  const suites = window.BWFKalender.SUITES;
  $("#bkSuite").innerHTML = Object.keys(suites).map((s) => `<option value="${s}">${suites[s].naam} · ${suites[s].plaats}</option>`).join("");
  const datum = KALENDER_DATUM();
  $("#bkVanD").value = datum; $("#bkTotD").value = datum;
  $("#bkVanT").value = "00:00"; $("#bkTotT").value = "23:59";
  $("#bkReden").value = ""; $("#bkMelding").textContent = "";
  $("#blokVenster").showModal();
}
function naarUtc(datum, tijd) { return window.BWFKalender._test.moment(datum, tijd).toISOString(); }
async function bewaarBlokkade() {
  const m = $("#bkMelding"); m.textContent = "";
  const vanD = $("#bkVanD").value, totD = $("#bkTotD").value, vanT = $("#bkVanT").value || "00:00", totT = $("#bkTotT").value || "23:59";
  if (!vanD || !totD) { m.textContent = "Vul beide datums in."; return; }
  const van = naarUtc(vanD, vanT), tot = naarUtc(totD, totT);
  if (tot <= van) { m.textContent = "De einddatum moet na de begindatum liggen."; return; }
  $("#bkBewaar").disabled = true;
  try {
    const rij = await api("blokkades", { method: "POST", body: {
      suite: $("#bkSuite").value, van, tot, reden: $("#bkReden").value.trim() || "Gesloten", bron: "handmatig", aangemaakt_door: NAAM
    } });
    if (!rij || !rij.length) throw new Error("geen rechten om te blokkeren");
    $("#blokVenster").close();
    kalender.ververs();
  } catch (e) { m.textContent = "Blokkeren lukte niet: " + e.message; }
  $("#bkBewaar").disabled = false;
}
async function blokkadeOpheffen(blok) {
  if (!confirm("Blokkade opheffen?\n" + (blok.reden || ""))) throw new Error("Niet opgeheven.");
  const rij = await api("blokkades?id=eq." + encodeURIComponent(blok.id), { method: "PATCH", body: { actief: false } });
  if (!rij || !rij.length) throw new Error("Opheffen lukte niet: geen rechten.");
}

/* ---------- start ---------- */
let kalender = null;
let KALENDER_DATUM = () => new Date().toISOString().slice(0, 10);

async function start() {
  if (!(await geldigToken())) { toonSlot(); return; }
  document.body.classList.remove("bwf-vergrendeld");
  $("#slot").hidden = true;
  const deel = jwtDeel(SESSIE.access_token);
  $("#wieBen").textContent = deel.email || "";
  try {
    const [rol, mw] = await Promise.all([
      api("rpc/bwf_toegangsrol", { method: "POST", body: {} }),
      api("wz_medewerkers?select=naam&auth_id=eq." + encodeURIComponent(deel.sub || ""))
    ]);
    ROL = rol || null;
    NAAM = (mw && mw[0] && mw[0].naam) || deel.email || "onbekend";
  } catch (e) { /* kalender toont zelf een melding */ }
  if (!ROL) { const m = $("#melding"); m.hidden = false; m.textContent = "Je account heeft geen toegang tot de agenda. Vraag Angela om een toegangsrol."; }
  const magBeheren = ROL === "eigenaar" || ROL === "vr";
  $("#knopBlok").hidden = !magBeheren;

  const loc = (URLP.get("loc") || "").toLowerCase();
  const suites = loc === "lelystad" ? ["malina_jacuzzi", "malina_deluxe"] : loc === "almere" ? ["angie"] : null;
  kalender = window.BWFKalender.maak($("#agendaKalender"), {
    weergave: URLP.get("weergave") || (window.innerWidth < 760 ? "dag" : "week"),
    datum: URLP.get("datum") || undefined,
    suite: URLP.get("suite") || undefined,
    suites,
    token: geldigToken,
    vrijeBlokken: true,
    blokkadeOpheffen: magBeheren ? blokkadeOpheffen : null
  });
  const kiesVeld = () => document.querySelector('#agendaKalender [data-gekozen="1"]');
  KALENDER_DATUM = () => { const c = kiesVeld(); return (c && c.getAttribute("data-cel")) || URLP.get("datum") || new Date().toISOString().slice(0, 10); };
}

document.addEventListener("DOMContentLoaded", () => {
  $("#lgKnop").addEventListener("click", inloggen);
  $("#lgWw").addEventListener("keydown", (e) => { if (e.key === "Enter") inloggen(); });
  $("#knopBlok").addEventListener("click", openBlokVenster);
  $("#bkAnnuleer").addEventListener("click", () => $("#blokVenster").close());
  $("#bkBewaar").addEventListener("click", bewaarBlokkade);
  $("#blokForm").addEventListener("submit", (e) => e.preventDefault());
  start();
});
</script>
<script src="bwf-shell.js"></script>
<script src="bwf-account.js?v=1"></script>
</body>
</html>
