<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verhuisd naar Reserveringen — Bed &amp; Wellness Flevoland</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F7F5F1;color:#1D2420;font:15px/1.5 "Public Sans","Helvetica Neue",Arial,sans-serif;padding:24px}
  .doos{background:#fff;border:1px solid #E6E1D7;border-radius:14px;padding:26px 28px;max-width:460px;text-align:center}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:26px;color:#14342A;margin:0 0 8px}
  a{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;background:#14342A;color:#fff;
    text-decoration:none;font-weight:600}
  a.sec{background:#FBF9F5;color:#1D2420;border:1px solid #E6E1D7;margin-left:8px}
</style>
</head>
<body>
<div class="doos">
  <h1>Deze pagina is verhuisd</h1>
  <p>Een nieuwe boeking maak je nu in <strong>Reserveringen</strong>, tabblad “Nieuwe reservering”.
     <span id="blokTekst" hidden>Een suite blokkeren doe je in de <strong>agenda</strong>.</span></p>
  <p id="wacht">Je wordt doorgestuurd…</p>
  <a id="door" href="reserveringen.html?tab=nieuw">Nu naar Reserveringen</a>
  <a class="sec" href="agenda.html">Naar de agenda</a>
</div>
<script>
/* ?blokkade=1 ging over blokkeren; dat zit sinds fase 3 in de agenda. */
(function () {
  var p = new URLSearchParams(location.search);
  var url = p.get("blokkade") ? "agenda.html" : "reserveringen.html?tab=nieuw";
  if (p.get("blokkade")) document.getElementById("blokTekst").hidden = false;
  document.getElementById("door").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
