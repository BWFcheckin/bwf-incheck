<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1ED">
<title>Vandaag — Bed &amp; Wellness Flevoland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1ED; --surface:#FFFFFF; --surface-2:#FAF7F3; --line:#E3DAD0; --line-soft:#EFE8E1;
  --ink:#241E19; --ink-2:#4B4239; --muted:#7B6E62;
  --accent:#483C34; --accent-ink:#FFFFFF; --accent-soft:#E8DFD5;
  --brass:#9A7B4F; --ok:#3F7A55; --ok-soft:#DFEDE2; --warn:#8F6420; --warn-soft:#F6EBD9;
  --crit:#A34434; --crit-soft:#F7E2DC;
  --shadow:0 1px 2px rgba(36,30,25,.06), 0 8px 24px -16px rgba(36,30,25,.30);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brass)}

/* ---------- kop ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.merk{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.merk span{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}
.wie{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  border-radius:var(--r-s);padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:#5a4c42}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.rij:focus-visible{
  outline:2px solid var(--brass);outline-offset:2px}

/* ---------- datumbalk ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.datumbalk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.datumbalk h1{font-family:var(--f-display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.02em}
.datumbalk .dag{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;font-weight:400;letter-spacing:0}
.pijl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);
  width:34px;height:34px;cursor:pointer;font-size:15px}
.pijl:hover{background:var(--surface-2)}
input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 9px}
.spacer{margin-left:auto}

/* ---------- telstrip ---------- */
.tellers{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.teller{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 13px;
  display:flex;gap:9px;align-items:baseline}
.teller b{font-family:var(--f-display);font-size:20px;line-height:1}
.teller span{font-size:13px;color:var(--muted)}

/* ---------- snelkoppelingen ---------- */
.snelrij{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.snel{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-m);padding:12px 14px;text-decoration:none;color:var(--ink);cursor:pointer;
  font:inherit;box-shadow:var(--shadow)}
.snel:hover{background:var(--surface-2);border-color:var(--accent)}
.snel b{display:block;font-family:var(--f-display);font-size:15px}
.snel span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.dienstlijst{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;margin-bottom:16px}
.dienstlijst h3{font-family:var(--f-display);font-size:15px;margin:0 0 8px}
.dienstrij{display:flex;gap:12px;justify-content:space-between;padding:6px 0;
  border-bottom:1px solid var(--line-soft);font-size:14px}
.dienstrij:last-child{border-bottom:0}
.dienstrij .dag{font-family:var(--f-mono)}

/* ---------- lijst ---------- */
.groep{margin-bottom:22px}
.groepkop{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;
  font-family:var(--f-display);font-size:15px;font-weight:600}
.groepkop em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rij{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--brass);border-radius:var(--r-m);padding:11px 14px;margin-bottom:7px;
  display:grid;grid-template-columns:66px 1fr auto;gap:4px 14px;align-items:center;cursor:pointer}
.rij:hover{background:var(--surface-2)}
.rij[data-actief="1"]{border-color:var(--accent);border-left-color:var(--accent);box-shadow:var(--shadow)}
.rij .tijd{font-family:var(--f-mono);font-size:17px;font-weight:500}
.rij .naam{font-weight:600}
.rij .meta{grid-column:2;font-size:13px;color:var(--muted)}
.rij .rechts{grid-row:1 / span 2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-family:var(--f-mono);font-size:11px;padding:3px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.open{background:var(--warn-soft);color:var(--warn)}
.tag.let{background:var(--crit-soft);color:var(--crit)}
.leeg{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-m);
  padding:20px;color:var(--muted);text-align:center}

/* ---------- detail ---------- */
.detail{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;overflow-y:auto;
  transform:translateX(100%);transition:transform .22s ease}
.detail[data-open="1"]{transform:translateX(0)}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
.detail-kop{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.detail-kop h2{font-family:var(--f-display);font-size:19px;margin:0 auto 0 0;letter-spacing:-.01em}
.detail-kop .sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;margin-top:2px}
.detail-body{padding:14px 16px 40px}
.blok{border-top:1px solid var(--line-soft);padding:12px 0}
.blok:first-child{border-top:0;padding-top:0}
.blok h3{font-family:var(--f-display);font-size:13px;font-weight:600;margin:0 0 8px;color:var(--ink-2)}
.paar{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:14px}
.paar dt{color:var(--muted)}
.paar dd{margin:0}
.bedrag{font-family:var(--f-mono)}
.open-bedrag{color:var(--crit);font-weight:600}
textarea{width:100%;min-height:70px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-s);padding:9px;resize:vertical}
.knoprij{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.melding{font-size:13px;margin-top:8px;min-height:18px}
.melding.ok{color:var(--ok)} .melding.err{color:var(--crit)}
.sluit{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}

/* ---------- login & fouten ---------- */
.scherm{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);padding:26px;box-shadow:var(--shadow)}
.scherm h1{font-family:var(--f-display);font-size:22px;margin:0 0 4px}
.scherm p{color:var(--muted);font-size:14px;margin:0 0 18px}
.scherm label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
.scherm input{width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-s);padding:10px}
.scherm .btn{width:100%;margin-top:16px;padding:11px}
.foutbalk{background:var(--crit-soft);border:1px solid #E8C4BB;color:var(--crit);
  border-radius:var(--r-m);padding:11px 14px;margin-bottom:14px;font-size:14px}
.foutbalk code{font-family:var(--f-mono);font-size:12px;word-break:break-all}
.verborgen{display:none !important}

@media (max-width:640px){
  .wrap{padding:12px}
  .datumbalk h1{font-size:20px}
  .rij{grid-template-columns:58px 1fr;padding:10px 12px}
  .rij .rechts{grid-row:auto;grid-column:1 / -1;justify-content:flex-start;margin-top:3px}
  .detail{width:100%;border-left:0}
  .paar{grid-template-columns:96px 1fr}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="scherm" id="loginScherm">
  <h1>Vandaag</h1>
  <p>Log in met je eigen e-mailadres.</p>
  <div class="foutbalk verborgen" id="loginFout"></div>
  <label for="lg_email">E-mailadres</label>

<!-- ============ APP ============ -->
<div id="app" class="verborgen">

  <div class="topbar">
    <div class="merk">Bed &amp; Wellness Flevoland<span id="locTitel">alle locaties</span></div>

</div>

<!-- ============ DETAIL ============ -->
<aside class="detail" id="detail" aria-label="Reserveringsgegevens">
  <div class="detail-kop">
    <div>
      <h2 id="d_naam">—</h2>
      <span class="sub" id="d_sub"></span>
    </div>
    <button class="sluit" id="d_sluit" aria-label="Sluiten">&times;</button>
  </div>
  <div class="detail-body" id="d_body"></div>

<script>
/* ==========================================================================
   Vandaag — Bed & Wellness Flevoland
   Toont de aankomsten en vertrekken van één dag en verbindt ze met het
   incheckformulier en de gastenlink. Leest uit: reservations (eigen
   boekingen), res_koppeling (boekingen uit de agenda + extra gegevens),
   checkins (ingevulde incheckformulieren) en gast_aanmeldingen.
   Schrijft alleen naar res_koppeling, en alleen het notitieveld.
   ========================================================================== */

const CFG = {
  url : 'https://iuyjvtlauktnjprbmbjj.supabase.co',
  key : 'sb_publishable_SfQjQTwKa3BgCtjwE-8ljw_mTpqEY3U',
  ls  : 'bwf_vandaag_sessie'
};

/* De boekingen van Booking.com, Origineel Overnachten en Privésauna komen niet
   uit Supabase maar live uit de agenda, via dezelfde proxy als het VR-dashboard. */
const AGENDA = {
  proxy: 'https://script.google.com/macros/s/AKfycbwyOhWt48rEQP6sfGvT6NokYWmmuVTziy064gPez9rRXTPEvmJcAb_qPk6m0i4UCY1f4A/exec',
  key  : 'bwf7k2mxq9tvr20264nphs8wjc3'
};

const LOCATIES = {
  angie   : { naam:'Suite Angie',      plaats:'Almere',   groep:'almere'   },
  jacuzzi : { naam:'Malina Jacuzzi',   plaats:'Lelystad', groep:'lelystad' },
  deluxe  : { naam:'Malina Zwembad',   plaats:'Lelystad', groep:'lelystad' }
};

/* Een vaste locatie afdwingen via de link, bijvoorbeeld
   vandaag.html?loc=lelystad voor het Lelystad-dashboard. */
const VASTE_LOC = (new URLSearchParams(location.search).get('loc') || '').toLowerCase();

let SESSIE = null, IK = null, DATUM = vandaagISO(), ITEMS = [], ACTIEF = null;

/* ============ hulpjes ============ */
function vandaagISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function schuifDag(iso, dagen){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + dagen);
  return d.toISOString().slice(0,10);
}
function nlDatum(iso){
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('nl-NL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
/* Tijden staan als tekst in de database ("9:00", "09.00", "20:00 uur").
   Zonder normaliseren komt 9:00 ná 14:00 te staan bij het sorteren. */
function tijd(v){
  if(!v) return '';
  const m = String(v).match(/(\d{1,2})\s*[:.uh]\s*(\d{2})/);
  if(m) return String(m[1]).padStart(2,'0') + ':' + m[2];
  const enkel = String(v).match(/^\s*(\d{1,2})\s*$/);
  return enkel ? String(enkel[1]).padStart(2,'0') + ':00' : '';
}
function getal(v){
  if(v === null || v === undefined || v === '') return 0;
  const n = parseFloat(String(v).replace(/[^0-9,.-]/g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function euro(n){ return '€ ' + (Math.round(n*100)/100).toFixed(2).replace('.', ','); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Locatie herkennen uit vrije tekst — de agenda schrijft het overal anders op. */
function locId(v){
  const t = String(v || '').toLowerCase();
  if(!t) return '';
  /* De agenda gebruikt korte codes: PSA, PSM en PSMD. Let op de volgorde,
     psmd moet vóór psm worden herkend. */
  if(/\bpsmd\b|\bpsd\b/.test(t)) return 'deluxe';
  if(/\bpsm\b/.test(t))            return 'jacuzzi';
  if(/\bpsa\b/.test(t))            return 'angie';
  if(t.includes('angie') || t.includes('almere') || t.includes('specerij')) return 'angie';
  if(t.includes('zwembad') || t.includes('deluxe') || t.includes('pool'))   return 'deluxe';
  if(t.includes('jacuzzi') || t.includes('malina'))                          return 'jacuzzi';
  if(LOCATIES[t]) return t;
  return '';
}

/* Uit een agendatitel de gastnaam vissen. De titels bevatten van alles:
   pakketnamen, bedragen, telefoonnummers. Woorden met een hoofdletter die
   geen bekend sleutelwoord zijn, vormen samen meestal de naam. */
const NAAM_RUIS = new RegExp('^(booking|bookingcom|com|relax|stay|all|inclusive|incl|late|check|checkin|' +
  'checkout|overnachting|overnachten|origineel|orgineel|middag|deals|deal|geniet|uur|van|exclusieve|' +
  'wellness|suite|jacuzzi|zwembad|luxe|deluxe|malina|angie|prive|priv\u00e9|sauna|whatsapp|wa|boeking|' +
  'inclusief|exclusief|bad|bedlinnen|minibar|early|middagdeal|deel|voucher|omboeking|extra|' +
  'reservering|telefonisch|planyo|secret|rooms|arrangement|romantisch|verjaardag|ontbijt|diner|honeymoon|' +
  'bruidsnacht|niet|beschikbaar|bezet|agenda|dicht|schoonmaken|prachtige|deze|met|een|heerlijk|chips|' +
  'snackpakket|handdoeken|badjassen|slippers|frisdranken|inbegrepen|pakket|drankjes|betaald|betalen|' +
  'totaal|nog|contant|volledig|personen|pers|volwassenen|kind|kinderen|nachten|nacht|tot|in|out|' +
  'aanmaken|genieten)$', 'i');

/* Geen naam te vinden? Dan een leesbaar begin van de titel, zodat de
   locatiemanager toch ziet om welke boeking het gaat. */
function kortTitel(t){
  var s = String(t || '').replace(/\s+/g, ' ').trim();
  return s.length > 44 ? s.slice(0, 44) + '\u2026' : s;
}

function naamUit(titel){
  var ruw = String(titel || '');
  var s = ruw.replace(/\S+@\S+/g, ' ')
             .replace(/\u20ac\s*[\d.,]+/g, ' ')
             .replace(/[+\d][\d\s.\/-]{5,}/g, ' | ')
             .replace(/[#!,;:()]/g, ' ');
  var beste = [], rij = [];
  s.split('|')[0].split(/\s+/).filter(Boolean).forEach(function(w){
    var schoon = w.replace(/[^A-Za-z\u00C0-\u017F'-]/g, '');
    var tussen = /^(van|de|der|den|te|ter|el|al|bin)$/i.test(schoon);
    var hoofd = /^[A-Z\u00C0-\u017F]/.test(schoon) && schoon.length > 1 &&
                !schoon.split('-').some(function(x){ return NAAM_RUIS.test(x); });
    var na = rij.length && /^(van|de|der|den|te|ter)$/i.test(rij[rij.length - 1]) && schoon.length > 1;
    if(hoofd || (tussen && rij.length) || na) rij.push(schoon);
    else { if(rij.length > beste.length) beste = rij; rij = []; }
  });
  if(rij.length > beste.length) beste = rij;
  return beste.length ? beste.slice(0, 3).join(' ') : '';
}
function locNaam(id){ return LOCATIES[id] ? LOCATIES[id].naam : (id || 'Onbekende locatie'); }

/* ============ sessie ============ */
/* De sessie van het portaal gebruiken als die er is, zodat je maar één keer
   hoeft in te loggen. Supabase bewaart hem onder sb-<project>-auth-token. */
function portaalSessie(){
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') > -1){
        var v = JSON.parse(localStorage.getItem(k));
        if(v && v.access_token){
          var deel = JSON.parse(atob(v.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
          if(!deel.exp || deel.exp * 1000 > Date.now()){
            return { token:v.access_token, refresh:v.refresh_token, verloopt:(deel.exp||0) * 1000 - 60000 };
          }
        }
      }
    }
  }catch(e){}
  return null;
}
function laadSessie(){
  SESSIE = portaalSessie();
  if(SESSIE) return SESSIE;
  try{ SESSIE = JSON.parse(localStorage.getItem(CFG.ls) || 'null'); }catch(e){ SESSIE = null; }
  return SESSIE;
}
function zetSessie(d){
  if(!d || !d.access_token){ SESSIE = null; localStorage.removeItem(CFG.ls); return null; }
  SESSIE = { token:d.access_token, refresh:d.refresh_token,
             verloopt: Date.now() + ((d.expires_in || 3600) - 60) * 1000 };
  localStorage.setItem(CFG.ls, JSON.stringify(SESSIE));
  /* ook wegschrijven in het formaat dat de andere pagina's lezen, zodat je
     na inloggen hier ook in het dashboard en het incheckformulier binnen bent */
  try{
    localStorage.setItem('sb-iuyjvtlauktnjprbmbjj-auth-token', JSON.stringify({
      access_token: d.access_token, refresh_token: d.refresh_token,
      token_type: 'bearer', expires_in: d.expires_in || 3600,
      expires_at: Math.floor(Date.now()/1000) + (d.expires_in || 3600),
      user: d.user || null
    }));
  }catch(e){}
  return SESSIE;
}
function uid(){
  try{ return JSON.parse(atob(SESSIE.token.split('.')[1])).sub; }catch(e){ return null; }
}
async function authApi(pad, body){
  const r = await fetch(CFG.url + '/auth/v1/' + pad, {
    method:'POST', headers:{ apikey:CFG.key, 'Content-Type':'application/json' },
    body: JSON.stringify(body || {})
  });
  const t = await r.text();
  const d = t ? JSON.parse(t) : null;
  if(!r.ok) throw new Error((d && (d.error_description || d.msg || d.message)) || ('Inloggen mislukte (' + r.status + ')'));
  return d;
}
async function vernieuwSessie(){
  if(!SESSIE || !SESSIE.refresh) return false;
  try{ zetSessie(await authApi('token?grant_type=refresh_token', { refresh_token:SESSIE.refresh })); return true; }
  catch(e){ zetSessie(null); return false; }
}

/* ============ database ============ */
async function api(pad, opts, tweede){
  if(SESSIE && SESSIE.verloopt && Date.now() > SESSIE.verloopt) await vernieuwSessie();
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({
    apikey: CFG.key,
    Authorization: 'Bearer ' + (SESSIE ? SESSIE.token : CFG.key),
    'Content-Type': 'application/json'
  }, (opts && opts.headers) || {});
  const r = await fetch(CFG.url + '/rest/v1/' + pad, o);
  if((r.status === 401 || r.status === 403) && !tweede && SESSIE){
    if(await vernieuwSessie()) return api(pad, opts, true);
  }
  if(!r.ok){ throw new Error(r.status + ' ' + (await r.text()).slice(0, 240)); }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
/* Elke tabel apart: valt er één weg (bijvoorbeeld door een rechtenregel),
   dan blijft de rest van de pagina gewoon werken en zie je wát er misging. */
const FOUTEN = [];
async function haal(pad, naam){
  try{ return (await api(pad)) || []; }
  catch(e){ FOUTEN.push(naam + ': ' + e.message); return []; }
}

}

/* De agenda geeft per afspraak: start, eind, gast, suite, nummer en bron.
   De sleutel is exact dezelfde als in het VR-dashboard, zodat de notities
   en koppelingen die daar zijn gemaakt hier ook verschijnen. */
function agendaSleutel(ev){
  const nummer = ev.nummer || ev.referentie || ev.reservering;
  if(nummer) return String(nummer);
  return (ev.suite || ev.locatie || '') + '-' +
         String(ev.start || '').slice(0,10) + '-' + tijd(ev.start);
}
async function haalAgenda(){
  try{
    const r = await fetch(AGENDA.proxy + '?k=' + encodeURIComponent(AGENDA.key));
    if(!r.ok) throw new Error('agenda antwoordde met ' + r.status);
    const j = await r.json();
    return (j.events || []).filter(ev => ev.soort === 'reservering' || ev.soort === 'extern');
  }catch(e){
    FOUTEN.push('agenda: ' + e.message + ' — boekingen van Booking.com, Origineel Overnachten en Privésauna ontbreken nu');
    return [];
  }
}

/* ============ gegevens van één dag ============ */
async function laadDag(){
  FOUTEN.length = 0;
  const d = DATUM;
  /* De tabellen zijn klein (tientallen tot honderden rijen), dus we halen ze
     in hun geheel op. Dat is betrouwbaarder dan filteren op datum: een
     koppeling of incheckformulier heeft niet altijd een datum ingevuld. */
  const [agenda, res, kop, chk, aanm, calls] = await Promise.all([
    haalAgenda(),
    haal('reservations?select=*&limit=3000', 'reservations'),
    haal('res_koppeling?select=*&limit=5000', 'res_koppeling'),
    haal('checkins?select=*&order=created_at.desc&limit=2000', 'checkins'),
    haal('gast_aanmeldingen?select=*&order=created_at.desc&limit=500', 'gast_aanmeldingen'),
    haal('wz_welkomstcalls?select=*&order=datum.desc&limit=1500', 'wz_welkomstcalls')
  ]);

  const perSleutel = {};
  const zet = (sleutel, obj) => {
    if(!perSleutel[sleutel]) perSleutel[sleutel] = { sleutel, bron:'', koppeling:null, checkin:null, aanmelding:null };
    return Object.assign(perSleutel[sleutel], obj);
  };

  /* 1. boekingen uit de agenda — de externe kanalen */
  agenda.forEach(ev => {
    const van = String(ev.start || '').slice(0,10);
    const tot = String(ev.eind || '').slice(0,10) || van;
    if(van !== d && tot !== d) return;
    zet(agendaSleutel(ev), {
      id      : agendaSleutel(ev),
      resnr   : ev.nummer || ev.referentie || ev.reservering || '',
      naam    : ev.gast || ev.naam || naamUit(ev.titel) || kortTitel(ev.titel),
      titelRuw: ev.titel || '',
      locatie : locId(ev.suite || ev.locatie),
      aankomst: van, vertrek: tot,
      tijdIn  : tijd(ev.start), tijdUit: tijd(ev.eind),
      personen: ev.personen || '',
      bron    : ev.bron || 'Uit de agenda',
      eigen   : false, uitAgenda: true
    });
  });

  /* 2. eigen reserveringen — sleutel 'hm-<id>', net als in het VR-dashboard */
  res.forEach(r => {
    const van = String(r.checkindatum || '').slice(0,10);
    const tot = String(r.checkuitdatum || '').slice(0,10) || van;
    if(van !== d && tot !== d) return;
    zet('hm-' + r.id, {
    id: r.id,
    resnr: r.id,
    naam: [r.voornaam, r.achternaam].filter(Boolean).join(' ').trim(),
    locatie: locId(r.locatie),
    aankomst: r.checkindatum, vertrek: r.checkuitdatum,
    tijdIn: tijd(r.checkintijd), tijdUit: tijd(r.checkuittijd),
    arrangement: r.arrangement, totaal: getal(r.totaal), betaald: getal(r.betaald),
    telefoon: r.telefoon, email: r.email, opmerkingen: r.opmerkingen,
    toegewezen: r.toegewezen, bron: 'Eigen reservering', eigen: true
    });
  });

  /* 3. res_koppeling — de extra gegevens die het team aan een boeking hangt:
        notities, bedragen, koppeling aan een incheckformulier of klant */
  kop.forEach(k => {
    if(k.geannuleerd) { delete perSleutel[k.res_sleutel]; return; }
    const bestaat = !!perSleutel[k.res_sleutel];
    if(!bestaat && k.aankomst !== d && k.vertrek !== d) return;
    const b = perSleutel[k.res_sleutel] || {};
    zet(k.res_sleutel, {
      koppeling: k,
      id       : b.id || k.res_sleutel,
      resnr    : b.resnr || k.res_sleutel.replace(/^hm-/, ''),
      naam     : b.naam || k.gast || '',
      locatie  : b.locatie || locId(k.locatie) || locId(k.res_sleutel),
      aankomst : b.aankomst || k.aankomst,
      vertrek  : b.vertrek  || k.vertrek,
      tijdIn   : b.tijdIn   || tijd(k.tijd_in),
      tijdUit  : b.tijdUit  || tijd(k.tijd_uit),
      arrangement: b.arrangement || k.arrangement,
      totaal   : b.totaal  || getal(k.totaal),
      betaald  : b.betaald || getal(k.betaald),
      telefoon : b.telefoon || k.telefoon,
      email    : b.email || k.email,
      personen : b.personen || k.personen,
      bron     : b.bron || k.bron || 'Uit de agenda',
      eigen    : !!b.eigen
    });
  });

  /* 4. ingevulde incheckformulieren erbij zoeken */
  chk.forEach(c => {
    const verwijzingen = [c.gekoppelde_reservering, c.reservation_id, c.resnr].filter(Boolean).map(String);
    let doel = Object.values(perSleutel).find(x =>
      verwijzingen.includes(String(x.sleutel)) ||
      verwijzingen.includes(String(x.resnr)) ||
      verwijzingen.includes(String(x.id)) ||
      (x.koppeling && String(x.koppeling.checkin_id) === String(c.id))
    );
    /* geen reservering gevonden: het formulier is los ingevuld. Alleen tonen
       als het formulier zelf over deze dag gaat, anders zou de hele historie
       in de lijst belanden. */
    if(!doel && c.datum !== d && c.checkuitdatum !== d) return;
    if(!doel){
      doel = zet('chk-' + c.id, {
        id: c.id, resnr: c.resnr || '',
        naam: [c.voornaam, c.achternaam].filter(Boolean).join(' ').trim(),
        locatie: locId(c.locatie), aankomst: c.datum, vertrek: c.checkuitdatum,
        tijdIn: tijd(c.incheck), tijdUit: tijd(c.uitcheck),
        totaal: getal(c.totaal), betaald: getal(c.aanbetaald),
        telefoon: c.telefoon, email: c.email, personen: c.personen,
        bron: c.boeking_via || 'Los incheckformulier', losFormulier: true
      });
    }
    doel.checkin = c;
    if(!doel.naam) doel.naam = [c.voornaam, c.achternaam].filter(Boolean).join(' ').trim();
    if(!doel.personen) doel.personen = c.personen;
  });

  /* 5. wat de gast zelf heeft ingestuurd */
  aanm.forEach(g => {
    const doel = Object.values(perSleutel).find(x =>
      (x.checkin && String(g.checkin_id) === String(x.checkin.id)) ||
      (g.code && String(g.code) === String(x.resnr)) ||
      (!g.checkin_id && !g.code && locId(g.locatie) === x.locatie &&
        (x.naam || '').toLowerCase().includes(String(g.achternaam || '~').toLowerCase()))
    );
    if(doel){ doel.aanmelding = g; return; }
    if(g.datum !== d) return;
    zet('gast-' + g.id, {
      id: g.id, resnr: g.code || '',
      naam: [g.voornaam, g.achternaam].filter(Boolean).join(' ').trim(),
      locatie: locId(g.locatie), aankomst: g.datum,
      bron: 'Aanmelding van gast', aanmelding: g, losseAanmelding: true
    });
  });

  /* 6. de welkomstcall erbij zoeken: op referentie, anders op naam en datum */
  const telSchoon = t => String(t || '').replace(/\D/g, '').slice(-9);
  Object.values(perSleutel).forEach(x => {
    const nx = String(x.naam || '').toLowerCase().replace(/\s+/g, ' ').trim();
    x.call = calls.find(c => {
      if(c.referentie && x.resnr && String(c.referentie) === String(x.resnr)) return true;
      if(c.telefoon && x.telefoon && telSchoon(c.telefoon) && telSchoon(c.telefoon) === telSchoon(x.telefoon)) return true;
      const nc = String(c.naam || ((c.voornaam || '') + ' ' + (c.achternaam || ''))).toLowerCase().trim();
      if(!nc || nc.length < 4 || !nx) return false;
      const zelfdeDag = !c.datum || !x.aankomst || String(c.datum).slice(0,10) === x.aankomst;
      return zelfdeDag && (nc === nx || nx.indexOf(nc) > -1 || nc.indexOf(nx) > -1);
    }) || null;
  });

  /* Dezelfde boeking kan twee keer voorkomen, bijvoorbeeld met en zonder
     het voorvoegsel planyo-. Zelfde locatie, datum en naam telt als één. */
  var gezien = {};
  ITEMS = Object.values(perSleutel).filter(function(x){
    var sleutel = [x.locatie, x.aankomst, x.vertrek,
                   String(x.naam || '').toLowerCase().replace(/\s+/g, ' ').trim()].join('|');
    if(gezien[sleutel]) return false;
    gezien[sleutel] = true;
    return true;
  });
  toonFouten();
}

function toonFouten(){
  const balk = document.getElementById('dataFout');
  if(!FOUTEN.length){ balk.classList.add('verborgen'); return; }
  balk.innerHTML = 'Niet alles kon geladen worden. Dit ging mis:<br>' +
    FOUTEN.map(f => '<code>' + esc(f) + '</code>').join('<br>');
  balk.classList.remove('verborgen');
}

/* ============ tekenen ============ */
function zichtbaar(){
  const filter = VASTE_LOC ? '' : document.getElementById('locFilter').value;
  return ITEMS.filter(x => {
    if(filter && x.locatie !== filter) return false;
    if(VASTE_LOC){
      const groep = LOCATIES[x.locatie] ? LOCATIES[x.locatie].groep : '';
      if(VASTE_LOC === 'lelystad' && groep !== 'lelystad') return false;
      if(VASTE_LOC === 'almere'   && groep !== 'almere')   return false;
      if(LOCATIES[VASTE_LOC] && x.locatie !== VASTE_LOC)   return false;
    }
    return true;
  });
}
/* De status uit de welkomstcall vertalen naar onze eigen lijst. */
function callStatus(c){
  if(!c) return '';
  const s = String(c.status || c.uitkomst || '').toLowerCase();
  if(/voltooid|gedaan|afgerond|gebeld|ok/.test(s) && !/geen/.test(s)) return 'gebeld en geregeld';
  if(/geen gehoor|niet bereikt/.test(s)) return 'geen gehoor';
  if(/terugbellen|later/.test(s))        return 'terugbellen';
  if(/nummer|onjuist|klopt niet/.test(s)) return 'nummer klopt niet';
  return '';
}

function isOvernachting(x){ return !!(x.vertrek && x.vertrek !== x.aankomst); }

function teken(){
  const lijst = zichtbaar();
  const aankomsten = lijst.filter(x => x.aankomst === DATUM)
    .sort((a,b) => (a.tijdIn || '99:99').localeCompare(b.tijdIn || '99:99'));
  const vertrekken = lijst.filter(x => x.vertrek === DATUM && x.aankomst !== DATUM)
    .sort((a,b) => (a.tijdUit || '99:99').localeCompare(b.tijdUit || '99:99'));

  const nogAanmaken = lijst.filter(x => /boeking nog aanmaken|nog aanmaken/i.test(x.titelRuw || x.naam || '')).length;
  const zonderIncheck = aankomsten.filter(x => !x.checkin).length;
  const zonderGast    = aankomsten.filter(x => !x.aanmelding).length;
  const teBetalen     = aankomsten.reduce((s,x) => s + Math.max(0, (x.totaal||0) - (x.betaald||0)), 0);

  document.getElementById('tellers').innerHTML =
    `<div class="teller"><b>${aankomsten.length}</b><span>aankomsten</span></div>` +
    `<div class="teller"><b>${vertrekken.length}</b><span>vertrekken</span></div>` +
    (nogAanmaken ? `<div class="teller"><b>${nogAanmaken}</b><span>nog aan te maken</span></div>` : '') +
    `<div class="teller"><b>${zonderIncheck}</b><span>zonder incheckformulier</span></div>` +
    `<div class="teller"><b>${zonderGast}</b><span>gast nog niet ingevuld</span></div>` +
    (teBetalen > 0 ? `<div class="teller"><b>${euro(teBetalen)}</b><span>nog te betalen op locatie</span></div>` : '');

  const blok = (titel, rijen, veld) => {
    if(!rijen.length) return '';
    return `<section class="groep"><h2 class="groepkop">${titel} <em>${rijen.length}</em></h2>` +
      rijen.map(x => rijHtml(x, veld)).join('') + '</section>';
  };

  const html =
    blok('Aankomst', aankomsten, 'tijdIn') +
    blok('Vertrek',  vertrekken, 'tijdUit');

  document.getElementById('lijst').innerHTML = html ||
    `<div class="leeg">Geen reserveringen op ${nlDatum(DATUM)}.<br>
      Staat er wel een boeking in de agenda? Open die eerst in het VR-dashboard, dan verschijnt hij hier.</div>`;

  document.querySelectorAll('.rij').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.sleutel));
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDetail(el.dataset.sleutel); } });
  });
}

function rijHtml(x, veld){
  const tags = [];
  tags.push(`<span class="tag">${esc(locNaam(x.locatie))}</span>`);
  tags.push(`<span class="tag">${isOvernachting(x) ? 'overnachting' : 'dagverblijf'}</span>`);
  /* Boekingen die nog echt aangemaakt moeten worden, springen eruit. */
  if(/boeking nog aanmaken|nog aanmaken/i.test(x.titelRuw || x.naam || ''))
    tags.push('<span class="tag let">nog aanmaken</span>');
  tags.push(x.checkin
    ? '<span class="tag ok">incheck klaar</span>'
    : '<span class="tag open">incheck open</span>');
  if(x.aanmelding) tags.push('<span class="tag ok">gast ingevuld</span>');
  /* de welkomstcall en bijzonderheden meteen zichtbaar in de lijst */
  const wcs = x.koppeling && x.koppeling.wc_status;
  if(wcs === 'gebeld en geregeld') tags.push('<span class="tag ok">welkomstcall gedaan</span>');
  else if(wcs && wcs !== 'nog niet gebeld') tags.push('<span class="tag open">' + esc(wcs) + '</span>');
  if(x.koppeling && x.koppeling.notitie) tags.push('<span class="tag let">notitie</span>');
  else if(x.call && (x.call.bijzonderheden || x.call.allergieen))
    tags.push('<span class="tag let">bijzonderheden</span>');
  const open = Math.max(0, (x.totaal||0) - (x.betaald||0));
  if(open > 0) tags.push(`<span class="tag let">${euro(open)} op locatie</span>`);

  return `<div class="rij" role="button" tabindex="0" data-sleutel="${esc(x.sleutel)}"
      ${ACTIEF === x.sleutel ? 'data-actief="1"' : ''}>
    <div class="tijd">${esc(x[veld] || '—')}</div>
    <div class="naam">${esc(x.naam || 'Naam onbekend')}</div>
    <div class="meta">${esc(x.resnr || 'geen nummer')} · ${esc(x.bron || '')}</div>
    <div class="rechts">${tags.join('')}</div>
  </div>`;
}

/* ============ detail ============ */

  /* Is er nog niets ingevuld, dan nemen we over wat er in de welkomstcall staat. */
  const uitCall = callStatus(x.call);

    status : (x.koppeling && x.koppeling.wc_status) || uitCall || 'nog niet gebeld',

       x.call.gelegenheid ? 'Gelegenheid: ' + x.call.gelegenheid : '']
        .filter(Boolean).join('\n')
    : '';

  document.getElementById('d_body').innerHTML = `
    <div class="blok">
      <dl class="paar">

        <dt>Vertrek</dt><dd>${esc(x.vertrek || '—')} ${esc(x.tijdUit || '')}</dd>
        <dt>Verblijf</dt><dd>${isOvernachting(x) ? 'Overnachting' : 'Dagverblijf'}</dd>
        <dt>Personen</dt><dd>${esc(x.personen || '—')}</dd>
        <dt>Arrangement</dt><dd>${esc(x.arrangement || '—')}</dd>
        <dt>Toegewezen</dt><dd>${esc(x.toegewezen || (x.koppeling && x.koppeling.medewerker) || '—')}</dd>
      </dl>
    </div>
    <div class="blok">
      <h3>Contact</h3>
      <dl class="paar">
        <dt>Telefoon</dt><dd>${x.telefoon ? `<a href="tel:${esc(x.telefoon)}">${esc(x.telefoon)}</a>` : '—'}</dd>
        <dt>E-mail</dt><dd>${x.email ? `<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>` : '—'}</dd>
      </dl>
    </div>
    <div class="blok">
      <h3>Betaling</h3>
      <dl class="paar">
        <dt>Totaal</dt><dd class="bedrag">${euro(x.totaal||0)}</dd>
        <dt>Betaald</dt><dd class="bedrag">${euro(x.betaald||0)}</dd>
        <dt>Op locatie</dt><dd class="bedrag ${open>0?'open-bedrag':''}">${euro(open)}</dd>
      </dl>
    </div>
    <div class="blok">
      <h3>Incheckformulier</h3>
      <p style="margin:0 0 4px;font-size:14px">${x.checkin
        ? 'Ingevuld en opgeslagen' + (x.checkin.status ? ' — ' + esc(x.checkin.status) : '') + '.'
        : 'Nog niet aangemaakt.'}</p>
      <div class="knoprij">
        <a class="btn sm" href="${incheckLink(x)}" target="_blank" rel="noopener">
          ${x.checkin ? 'Formulier openen' : 'Incheckformulier starten'}</a>
      </div>
    </div>
    <div class="blok">
      <h3>Gegevens van de gast</h3>
      <p style="margin:0 0 4px;font-size:14px">${g
        ? `Ingestuurd door ${esc([g.voornaam,g.achternaam].filter(Boolean).join(' '))} — ${esc(g.woonplaats||'')} ${esc(g.nationaliteit||'')}, ${g.handtekening ? 'met handtekening' : 'zonder handtekening'}.`
        : 'Nog niet ingevuld. Stuur de gast de link.'}</p>
      <div class="knoprij">
        <button class="btn sec sm" id="d_kopieer">Link kopiëren</button>
        <a class="btn sec sm" id="d_wa" target="_blank" rel="noopener">Via WhatsApp</a>
        <a class="btn sec sm" href="${gastLink(x)}" target="_blank" rel="noopener">Zelf openen</a>
      </div>
    </div>
    <div class="blok">
      <h3>Snel naar</h3>
      <div class="knoprij">
        <a class="btn sec sm" href="${boekingLink(x)}" target="_blank" rel="noopener">Boeking aanmaken</a>
        <a class="btn sec sm" href="${klantLink(x)}" target="_blank" rel="noopener">Klantgegevens</a>
        <a class="btn sec sm" href="${gastLink(x)}" target="_blank" rel="noopener">Gastenformulier invullen</a>
      </div>
    </div>
    <div class="blok">
      <h3>Welkomstcall en bijzonderheden</h3>
      <dl class="paar">
        <dt>Status</dt><dd>
          <select id="d_wcstatus" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:6px">
            ${['nog niet gebeld','gebeld en geregeld','geen gehoor','terugbellen','nummer klopt niet',
               'wil niet gebeld worden'].map(function(s){
                 return '<option' + (wc.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('')}
          </select></dd>
        <dt>Bijgeboekt</dt><dd>
          <input type="number" id="d_wcbedrag" step="0.01" min="0" value="${wc.bedrag || ''}"
                 placeholder="bedrag extra's" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:6px"></dd>
        <dt>Hoe betaald</dt><dd>
          <select id="d_wcbetaald" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:6px">
            ${['nog niet betaald','vooraf via betaallink','op locatie pin','op locatie contant',
               'bij de reservering inbegrepen'].map(function(s){
                 return '<option' + (wc.betaald === s ? ' selected' : '') + '>' + s + '</option>'; }).join('')}
          </select></dd>
      </dl>
      <textarea id="d_notitie" style="margin-top:8px"
        placeholder="Bijzonderheden voor de locatiemanager: late aankomst, allergie, taart om 20:00, welke extra's zijn bijgeboekt.">${esc(notitieTonen)}</textarea>
      ${x.call ? '<p class="sub" style="font-size:12px;color:var(--muted);margin:6px 0 0">Overgenomen uit de welkomstcall van ' +
        esc(String(x.call.gebeld_op || x.call.datum || '').slice(0,10)) + '. Pas aan en bewaar om het vast te leggen.</p>' : ''}
      <div class="knoprij"><button class="btn sm" id="d_bewaar">Bewaren</button></div>
      <div class="melding" id="d_melding"></div>
    </div>
    ${(x.opmerkingen || x.titelRuw) ? `<div class="blok"><h3>Uit de boeking</h3><p style="font-size:14px;margin:0">${esc(x.opmerkingen || x.titelRuw)}</p></div>` : ''}
  `;

  const link = gastLink(x);
  document.getElementById('d_wa').href = 'https://wa.me/?text=' + encodeURIComponent(
    'Welkom bij Bed & Wellness Flevoland! Vul je gegevens alvast in via deze link, dan hoef je bij aankomst niets meer te doen: ' + link);
  document.getElementById('d_kopieer').addEventListener('click', () => {
    navigator.clipboard.writeText(link).then(() => melding('Link gekopieerd.', 'ok'))
      .catch(() => melding('Kopiëren lukte niet — gebruik "Zelf openen".', 'err'));
  });
  document.getElementById('d_bewaar').addEventListener('click', () => bewaarNotitie(x));

  document.getElementById('detail').dataset.open = '1';
  document.querySelectorAll('.rij').forEach(el =>
    el.dataset.actief = el.dataset.sleutel === sleutel ? '1' : '');
}
function melding(t, s){
  const el = document.getElementById('d_melding');
  if(el){ el.textContent = t; el.className = 'melding ' + (s || ''); }
}
function sluitDetail(){
  document.getElementById('detail').dataset.open = '';
  ACTIEF = null;
  document.querySelectorAll('.rij').forEach(el => el.dataset.actief = '');
}

/* Deeplink naar het incheckformulier: alle gegevens gaan mee in de link,
   zodat er nooit meer een reserveringsnummer overgetypt hoeft te worden. */
function incheckLink(x){
  const p = new URLSearchParams();
  p.set('reservering', x.resnr || x.id || '');
  if(x.locatie)  p.set('locatie', x.locatie);
  if(x.aankomst) p.set('van', x.aankomst);
  if(isOvernachting(x) && x.vertrek) p.set('tot', x.vertrek);
  if(x.tijdIn)   p.set('tijdin', x.tijdIn);
  if(x.tijdUit)  p.set('tijduit', x.tijdUit);
  if(x.personen) p.set('personen', String(x.personen));
  if(x.totaal)   p.set('totaal', String(x.totaal));
  if(x.betaald)  p.set('betaald', String(x.betaald));
  if(x.arrangement) p.set('arrangement', x.arrangement);
  if(x.bron)     p.set('kanaal', x.bron);
  if(x.telefoon) p.set('telefoon', x.telefoon);
  if(x.email)    p.set('email', x.email);
  const delen = String(x.naam || '').trim().split(/\s+/);
  if(delen[0]){ p.set('voornaam', delen[0]); if(delen.length > 1) p.set('achternaam', delen.slice(1).join(' ')); }
  if(x.opmerkingen) p.set('opmerking', x.opmerkingen);
  return 'incheckformulier.html?' + p.toString();
}
/* Een boeking aanmaken op de reserveringenpagina, met wat we al weten. */
function boekingLink(x){
  const p = new URLSearchParams();
  p.set('nieuw', '1');
  if(x.locatie)  p.set('locatie', x.locatie);
  if(x.aankomst) p.set('datum', x.aankomst);
  if(x.vertrek && x.vertrek !== x.aankomst) p.set('tot', x.vertrek);
  if(x.tijdIn)   p.set('tijdin', x.tijdIn);
  if(x.tijdUit)  p.set('tijduit', x.tijdUit);
  if(x.naam)     p.set('naam', x.naam);
  if(x.telefoon) p.set('telefoon', x.telefoon);
  if(x.email)    p.set('email', x.email);
  if(x.resnr)    p.set('referentie', x.resnr);
  return 'reserveringen.html?' + p.toString();
}
/* De klantkaart opzoeken in klantbeheer. */
function klantLink(x){
  const zoek = x.email || x.telefoon || String(x.naam || '').split(' ').slice(-1)[0] || '';
  return 'klantbeheer.html' + (zoek ? '?zoek=' + encodeURIComponent(zoek) : '');
}

function gastLink(x){
  const p = new URLSearchParams();
  if(x.resnr)    p.set('r', x.resnr);
  if(x.locatie)  p.set('loc', x.locatie);
  if(x.aankomst) p.set('d', x.aankomst);
  if(x.checkin)  p.set('c', x.checkin.id);   /* koppelt de aanmelding aan dít formulier */
  return location.href.replace(/[^/]*$/, '') + 'gast.html?' + p.toString();
}

async function bewaarNotitie(x){
  const tekst = document.getElementById('d_notitie').value;
  const wcStatus = (document.getElementById('d_wcstatus') || {}).value || null;
  const wcBedrag = parseFloat((document.getElementById('d_wcbedrag') || {}).value || 0) || null;
  const wcBetaald = (document.getElementById('d_wcbetaald') || {}).value || null;
  melding('Bezig met bewaren…', '');
  try{
    await api('res_koppeling?on_conflict=res_sleutel', {
      method:'POST',
      headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({
        res_sleutel: x.sleutel,
        bron: x.eigen ? 'handmatig' : (x.bron || 'agenda'),
        notitie: tekst,
        wc_status: wcStatus,
        wc_extra_bedrag: wcBedrag,
        wc_betaalwijze: wcBetaald,
        bijgewerkt: new Date().toISOString()
      })
    });
    if(!x.koppeling) x.koppeling = {};
    x.koppeling.notitie = tekst;
    x.koppeling.wc_status = wcStatus;
    x.koppeling.wc_extra_bedrag = wcBedrag;
    x.koppeling.wc_betaalwijze = wcBetaald;
    melding('Bewaard \u2014 de locatiemanager ziet dit ook.', 'ok');
    teken();
  }catch(e){
    melding('Bewaren lukte niet: ' + e.message, 'err');
  }
}

/* ============ mijn diensten ============
   Uit de planning: wanneer staat de ingelogde persoon ingeroosterd. Er wordt
   gezocht op medewerkersnummer, en anders op naam. */
let DIENSTEN_OPEN = false;

async function toonDiensten(){
  const vak = document.getElementById('dienstenVak');
  if(!vak) return;
  DIENSTEN_OPEN = !DIENSTEN_OPEN;
  if(!DIENSTEN_OPEN){ vak.innerHTML = ''; return; }

  vak.innerHTML = '<div class="dienstlijst">Bezig met ophalen\u2026</div>';
  const vanaf = DATUM;
  const rijen = await haal('planning?select=*&datum=gte.' + vanaf + '&order=datum.asc&limit=200', 'planning');

  /* In de planning staat een korte code als mw-ruth of mw-michel: het
     voorvoegsel mw- met de voornaam. Daar vergelijken we op, en voor de
     zekerheid ook op het volledige nummer en de hele naam. */
  const mijnId = IK ? String(IK.id || '').toLowerCase() : '';
  const mijnNaam = IK ? String(IK.naam || '').toLowerCase().trim() : '';
  const mijnVoornaam = mijnNaam.split(/\s+/)[0] || '';
  /* Als eigenaar zie je de hele planning, niet alleen je eigen diensten. */
  const alles = IK && /eigenaar|owner|administratie/i.test(String(IK.rol || ''));
  const mijn = alles ? rijen : rijen.filter(function(p){
    const m = String(p.medewerker_id || '').toLowerCase().trim();
    if(!m) return false;
    const kaal = m.replace(/^mw[-_]?/, '');
    return (mijnId && m === mijnId) ||
           (mijnNaam && (m === mijnNaam || kaal === mijnNaam)) ||
           (mijnVoornaam && kaal === mijnVoornaam) ||
           (mijnVoornaam && mijnVoornaam.length > 2 && kaal.indexOf(mijnVoornaam) === 0);
  });

  /* mw-ruth wordt Ruth */
  const wieNaam = function(code){
    const kaal = String(code || '').replace(/^mw[-_]?/, '').replace(/[-_]/g, ' ').trim();
    return kaal ? kaal.charAt(0).toUpperCase() + kaal.slice(1) : 'niet toegewezen';
  };

  vak.innerHTML = '<div class="dienstlijst"><h3>' +
    (alles ? 'Planning \u2014 alle medewerkers' : 'Mijn diensten' + (IK && IK.naam ? ' \u2014 ' + esc(IK.naam) : '')) +
    '</h3>' +
    (mijn.length
      ? mijn.slice(0, 40).map(function(p){
          return '<div class="dienstrij"><span class="dag">' +
            esc(nlDatum(String(p.datum).slice(0, 10))) + '</span><span>' +
            (alles ? '<strong>' + esc(wieNaam(p.medewerker_id)) + '</strong> \u00b7 ' : '') +
            esc(locNaam(locId(p.locatie)) || p.locatie || '') +
            (p.dienst ? ' \u00b7 ' + esc(p.dienst) : '') +
            (p.notitie ? ' \u00b7 ' + esc(p.notitie) : '') + '</span></div>';
        }).join('')
      : '<p style="margin:0;color:var(--muted);font-size:14px">Vanaf ' + esc(nlDatum(vanaf)) +
        (alles ? ' staat er niemand ingeroosterd.' : ' staan er geen diensten op jouw naam in de planning.') +
        '</p>') + '</div>';

  const sub = document.getElementById('dienstSub');
  if(sub) sub.textContent = mijn.length
    ? mijn.length + ' dienst' + (mijn.length === 1 ? '' : 'en') + ' vanaf vandaag' +
      (alles ? ' (alle medewerkers)' : '')
    : 'niets ingeroosterd gevonden';
}

/* ============ opstarten ============ */
async function ververs(){
  await laadDag();
  teken();
  if(ACTIEF && ITEMS.some(i => i.sleutel === ACTIEF)) openDetail(ACTIEF); else sluitDetail();
}
function zetDatum(iso){
  DATUM = iso;
  document.getElementById('datumKies').value = iso;
  document.getElementById('datumTitel').textContent =
    iso === vandaagISO() ? 'Vandaag' : nlDatum(iso).replace(/^./, c => c.toUpperCase()).split(' ').slice(1).join(' ');
  document.getElementById('datumSub').textContent = nlDatum(iso);
  ververs();
}
async function start(){
  document.getElementById('loginScherm').classList.add('verborgen');
  document.getElementById('app').classList.remove('verborgen');
  IK = await wieBenIk();
  document.getElementById('wieBen').textContent = IK ? (IK.naam + ' · ' + (IK.rol || '')) : 'ingelogd';
  if(VASTE_LOC){
    document.getElementById('locFilter').classList.add('verborgen');
    document.getElementById('locTitel').textContent =
      LOCATIES[VASTE_LOC] ? LOCATIES[VASTE_LOC].naam : ('locatie ' + VASTE_LOC);
  }
  zetDatum(vandaagISO());
}

document.getElementById('lg_knop').addEventListener('click', inloggen);
document.getElementById('lg_ww').addEventListener('keydown', e => { if(e.key === 'Enter') inloggen(); });
document.getElementById('knopUit').addEventListener('click', () => { zetSessie(null); location.reload(); });
document.getElementById('knopVernieuw').addEventListener('click', ververs);
document.getElementById('knopDiensten').addEventListener('click', toonDiensten);
document.getElementById('dagTerug').addEventListener('click', () => zetDatum(schuifDag(DATUM, -1)));
document.getElementById('dagVooruit').addEventListener('click', () => zetDatum(schuifDag(DATUM, 1)));
document.getElementById('knopVandaag').addEventListener('click', () => zetDatum(vandaagISO()));
document.getElementById('datumKies').addEventListener('change', e => zetDatum(e.target.value));
document.getElementById('locFilter').addEventListener('change', teken);
document.getElementById('d_sluit').addEventListener('click', sluitDetail);
document.addEventListener('keydown', e => { if(e.key === 'Escape') sluitDetail(); });

/* Wordt deze pagina in een dashboard ingeladen, dan is de eigen kopbalk
   dubbelop \u2014 die verbergen we dan. */
if(window.self !== window.top){
  document.documentElement.style.background = 'transparent';
  document.body.style.background = 'transparent';
  var kop = document.querySelector('.topbar');
  if(kop) kop.style.display = 'none';
  var w = document.querySelector('.wrap');
  if(w) w.style.padding = '4px 0 12px';
  /* de hoogte doorgeven zodat het kader meegroeit */
  setInterval(function(){
    try{ parent.postMessage({ bwf:'hoogte', bron:'vandaag',
      hoogte: document.documentElement.scrollHeight }, '*'); }catch(e){}
  }, 1200);
}

if(laadSessie()) start().catch(e => {
  zetSessie(null);
  document.getElementById('app').classList.add('verborgen');
  document.getElementById('loginScherm').classList.remove('verborgen');
});
</script>
