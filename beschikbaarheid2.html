<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14342A">
<title>Beschikbaarheid — Bed &amp; Wellness Flevoland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F1; --surface:#FFFFFF; --surface-2:#FBF9F5; --line:#E6E1D7; --line-soft:#F0ECE4;
  --ink:#1D2420; --ink-2:#46514A; --muted:#7E8A82;
  --groen:#14342A; --groen-2:#1F4D3D; --groen-zacht:#E7EFEA;
  --goud:#B9975B; --goud-zacht:#F6EFE1;
  --vrij:#2E7D53; --vrij-zacht:#E6F2EA;
  --deels:#B8860B; --deels-zacht:#FBF1DA;
  --bezet:#B3453A; --bezet-zacht:#FBEAE7;
  --r:12px;
  --f-titel:"Cormorant Garamond",Georgia,serif;
  --f-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px}
a{color:var(--groen-2)}
:focus-visible{outline:2px solid var(--goud);outline-offset:2px;border-radius:6px}

/* ---------- merkbalk ---------- */
.merkbalk{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.merkbalk .binnen{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
.merk{font-family:var(--f-titel);font-size:17px;letter-spacing:.16em;text-transform:uppercase;
  line-height:1.1;color:var(--groen)}
.merk small{display:block;font-size:9.5px;letter-spacing:.34em;color:var(--goud);margin-top:2px}
.merkbalk nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.merkbalk nav a{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;
  color:var(--ink-2);padding:7px 12px;border-radius:999px;white-space:nowrap}
.merkbalk nav a:hover{background:var(--surface-2)}
.merkbalk nav a.hier{color:var(--groen);border-bottom:2px solid var(--goud);border-radius:0}
.merkbalk .wie{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* ---------- sfeerbeeld ---------- */
.hero{position:relative;min-height:190px;display:flex;align-items:flex-end;
  background:var(--groen) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(
  to right, rgba(20,52,42,.92) 0%, rgba(20,52,42,.72) 45%, rgba(20,52,42,.25) 100%)}
.hero .tekst{position:relative;z-index:1;max-width:1120px;margin:0 auto;width:100%;padding:26px 18px 24px;color:#fff}
.hero h1{font-family:var(--f-titel);font-size:34px;font-weight:500;margin:0 0 4px;letter-spacing:.01em}
.hero p{margin:0;font-size:14px;color:rgba(255,255,255,.82);max-width:52ch}

/* ---------- dagbalk ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px 70px}
.dagkaart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:16px}
.dagrij{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dagrij h2{font-family:var(--f-titel);font-size:24px;font-weight:500;margin:0;line-height:1.15}
.dagrij .sub{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rond{width:36px;height:36px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:50%;cursor:pointer;font-size:15px;color:var(--ink-2);flex:none}
.rond:hover{border-color:var(--groen-2);color:var(--groen)}
.nu{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;
  padding:8px 15px;font:inherit;font-size:13px;cursor:pointer}
.nu:hover{border-color:var(--groen-2)}

.strook{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.strook::-webkit-scrollbar{display:none}
.dagje{flex:none;width:56px;text-align:center;border:1px solid var(--line);border-radius:10px;
  padding:7px 0 8px;background:var(--surface-2);cursor:pointer;font:inherit;color:inherit}
.dagje small{display:block;font-family:var(--f-mono);font-size:9.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em}
.dagje b{display:block;font-family:var(--f-titel);font-size:19px;font-weight:500;line-height:1.25}
.dagje .stip{display:block;width:4px;height:4px;border-radius:50%;margin:3px auto 0;background:var(--line)}
.dagje[data-nu="1"]{background:var(--groen);border-color:var(--groen);color:#fff}
.dagje[data-nu="1"] small{color:rgba(255,255,255,.7)}
.dagje[data-nu="1"] .stip{background:var(--goud)}

.filterrij{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.filt{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;
  padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink-2)}
.filt:hover{border-color:var(--groen-2)}
.filt.aan{background:var(--groen);border-color:var(--groen);color:#fff}
.legenda{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
  border-top:1px solid var(--line-soft);margin-top:12px;padding-top:11px}
.legenda span{display:flex;align-items:center;gap:7px}
.legenda i{width:9px;height:9px;border-radius:50%;display:block}

/* ---------- suites ---------- */
.suite{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:26px}
.suitekop{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 2px 2px}
.suitekop .vlek{width:4px;height:20px;border-radius:2px;flex:none;background:var(--goud)}
.suitekop h3{font-family:var(--f-titel);font-size:21px;font-weight:500;margin:0;letter-spacing:.01em}
.suitekop .plaats{font-size:12.5px;color:var(--muted)}
.suitekop em{font-style:normal;margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.blok{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;cursor:pointer}
.blok:hover{border-color:var(--groen-2)}
.blok .tijd{flex:1;min-width:0}
.blok .tijd b{display:block;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums}
.blok .tijd span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.blok .merk2{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;
  border-radius:999px;background:var(--vrij-zacht);color:var(--vrij);white-space:nowrap;flex:none}
.blok .merk2::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.blok .chev{color:var(--muted);flex:none;font-size:15px}

.blok[data-vrij="deels"]{background:var(--deels-zacht);border-color:#EBD9AE}
.blok[data-vrij="deels"] .merk2{background:var(--surface);color:var(--deels)}
.blok[data-vrij="0"]{background:var(--bezet-zacht);border-color:#EFCFC8}
.blok[data-vrij="0"] .merk2{background:var(--surface);color:var(--bezet)}
.blok[data-vrij="0"] .tijd b{color:#7A2C24}

.leeg{color:var(--muted);font-size:13.5px;padding:12px 2px}
.balk{background:var(--bezet-zacht);color:var(--bezet);border:1px solid #EFCFC8;
  border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin-bottom:16px}

/* ---------- inloggen ---------- */
#slot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:var(--groen) center/cover no-repeat}
#slot::before{content:"";position:absolute;inset:0;background:rgba(20,52,42,.72)}
#slot.weg{display:none}
#slot .doos{position:relative;background:var(--surface);border-radius:16px;padding:30px 26px;
  max-width:380px;width:100%;text-align:center;box-shadow:0 24px 60px -30px rgba(20,52,42,.7)}
#slot .merk{margin-bottom:6px}
#slot .spreuk{font-family:var(--f-titel);font-size:14px;color:var(--muted);margin:0 0 20px}
#slot label{display:block;text-align:left;font-size:12.5px;color:var(--ink-2);margin:12px 0 4px}
#slot input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;font:inherit}
#slot input:focus{outline:2px solid var(--groen-2);outline-offset:-1px;background:#fff}
#slot button{width:100%;margin-top:18px;background:var(--groen);color:#fff;border:0;border-radius:8px;
  padding:12px;font:inherit;font-weight:600;cursor:pointer}
#slot button:hover{background:var(--groen-2)}
#slot .fout{color:var(--bezet);font-size:13px;margin-top:10px}
@media(max-width:640px){
  .hero{min-height:150px}
  .hero h1{font-size:27px}
  .merkbalk nav a{padding:6px 9px;font-size:12.5px}
  .blok{padding:12px 13px}
}
</style>
</head>
<body>

<div id="slot">
  <div class="doos">
    <div class="merk">Bed &amp; Wellness<small>Flevoland</small></div>
    <p class="spreuk">Ontspan. Geniet. Beleef.</p>
    <label for="lgMail">E-mailadres</label><input id="lgMail" type="email" inputmode="email">
    <label for="lgWw">Wachtwoord</label><input id="lgWw" type="password">
    <button type="button" id="lgKnop">Inloggen</button>
    <p style="margin:14px 0 0;font-size:13px"><a href="#" id="bwfVergeten">Wachtwoord vergeten?</a></p>
    <div class="fout" id="lgFout"></div>
  </div>
</div>

<div class="merkbalk">
  <div class="binnen">
    <div class="merk">Bed &amp; Wellness<small>Flevoland</small></div>
    <nav>
      <a class="hier" href="beschikbaarheid2.html">Beschikbaarheid</a>
      <a href="vandaag.html">Vandaag</a>
      <a href="reserveringen.html">Reserveringen</a>
      <a href="dagstart.html">Dagstart</a>
    </nav>
    <span class="wie" id="wieBen"></span>
  </div>
</div>

<div class="hero" id="hero">
  <div class="tekst">
    <h1>Beschikbaarheid</h1>
    <p>Bekijk de vrije tijdsblokken per suite en boek direct.</p>
  </div>
</div>

<div class="wrap">
  <div class="dagkaart">
    <div class="dagrij">
      <button class="rond" id="terug" aria-label="Vorige dag">&larr;</button>
      <div><h2 id="datumTitel">Vandaag</h2><span class="sub" id="datumSub"></span></div>
      <button class="rond" id="vooruit" aria-label="Volgende dag">&rarr;</button>
      <button class="nu" id="knopNu">Vandaag</button>
    </div>
    <div class="strook" id="strook"></div>
    <div class="filterrij">
      <button type="button" class="filt aan" data-filter="alles">Alles</button>
      <button type="button" class="filt" data-filter="vrij">Alleen vrij</button>
      <button type="button" class="filt" data-filter="bezet">Alleen geboekt</button>
    </div>
    <div class="legenda">
      <span><i style="background:var(--vrij)"></i> Vrij</span>
      <span><i style="background:var(--deels)"></i> Deels bezet</span>
      <span><i style="background:var(--bezet)"></i> Bezet</span>
    </div>
  </div>

  <div class="balk" id="balk" style="display:none"></div>
  <div id="lijst"></div>
</div>
<script src="bwf-agenda.js?v=1"></script>
<script>
/* =========================================================
   Beschikbaarheid per suite
   Vrije blokken komen uit bwf_tariefblokken, met de vaste lijst als
   terugval. Bezette tijden komen uit de agenda, uit reservations en
   uit res_koppeling — dezelfde bronnen als de rest van het dashboard.
   ========================================================= */
const CFG = {
  url:'https://iuyjvtlauktnjprbmbjj.supabase.co',
  key:'sb_publishable_SfQjQTwKa3BgCtjwE-8ljw_mTpqEY3U',
  ls :'sb-iuyjvtlauktnjprbmbjj-auth-token'
};

const SUITES = {
  angie  :{ naam:'Suite Angie · Almere',        kleur:'var(--loc-angie)',   zoek:'angie' },
  jacuzzi:{ naam:'Malina Jacuzzi · Lelystad',   kleur:'var(--loc-jacuzzi)', zoek:'jacuzzi' },
  deluxe :{ naam:'Malina Zwembad · Lelystad',   kleur:'var(--loc-deluxe)',  zoek:'deluxe' }
};

/* terugval als de tarieventabel niet geladen kan worden */
const VAST = {
  angie:{ dag:[['12:00','15:00',249],['12:30','15:30',249],['13:00','16:00',249],
               ['12:00','16:00',269],['12:30','16:30',269],['13:00','17:00',269],
               ['13:00','18:00',299]],
          nacht:[['13:00','11:00',449,'Relax & Stay'],['20:00','11:00',399,'Late check-in'],
                 ['13:00','11:00',449,'Wellness Experience']] },
  jacuzzi:{ dag:[['12:00','14:30',199],['14:30','17:00',199],['12:00','15:00',229],
                 ['14:00','17:00',229],['15:00','18:00',229],['12:00','16:00',259],
                 ['12:00','17:00',299]],
          nacht:[['14:00','10:00',399,'Relax & Stay'],['20:00','10:00',379,'Late check-in']] },
  deluxe:{ dag:[['12:30','15:30',299],['13:00','16:00',299],['12:30','16:30',349],
                ['13:00','17:00',349]],
          nacht:[['13:00','11:00',749,'Early check-in'],['19:00','11:00',479,'Relax & Stay']] }
};

let SESSIE=null, DATUM=vandaagISO(), BLOKKEN=null, BEZET=[], FOUT='', FILTER='alles';

/* ---------- hulpjes ---------- */
function vandaagISO(){ const d=new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function schuif(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10); }
function nlLang(iso){ return new Date(iso+'T12:00:00')
  .toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function eur(n){ return '\u20ac ' + (Math.round(n)||0); }
function min(t){ const m=String(t||'').match(/(\d{1,2}):(\d{2})/);
  return m ? +m[1]*60 + +m[2] : null; }
/* een blok dat over middernacht loopt telt door naar de volgende dag */
function eindMin(van,tot){ let a=min(van), b=min(tot); if(a==null||b==null) return null;
  return b <= a ? b + 1440 : b; }

function locId(v){ const t=String(v||'').toLowerCase(); if(!t) return '';
  if(/\bpsmd\b|\bpsd\b/.test(t)) return 'deluxe';
  if(/\bpsm\b/.test(t))          return 'jacuzzi';
  if(/\bpsa\b/.test(t))          return 'angie';
  if(t.includes('angie')||t.includes('almere')) return 'angie';
  if(t.includes('zwembad')||t.includes('deluxe')) return 'deluxe';
  if(t.includes('jacuzzi')||t.includes('malina')) return 'jacuzzi';
  return SUITES[t] ? t : ''; }

/* ---------- sessie ---------- */
function leesSessie(){
  try{ const v=JSON.parse(localStorage.getItem(CFG.ls)||'null');
    if(v&&v.access_token){
      const d=JSON.parse(atob(v.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if(!d.exp||d.exp*1000>Date.now()) return v;
    }}catch(e){}
  return null;
}
async function inloggen(){
  const f=document.getElementById('lgFout'), k=document.getElementById('lgKnop');
  f.textContent=''; k.disabled=true; k.textContent='Bezig…';
  try{
    const r=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',
      headers:{apikey:CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({email:document.getElementById('lgMail').value.trim().toLowerCase(),
        password:document.getElementById('lgWw').value})});
    const d=await r.json();
    if(!r.ok||!d.access_token) throw new Error(d.error_description||d.msg||'Inloggen lukte niet.');
    localStorage.setItem(CFG.ls,JSON.stringify(d)); location.reload();
  }catch(e){ f.textContent=e.message; }
  k.disabled=false; k.textContent='Inloggen';
}

/* ---------- database ---------- */
async function haal(pad,naam){
  try{
    const r=await fetch(CFG.url+'/rest/v1/'+pad,
      {headers:{apikey:CFG.key,Authorization:'Bearer '+SESSIE.access_token}});
    if(!r.ok) throw new Error(r.status+'');
    const t=await r.text(); return t?JSON.parse(t):[];
  }catch(e){ FOUT += (FOUT?' · ':'') + naam+' ('+e.message+')'; return []; }
}

/* ---------- de blokken van een suite op een dag ---------- */
async function laadBlokken(){
  if(BLOKKEN) return BLOKKEN;
  const rijen = await haal('bwf_tariefblokken?select=*&actief=eq.true&order=sortering.asc','tarieven');
  BLOKKEN = {};
  Object.keys(SUITES).forEach(k=>BLOKKEN[k]={dag:[],nacht:[]});
  rijen.forEach(x=>{
    const s = SUITES[x.suite] ? x.suite : locId(x.suite);
    if(!s || !BLOKKEN[s]) return;
    const rij=[String(x.starttijd).slice(0,5),String(x.eindtijd).slice(0,5),Number(x.prijs),x.naam];
    (x.verblijf==='dag' ? BLOKKEN[s].dag : BLOKKEN[s].nacht).push(rij);
  });
  /* niets gevonden? dan de vaste lijst gebruiken */
  Object.keys(SUITES).forEach(k=>{
    if(!BLOKKEN[k].dag.length && !BLOKKEN[k].nacht.length) BLOKKEN[k] = VAST[k];
  });
  return BLOKKEN;
}

/* ---------- wat is er bezet ---------- */
async function laadBezet(){
  FOUT='';
  const d=DATUM, vorige=schuif(d,-1);
  const [agenda,res,kop] = await Promise.all([
    (async()=>{ try{
        if(!window.BWFAgenda) throw new Error('agenda niet geladen');
        const j=await window.BWFAgenda.events();
        return (j.events||[]).filter(e=>e.soort==='reservering'||e.soort==='extern');
      }catch(e){ FOUT += (FOUT?' · ':'')+'agenda ('+e.message+')'; return []; } })(),
    haal('reservations?select=id,locatie,voornaam,achternaam,checkindatum,checkuitdatum,' +
      'checkintijd,checkuittijd&or=(checkindatum.eq.'+d+',checkindatum.eq.'+vorige+
      ',checkuitdatum.eq.'+d+')&limit=400','reserveringen'),
    haal('res_koppeling?select=res_sleutel,gast,locatie,aankomst,vertrek,tijd_in,tijd_uit,' +
      'geannuleerd&or=(aankomst.eq.'+d+',aankomst.eq.'+vorige+',vertrek.eq.'+d+')&limit=600','koppelingen')
  ]);

  const uit=[];
  agenda.forEach(e=>{
    const van=String(e.start||'').slice(0,10);
    if(van!==d && van!==vorige) return;
    uit.push({ suite:locId(e.suite||e.locatie), datum:van,
      van:(String(e.start||'').match(/(\d{2}:\d{2})/)||[])[1]||'00:00',
      tot:(String(e.eind||'').match(/(\d{2}:\d{2})/)||[])[1]||'23:59',
      wie:e.gast||e.naam||e.titel||'geboekt', bron:e.bron||'agenda' });
  });
  res.forEach(r=>{
    uit.push({ suite:locId(r.locatie), datum:String(r.checkindatum||'').slice(0,10),
      van:String(r.checkintijd||'00:00').slice(0,5), tot:String(r.checkuittijd||'23:59').slice(0,5),
      wie:((r.voornaam||'')+' '+(r.achternaam||'')).trim()||'geboekt', bron:'eigen' });
  });
  kop.forEach(k=>{
    if(k.geannuleerd) return;
    uit.push({ suite:locId(k.locatie||k.res_sleutel), datum:String(k.aankomst||'').slice(0,10),
      van:String(k.tijd_in||'00:00').slice(0,5), tot:String(k.tijd_uit||'23:59').slice(0,5),
      wie:k.gast||'geboekt', bron:'koppeling' });
  });
  BEZET = uit.filter(x=>x.suite);
}

/* overlapt het blok met iets dat al geboekt is */
function overlap(suite, van, tot){
  const a=min(van), b=eindMin(van,tot);
  if(a==null||b==null) return null;
  /* een blok dat vandaag begint, en boekingen van gisteren die doorlopen */
  const raak=[];
  BEZET.forEach(x=>{
    if(x.suite!==suite) return;
    let xa=min(x.van), xb=eindMin(x.van,x.tot);
    if(xa==null||xb==null) return;
    if(x.datum===schuif(DATUM,-1)){ xa-=1440; xb-=1440; }
    else if(x.datum!==DATUM) return;
    if(xa < b && xb > a) raak.push({ wie:x.wie, van:x.van, tot:x.tot, bron:x.bron,
      volledig: xa<=a && xb>=b });
  });
  return raak.length ? raak : null;
}

/* ---------- tekenen ---------- */
function tekenStrook(){
  const s=document.getElementById('strook');
  const dagen=[];
  for(let i=-2;i<=9;i++) dagen.push(schuif(vandaagISO(),i));
  s.innerHTML=dagen.map(d=>{
    const dt=new Date(d+'T12:00:00');
    return '<button class="dagje" data-dag="'+d+'"'+(d===DATUM?' data-nu="1"':'')+'>'+
      '<small>'+dt.toLocaleDateString('nl-NL',{weekday:'short'}).slice(0,2)+'</small>'+
      '<b>'+dt.getDate()+'</b><span class="stip"></span></button>';
  }).join('');
  const actief=s.querySelector('[data-nu="1"]');
  if(actief) actief.scrollIntoView({inline:'center',block:'nearest'});
}

async function teken(){
  const blokken=await laadBlokken();
  await laadBezet();

  const balk=document.getElementById('balk');
  if(FOUT){ balk.style.display='block';
    balk.textContent='Niet alles kon geladen worden: '+FOUT+'. De weergave kan onvolledig zijn.'; }
  else balk.style.display='none';

  document.getElementById('datumTitel').textContent =
    DATUM===vandaagISO() ? 'Vandaag' : nlLang(DATUM).replace(/^\w/,c=>c.toUpperCase());
  document.getElementById('datumSub').textContent = nlLang(DATUM);

  const doel=document.getElementById('lijst');
  doel.innerHTML = Object.keys(SUITES).map(function(sleutel){
    const S=SUITES[sleutel], B=blokken[sleutel]||{dag:[],nacht:[]};
    const alle=[].concat(
      (B.dag||[]).map(x=>({van:x[0],tot:x[1],prijs:x[2],naam:x[3]||'Dagverblijf',soort:'dag'})),
      (B.nacht||[]).map(x=>({van:x[0],tot:x[1],prijs:x[2],naam:x[3]||'Overnachting',soort:'nacht'}))
    ).sort((a,b)=>min(a.van)-min(b.van));

    let vrij=0, getoond=0;
    const rijen=alle.map(function(b){
      const raak=overlap(sleutel,b.van,b.tot);
      const status = !raak ? 'vrij' : (raak.some(r=>r.volledig) ? 'bezet' : 'deels');
      if(status==='vrij') vrij++;
      /* alleen tonen wat bij de gekozen weergave past */
      if(FILTER==='vrij'  && status!=='vrij') return '';
      if(FILTER==='bezet' && status==='vrij') return '';
      getoond++;
      const wie = raak ? raak.map(r=>r.wie).filter(Boolean).slice(0,2).join(', ') : '';
      const label = status==='vrij' ? 'Vrij' : status==='deels' ? 'Deels' : 'Bezet';
      return '<button class="blok" data-vrij="'+(status==='vrij'?1:status==='bezet'?0:'deels')+'"'+
        ' data-suite="'+sleutel+'" data-van="'+b.van+'" data-tot="'+b.tot+'"'+
        ' data-status="'+status+'" data-wie="'+esc(wie)+'">'+
        '<span class="tijd"><b>'+b.van+' \u2013 '+b.tot+'</b>'+
        '<span>'+esc(b.naam)+(b.prijs?' \u00b7 '+eur(b.prijs):'')+
        (wie ? '<br>'+esc(wie) : '')+'</span></span>'+
        '<span class="merk2">'+label+'</span>'+
        '<span class="chev">\u203a</span></button>';
    }).join('');

    const deel = String(S.naam).split(' \u00b7 ');
    return '<section class="suite"><div class="suitekop">'+
      '<span class="vlek"></span>'+
      '<h3>'+esc(deel[0])+'</h3>'+
      (deel[1] ? '<span class="plaats">'+esc(deel[1])+'</span>' : '')+
      '<em>'+vrij+' van '+alle.length+' vrij</em></div>'+
      (getoond ? rijen : '<div class="leeg">' +
        (FILTER==='vrij'  ? 'Alles is geboekt op deze dag.' :
         FILTER==='bezet' ? 'Nog geen boekingen op deze dag.' :
         'Geen tijdsblokken bekend voor deze suite.') + '</div>')+
      '</section>';
  }).join('');
}

/* ---------- klikken ---------- */
document.addEventListener('click', function(e){
  const d=e.target.closest('[data-dag]');
  if(d){ DATUM=d.getAttribute('data-dag'); tekenStrook(); teken(); return; }

  const b=e.target.closest('.blok');
  if(b){
    const status=b.getAttribute('data-status');
    if(status==='bezet'){
      alert('Dit blok is bezet: ' + (b.getAttribute('data-wie')||'geboekt') +
        '.\nOpen Reserveringen voor de gegevens van deze boeking.');
      return;
    }
    const p=new URLSearchParams();
    p.set('suite', b.getAttribute('data-suite'));
    p.set('datum', DATUM);
    p.set('tijdin', b.getAttribute('data-van'));
    p.set('tijduit', b.getAttribute('data-tot'));
    if(status==='deels' && !confirm('Dit blok overlapt met een bestaande boeking. Toch doorgaan?')) return;
    location.href='reservering-aanmaken.html?'+p.toString();
  }
});
document.addEventListener('click', function(e){
  const f=e.target.closest('[data-filter]');
  if(!f) return;
  FILTER=f.getAttribute('data-filter');
  document.querySelectorAll('.filt').forEach(x=>x.classList.toggle('aan',x===f));
  teken();
});
document.getElementById('terug').onclick   = ()=>{ DATUM=schuif(DATUM,-1); tekenStrook(); teken(); };
document.getElementById('vooruit').onclick = ()=>{ DATUM=schuif(DATUM, 1); tekenStrook(); teken(); };
document.getElementById('knopNu').onclick  = ()=>{ DATUM=vandaagISO(); tekenStrook(); teken(); };
document.getElementById('lgKnop').onclick  = inloggen;
document.getElementById('lgWw').addEventListener('keydown',e=>{ if(e.key==='Enter') inloggen(); });
