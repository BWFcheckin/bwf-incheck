<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wachtwoord instellen — Bed &amp; Wellness Flevoland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bwf-stijl.css">
<style>
body{margin:0;display:grid;place-items:center;min-height:100vh;padding:20px}
.doos{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  padding:30px;max-width:420px;width:100%;box-shadow:var(--shadow)}
h1{font-family:var(--f-display);font-size:22px;margin:0 0 4px}
p.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
label{display:block;font-size:12.5px;color:var(--ink-2);margin:12px 0 4px}
input{width:100%}
button{width:100%;margin-top:18px;background:var(--accent);color:#fff;border:0;
  border-radius:var(--r-s);padding:12px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.melding{margin-top:14px;font-size:13.5px;padding:10px 12px;border-radius:var(--r-s);display:none}
.melding.open{display:block}
.melding.ok{background:var(--ok-soft);color:var(--ok)}
.melding.err{background:var(--crit-soft);color:var(--crit)}
.eisen{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}
a{color:var(--brass)}
</style>
</head>
<body>

<div class="doos">
  <h1>Nieuw wachtwoord</h1>
  <p class="sub" id="voorWie">Bed &amp; Wellness Flevoland</p>

  <div id="vragen">
    <label for="ww1">Nieuw wachtwoord</label>
    <input id="ww1" type="password" autocomplete="new-password">
    <label for="ww2">Nog een keer ter controle</label>
    <input id="ww2" type="password" autocomplete="new-password">
    <button type="button" id="bewaar">Wachtwoord instellen</button>
    <p class="eisen">Minimaal acht tekens. Kies iets dat je nergens anders gebruikt —
      dit geeft toegang tot gegevens van gasten.</p>
  </div>

  <div class="melding" id="melding"></div>
</div>

<script>
const PROJECT = 'iuyjvtlauktnjprbmbjj';
const BASIS = 'https://' + PROJECT + '.supabase.co';
const ANON  = 'sb_publishable_SfQjQTwKa3BgCtjwE-8ljw_mTpqEY3U';
const OPSLAG = 'sb-' + PROJECT + '-auth-token';

function meld(tekst, soort){
  const el = document.getElementById('melding');
  el.textContent = tekst;
  el.className = 'melding open ' + (soort || '');
}

/* Supabase zet het herstelbewijs achter een hekje in het adres. */
function uitHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  return { token: h.get('access_token'), soort: h.get('type'), fout: h.get('error_description') };
}

const uit = uitHash();
let TOKEN = uit.token;

/* al ingelogd? dan kun je hier ook gewoon je wachtwoord wijzigen */
if(!TOKEN){
  try{
    const s = JSON.parse(localStorage.getItem(OPSLAG) || 'null');
    if(s && s.access_token) TOKEN = s.access_token;
  }catch(e){}
}

if(uit.fout){
  document.getElementById('vragen').style.display = 'none';
  meld('Deze link werkt niet meer: ' + uit.fout + '. Vraag een nieuwe herstelmail aan op de inlogpagina.', 'err');
}else if(!TOKEN){
  document.getElementById('vragen').style.display = 'none';
  meld('Open deze pagina via de link uit je herstelmail, of log eerst in om je wachtwoord te wijzigen.', 'err');
}else{
  try{
    const deel = JSON.parse(atob(TOKEN.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(deel.email) document.getElementById('voorWie').textContent = 'Voor ' + deel.email;
  }catch(e){}
}

document.getElementById('bewaar').addEventListener('click', async function(){
  const a = document.getElementById('ww1').value;
  const b = document.getElementById('ww2').value;
  if(a.length < 8){ meld('Kies een wachtwoord van minstens acht tekens.', 'err'); return; }
  if(a !== b){ meld('De twee wachtwoorden zijn niet gelijk.', 'err'); return; }

  const knop = this;
  knop.disabled = true; knop.textContent = 'Bezig…';
  try{
    const r = await fetch(BASIS + '/auth/v1/user', {
      method:'PUT',
      headers:{ apikey:ANON, Authorization:'Bearer ' + TOKEN, 'Content-Type':'application/json' },
      body: JSON.stringify({ password: a })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.msg || d.error_description || d.message || 'Instellen lukte niet.');
    document.getElementById('vragen').style.display = 'none';
    meld('Je wachtwoord is ingesteld. Je kunt nu inloggen.', 'ok');
    setTimeout(function(){ location.href = 'index.html'; }, 2200);
  }catch(e){
    meld(e.message, 'err');
    knop.disabled = false; knop.textContent = 'Wachtwoord instellen';
  }
});
document.getElementById('ww2').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('bewaar').click();
});
</script>
</body>
</html>
