<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C5F62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Administratie">
<meta name="robots" content="noindex, nofollow">
<title>Administratie — Bed &amp; Wellness Flevoland</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F3F6F4;
    --surface: #FFFFFF;
    --surface-2: #EAEFEC;
    --ink: #17211E;
    --ink-2: #4C5A56;
    --ink-3: #7C8A85;
    --line: #DCE3DF;
    --line-strong: #C3CEC9;
    --accent: #1C5F62;
    --accent-ink: #103F42;
    --accent-soft: #DFEDEB;
    --ochre: #8A6321;
    --ochre-soft: #F3E9D8;
    --good: #3E7A52;
    --danger: #9B3B33;
    --shadow: 0 1px 2px rgba(23,33,30,.05), 0 10px 28px -18px rgba(23,33,30,.35);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111614;
      --surface: #191F1D;
      --surface-2: #212826;
      --ink: #E7EDE9;
      --ink-2: #A7B4AF;
      --ink-3: #7E8C87;
      --line: #2A322F;
      --line-strong: #3B4540;
      --accent: #6CBEBD;
      --accent-ink: #A9DBD9;
      --accent-soft: #15302F;
      --ochre: #D6AC6B;
      --ochre-soft: #2C2417;
      --good: #75B48A;
      --danger: #D98077;
      --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --ground: #111614;
    --surface: #191F1D;
    --surface-2: #212826;
    --ink: #E7EDE9;
    --ink-2: #A7B4AF;
    --ink-3: #7E8C87;
    --line: #2A322F;
    --line-strong: #3B4540;
    --accent: #6CBEBD;
    --accent-ink: #A9DBD9;
    --accent-soft: #15302F;
    --ochre: #D6AC6B;
    --ochre-soft: #2C2417;
    --good: #75B48A;
    --danger: #D98077;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 28px 20px 80px; }

  h1, h2, h3 { font-family: "Fraunces", ui-serif, Georgia, serif; font-weight: 600; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(1.7rem, 1.2rem + 1.8vw, 2.3rem); letter-spacing: -.01em; line-height: 1.15; }
  h2 { font-size: 1.05rem; letter-spacing: .002em; }
  .eyebrow {
    font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 8px;
  }
  .lede { color: var(--ink-2); margin: 10px 0 0; max-width: 60ch; }
  .num { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  header.page { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; }
  header.page > div:first-child { flex: 1 1 380px; }

  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: .78rem; font-weight: 500; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; white-space: nowrap;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .status[data-s="saved"] .dot { background: var(--good); }
  .status[data-s="saving"] .dot { background: var(--ochre); animation: pulse 1s ease-in-out infinite; }
  .status[data-s="error"] .dot, .status[data-s="readonly"] .dot { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }

  .headtools { display: flex; align-items: center; gap: 10px; }

  .wrap.login { max-width: 460px; padding-top: 12vh; }
  .loginbox { padding: 32px 30px; display: grid; gap: 18px; }
  .loginbox h1 { font-size: 1.7rem; }
  .loginbox .lede { margin: 0; }
  .loginbox .eyebrow { margin: 0; }
  .loginbox form { display: grid; gap: 14px; }
  .loginbox input[type="password"] {
    font: inherit; letter-spacing: .18em; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 11px 13px; width: 100%;
  }
  .loginbox .btn { justify-self: start; }
  .loginbox .notice { margin: 0; }

  .monthbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 30px 0 16px;
  }
  .monthbar h2 { font-size: 1.35rem; min-width: 8.5ch; }
  .iconbtn {
    width: 34px; height: 34px; display: grid; place-items: center;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
    border-radius: 8px; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0;
  }
  .iconbtn:hover { border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .stat { padding: 16px 18px; }
  .stat .label { font-size: .73rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .stat .value { font-size: 1.75rem; font-weight: 500; margin-top: 6px; letter-spacing: -.01em; }
  .stat.accent .value { color: var(--accent); }
  .stat.money .value { color: var(--ochre); }
  .stat .sub { font-size: .8rem; color: var(--ink-3); margin-top: 3px; }

  .reserve {
    margin-top: 12px; padding: 16px 18px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px 40px;
  }
  .reserve .who { flex: 1 1 260px; }
  .reserve .label { font-size: .73rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .reserve .sub { font-size: .84rem; color: var(--ink-3); margin-top: 3px; }
  .reserve .figs { display: flex; gap: 36px; flex-wrap: wrap; }
  .reserve .v { font-size: 1.35rem; font-weight: 500; margin-top: 4px; }
  .reserve .v.hi { color: var(--accent); }

  .section-title { margin: 30px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .section-title .hint { font-size: .82rem; color: var(--ink-3); }

  form.entry { padding: 18px; display: grid; gap: 16px; }
  .field { display: grid; gap: 7px; }
  .field > label, .grouplabel {
    font-size: .73rem; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; color: var(--ink-3);
  }
  .row2 { display: grid; grid-template-columns: minmax(160px, 220px) 1fr; gap: 16px; }
  @media (max-width: 620px) { .row2 { grid-template-columns: 1fr; } }

  input[type="date"], input[type="text"], select {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; width: 100%;
  }
  input[type="date"] { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  select { cursor: pointer; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
  select.invalid { border-color: var(--danger); }
  input:focus-visible, select:focus-visible, button:focus-visible, .seg button:focus-visible, .chk:focus-within {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .opt { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); opacity: .8; }

  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button {
    font: inherit; font-weight: 500; cursor: pointer;
    background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 13px;
    display: flex; align-items: baseline; gap: 7px;
  }
  .seg button .h { font-size: .8rem; color: var(--ink-3); font-family: "IBM Plex Mono", monospace; }
  .seg button[aria-pressed="true"] {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  .seg button[aria-pressed="true"] .h { color: var(--accent); }

  .chk {
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 9px 13px; font-weight: 500; color: var(--ink-2);
  }
  .chk input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .chk .h { font-size: .8rem; color: var(--ink-3); font-family: "IBM Plex Mono", monospace; }
  .chk:has(input:checked), .chk.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .chk:has(input:checked) .h, .chk.on .h { color: var(--accent); }

  .formfoot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
  .preview { font-size: 1.05rem; font-weight: 500; }
  .preview .u { color: var(--accent); }
  .preview .sep { color: var(--ink-3); margin: 0 8px; }
  .preview .e { color: var(--ochre); }
  .preview .fee { color: var(--ink-3); font-size: .85rem; margin-left: 12px; }
  .chk.fee:has(input:checked), .chk.fee.on { background: var(--ochre-soft); border-color: var(--ochre); color: var(--ochre); }
  .chk.fee:has(input:checked) .h, .chk.fee.on .h { color: var(--ochre); }
  .chk.fee input { accent-color: var(--ochre); }

  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--surface);
    border: 1px solid var(--accent); border-radius: 8px; padding: 10px 18px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-strong); }
  .btn.ghost:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  .btn.small { padding: 7px 13px; font-size: .85rem; font-weight: 500; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .93rem; }
  th {
    text-align: left; font-size: .71rem; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  .ta-r { text-align: right; }
  .date { white-space: nowrap; }
  .date .dow { color: var(--ink-3); font-size: .8rem; margin-right: 6px; text-transform: capitalize; }
  .note { color: var(--ink-3); font-size: .84rem; display: block; margin-top: 2px; }
  .suite { white-space: nowrap; }

  .pill {
    display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .02em;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent-ink); border: 1px solid transparent;
  }
  .pill.add { background: var(--ochre-soft); color: var(--ochre); margin-left: 6px; }
  .pill.fee { background: transparent; color: var(--ochre); border-color: var(--ochre); margin-left: 6px; }
  .pill.soft { background: var(--surface-2); color: var(--ink-2); margin-left: 6px; font-weight: 500; }
  .acts { display: flex; gap: 6px; justify-content: flex-end; }
  .linkbtn {
    font: inherit; font-size: .84rem; background: none; border: none; cursor: pointer;
    color: var(--ink-3); padding: 4px 6px; border-radius: 6px;
  }
  .linkbtn:hover { color: var(--accent); background: var(--accent-soft); }
  .linkbtn.del:hover { color: var(--danger); background: transparent; text-decoration: underline; }

  tfoot td { border-top: 2px solid var(--line-strong); border-bottom: none; font-weight: 600; padding-top: 14px; }

  .empty { padding: 38px 20px; text-align: center; color: var(--ink-3); }
  .empty strong { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }

  details.rules { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 16px; }
  details.rules summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
  details.rules summary::marker { color: var(--accent); }
  details.rules ul { color: var(--ink-2); padding-left: 20px; line-height: 1.7; }
  details.rules code { font-family: "IBM Plex Mono", monospace; font-size: .88em; color: var(--accent); }

  .notice {
    margin-top: 18px; padding: 12px 15px; border-radius: 8px; font-size: .88rem;
    background: var(--ochre-soft); color: var(--ochre); border: 1px solid transparent;
  }
  .notice.hidden { display: none; }

  .yearly { margin-top: 34px; }
  .yearly td, .yearly th { padding: 10px 14px; }
  .yearly .cur td { background: var(--accent-soft); }
  .monthlink { background: none; border: none; font: inherit; color: var(--ink); cursor: pointer; padding: 0; text-align: left; }
  .monthlink:hover { color: var(--accent); text-decoration: underline; }
</style>
<style>
  input[type="number"], input[type="time"] {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; width: 100%;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 22px; }
  .tabs button {
    font: inherit; font-weight: 600; cursor: pointer; color: var(--ink-3);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 16px;
  }
  .tabs button[aria-pressed="true"] {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink);
  }
  .maandchk { padding: 7px 12px; font-size: .9rem; }
  .tegels { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 0 0 4px; }
  .tegel {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px;
  }
  .tegel:hover { border-color: var(--accent); }
  .tegel .naam { font-weight: 600; color: var(--accent); display: flex; align-items: baseline; gap: 6px; }
  .tegel .naam .pijl { font-size: .85rem; color: var(--ink-3); }
  .tegel:hover .naam .pijl { color: var(--accent); }
  .tegel .uitleg { font-size: .82rem; color: var(--ink-3); margin-top: 3px; }
  .row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  @media (max-width: 900px) { .row5 { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 620px) { .row5 { grid-template-columns: 1fr 1fr; } }
  .drop {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border: 1px dashed var(--line-strong); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 12px; background: var(--surface-2);
  }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop .mini { margin: 0; }
  textarea {
    font: inherit; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .86rem;
    color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 11px 13px; width: 100%; resize: vertical;
  }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 720px) { .row3, .row4 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 460px) { .row3, .row4 { grid-template-columns: 1fr; } }
  .loc { font-weight: 600; }
  .loc .sub { display: block; font-weight: 400; font-size: .78rem; color: var(--ink-3); }
  details.block { margin-top: 22px; }
  details.block > summary {
    cursor: pointer; font-weight: 600; color: var(--ink-2);
    padding: 12px 15px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); list-style-position: inside;
  }
  details.block > summary::marker { color: var(--accent); }
  details.block[open] > summary { border-radius: var(--radius) var(--radius) 0 0; border-bottom: none; }
  details.block .inner {
    background: var(--surface); border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 var(--radius) var(--radius); padding: 18px;
  }
  .imp { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .imp .done { font-size: .86rem; color: var(--good); font-weight: 600; }
  .mini { font-size: .84rem; color: var(--ink-3); margin: 0; }
  .saldo .v.open { color: var(--danger); }
  .linkline { margin-top: 10px; }
  .linkline button { font: inherit; font-size: .88rem; background: none; border: none; color: var(--ink-3); cursor: pointer; text-decoration: underline; padding: 0; }
  .linkline button:hover { color: var(--accent); }
  code.sql { display: block; white-space: pre; overflow-x: auto; font-family: "IBM Plex Mono", monospace; font-size: .78rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; color: var(--ink-2); margin-top: 10px; }
</style>
</head>

<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ===================================================================
     INSTELLINGEN

     1) NAAM  — vul hier de naam in van de persoon van wie dit de
        administratie is. Die naam staat boven de pagina en wordt in de
        database gebruikt om de regels van deze persoon te herkennen.

     4) STANDAARD_EMAIL is alleen het e-mailadres dat op het inlogscherm
        wordt voorgevuld. Inloggen gaat met de accounts die je in
        Supabase > Authentication aanmaakt.
     =================================================================== */

  var ROL  = "Bed & Wellness Flevoland \u00b7 Suite Angie & Malina";

  var SUPABASE_URL = "https://iuyjvtlauktnjprbmbjj.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_SfQjQTwKa3BgCtjwE-8ljw_mTpqEY3U";
  var TABEL = "psm_administratie";
  var STANDAARD_EMAIL = "michelretz@hotmail.com";

  /* Tegels naar je andere pagina's. Zelf een tegel toevoegen? Zet er een
     regel bij met naam, uitleg en link. Ze openen in een nieuw tabblad. */
  var TEGELS = [
    { naam: "Dashboard BWF", uitleg: "Reserveringen, personeel en handboek",
      url: "https://bwfcheckin.github.io/bwf-incheck/dashboard.html" }
  ];
  /* =================================================================== */

  var LS_KEY = "psm-admin-v1";
  var SESSION_KEY = "psm-admin-sessie";
  var LOCAL_FLAG = "psm-admin-lokaal";
  var EMAIL_KEY = "psm-admin-email";
  var POLL_MS = 20000;

  var LOCATIES = [
    { id: "PSA",  label: "PSA",  sub: "Suite Angie \u00b7 Almere" },
    { id: "PSM",  label: "PSM",  sub: "Malina Jacuzzi" },
    { id: "PSMD", label: "PSMD", sub: "Malina Deluxe" }
  ];
  var LOC_BY_ID = {};
  LOCATIES.forEach(function (l) { LOC_BY_ID[l.id] = l; });

  var VERG_PRESETS = [50, 60, 100, 130, 150];

    { id: "onbekend", label: "Onbekend" }
  ];

  var eur = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
  var MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

  /* ---------- hulpjes ---------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();

    return { verg: r2(v), betaald: r2(b), open: r2(v - b) };
  }
  function alleMaanden() {
    var keys = {};
    state.entries.forEach(function (e) { if (e.date) keys[monthKey(e.date)] = true; });
    keys[view.month] = true;
    return Object.keys(keys).sort();
  }

  /* ---------- opslag ---------- */

  function setSave(s) {
    view.saveState = s;
    var el = document.getElementById("savechip");
    if (!el) return;
    var text = {
      idle: "Verbinden\u2026", saving: "Opslaan\u2026", saved: "Opgeslagen", synced: "Bijgewerkt",
      local: "Alleen op dit apparaat", setup: "Nog niet ingesteld",
      error: "Geen verbinding \u2014 niet opgeslagen"
    }[s] || "";
    el.setAttribute("data-s", s === "synced" ? "saved" : (s === "local" ? "readonly" : s));
    el.querySelector(".txt").textContent = text;
  }
  function cacheLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (err) { /* geen opslag */ }
  }

  /* ---------- toegang ---------- */

  var session = null;
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (err) { session = null; }

  function storeSession(s) {
    session = s ? {
      access_token: s.access_token, refresh_token: s.refresh_token,
      expires_at: Date.now() + ((s.expires_in || 3600) - 60) * 1000
    } : null;
    try {
      if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      else localStorage.removeItem(SESSION_KEY);
    } catch (err) { /* geen opslag */ }
  }
  function authCall(grant, body) {
    return fetch(SUPABASE_URL + "/auth/v1/token?grant_type=" + grant, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) {
          var err = new Error(data.error_description || data.msg || data.message || "Inloggen mislukt");
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }
  function login(email, wachtwoord) {
    return authCall("password", { email: String(email).trim().toLowerCase(), password: wachtwoord })
      .then(function (data) {
        try { localStorage.setItem(EMAIL_KEY, String(email).trim().toLowerCase()); } catch (err) { /* geen opslag */ }
        storeSession(data);
        return data;
      });
  }
  function logout() {
    storeSession(null);
    state.entries = [];
    localMode = false;
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LOCAL_FLAG); } catch (err) { /* geen opslag */ }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    renderLogin();
  }
  function freshToken() {
    if (!session) return Promise.reject(new Error("niet ingelogd"));
    if (Date.now() < session.expires_at) return Promise.resolve(session.access_token);
    return authCall("refresh_token", { refresh_token: session.refresh_token })
      .then(function (data) { storeSession(data); return session.access_token; });
  }

  /* ---------- Supabase ---------- */

  function api(path, opts) {
    opts = opts || {};
    return freshToken().then(function (token) {
      var headers = {
        apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + token, "Content-Type": "application/json"
      };
      if (opts.prefer) headers.Prefer = opts.prefer;
      return fetch(SUPABASE_URL + "/rest/v1/" + path, {
        method: opts.method || "GET", headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
    }).then(function (res) {
      if (res.status === 401 || res.status === 403) {
        storeSession(null);
        renderLogin("Je sessie is verlopen. Log opnieuw in.");
        throw new Error("sessie verlopen");
      }
      if (res.status === 404) {
        var e404 = new Error("tabel ontbreekt");
        e404.missingTable = true;
        throw e404;
      }
      if (!res.ok) {
        return res.text().then(function (t) {
          var err = new Error(res.status + " " + t);
          if (/relation .* does not exist|PGRST205|42P01/.test(t)) err.missingTable = true;
          throw err;
        });
      }
      return res.status === 204 ? null : res.json();
    });
  }

  var DIENST_VELDEN = ["dienstnr", "chauffeur", "kenteken", "tijd", "eindDate", "eindTijd",
    "ritten", "bedrag", "contant", "rekening", "pin", "minuten", "startKm", "eindKm",
    "dashStart", "dashEind", "totaalKm", "beladen", "onbeladen"];

  function toRow(e) {
    if (e.soort === "dienst") {
      var extra = {};
      DIENST_VELDEN.forEach(function (k) { if (e[k] !== "" && e[k] !== null && e[k] !== undefined) extra[k] = e[k]; });
      return {
        medewerker: NAAM, soort: "dienst", datum: e.date, boeking_nr: e.dienstnr || null,
        bedrag: numOrNull(e.bedrag), km: numOrNull(e.totaalKm),
        opmerking: e.note || null, data: extra
      };
    }
    if (e.soort === "maand") {
      return { medewerker: NAAM, soort: "maand", datum: e.date, voldaan: !!e.voldaan, opmerking: e.note || null };
    }
    if (e.soort === "betaling") {
      return {
        medewerker: NAAM, soort: "betaling", datum: e.date, factuur_nr: e.ref || null,
        bedrag: numOrNull(e.bedrag), btw: numOrNull(e.btw), wijze: e.wijze || null,
        voldaan: !!e.voldaan, opmerking: e.note || null
      };
    }
    return {
      medewerker: NAAM, soort: "boeking", datum: e.date, locatie: e.loc || null,
      boeking_nr: e.ref || null, tijd_van: e.van || null, tijd_tot: e.tot || null,
      arrangement: e.arr || null, bedrag: numOrNull(e.bedrag),
      bank_op_locatie: numOrNull(e.bank), cash_op_locatie: numOrNull(e.cash),
      vergoeding: numOrNull(e.verg), opmerking: e.note || null
    };
  }
  function fromRow(r) {
    if (r.soort === "dienst") {
      var e = { id: r.id, soort: "dienst", date: r.datum, dienstnr: r.boeking_nr || "", note: r.opmerking || "" };
      var extra = r.data || {};
      DIENST_VELDEN.forEach(function (k) { e[k] = extra[k] === undefined ? null : extra[k]; });
      ["dienstnr", "chauffeur", "kenteken", "tijd", "eindDate", "eindTijd"].forEach(function (k) {
        if (e[k] === null) e[k] = "";
      });
      if (!e.dienstnr) e.dienstnr = r.boeking_nr || "";
      if (e.bedrag === null) e.bedrag = r.bedrag;
      if (e.totaalKm === null) e.totaalKm = r.km;
      return e;
    }
    if (r.soort === "maand") {
      return { id: r.id, soort: "maand", date: r.datum, voldaan: !!r.voldaan, note: r.opmerking || "" };
    }
    if (r.soort === "betaling") {
      return {
        id: r.id, soort: "betaling", date: r.datum, ref: r.factuur_nr || "",
        bedrag: r.bedrag, btw: r.btw, wijze: r.wijze || "", voldaan: !!r.voldaan, note: r.opmerking || ""
      };
    }
    return {
      id: r.id, soort: "boeking", date: r.datum, loc: r.locatie || "", ref: r.boeking_nr || "",
      van: r.tijd_van || "", tot: r.tijd_tot || "", arr: r.arrangement || "",
      bedrag: r.bedrag, bank: r.bank_op_locatie, cash: r.cash_op_locatie,
      verg: r.vergoeding, note: r.opmerking || ""
    };
  }

  function gaLokaal(msg) {
    localMode = true;
    try { localStorage.setItem(LOCAL_FLAG, "1"); } catch (err) { /* geen opslag */ }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    render();
    setSave("local");
    if (msg) flashNotice(msg);
  }

  function pull(silent) {
    if (localMode || !configured) { setSave("local"); return Promise.resolve(); }
    return api(TABEL + "?select=*&medewerker=eq." + encodeURIComponent(NAAM) + "&order=datum.asc")
      .then(function (rows) {
        var fresh = (rows || []).map(fromRow);
        var changed = JSON.stringify(fresh) !== JSON.stringify(state.entries);
        state.entries = fresh;
        cacheLocal();
        if (changed || !silent) render();
        setSave("synced");
      })
      .catch(function (err) {
        if (err && err.missingTable) {
          gaLokaal("De tabel " + TABEL + " bestaat nog niet in Supabase. De pagina werkt nu alleen op dit apparaat. Onderaan bij \u201cInstellen\u201d staat de SQL om de tabel aan te maken.");
        } else if (err && err.message !== "sessie verlopen") {
          setSave("error");
        }
      });
  }
  function pushNew(entry) {
    if (localMode || !configured) { cacheLocal(); setSave("local"); return; }
    setSave("saving");
    api(TABEL, { method: "POST", body: toRow(entry), prefer: "return=representation" })
      .then(function (rows) {
        if (rows && rows[0]) {
          state.entries = state.entries.map(function (e) { return e.id === entry.id ? fromRow(rows[0]) : e; });
          cacheLocal();
          render();
        }
        setSave("saved");
      })
      .catch(function (err) { if (err && err.missingTable) gaLokaal(); else setSave("error"); });
  }
  function pushMany(list) {
    if (localMode || !configured) { cacheLocal(); setSave("local"); return Promise.resolve(); }
    setSave("saving");
    var chunks = [];
    for (var i = 0; i < list.length; i += 100) chunks.push(list.slice(i, i + 100));
    return chunks.reduce(function (p, chunk) {
      return p.then(function () {
        return api(TABEL, { method: "POST", body: chunk.map(toRow), prefer: "return=minimal" });
      });
    }, Promise.resolve())
      .then(function () { return pull(false); })
      .catch(function (err) { if (err && err.missingTable) gaLokaal(); else setSave("error"); });
  }
  function pushUpdate(entry) {
    if (localMode || !configured) { cacheLocal(); setSave("local"); return; }
    setSave("saving");
    api(TABEL + "?id=eq." + encodeURIComponent(entry.id), { method: "PATCH", body: toRow(entry), prefer: "return=minimal" })
      .then(function () { setSave("saved"); })
      .catch(function (err) { if (err && err.missingTable) gaLokaal(); else setSave("error"); });
  }
  function pushDelete(id) {
    if (localMode || !configured) { cacheLocal(); setSave("local"); return; }
    setSave("saving");
    api(TABEL + "?id=eq." + encodeURIComponent(id), { method: "DELETE", prefer: "return=minimal" })
      .then(function () { setSave("saved"); })
      .catch(function (err) { if (err && err.missingTable) gaLokaal(); else setSave("error"); });
  }

  /* ---------- inlogscherm ---------- */

            ? "Dit account is nog niet bevestigd. Zet in Supabase bij de gebruiker Auto Confirm User aan."
            : err.message);
      renderLogin(m);
    });
  });


  /* ---------- incheckformulier inlezen ---------- */

  function veld(txt, label) {
    var re = new RegExp(label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ":\\s*([^\\n\\r]*)");
    var m = txt.match(re);
    if (!m) return "";
    var v = m[1];
    var knip = v.match(/^(.*?)\s+[A-Za-z][A-Za-z .-]{2,24}:\s/);
    if (knip) v = knip[1];
    return v.trim();
  }
  function bedragUit(s) {
    if (!s) return null;
    var m = String(s).replace(/\u20ac/g, "").trim().match(/-?[\d.,]+/);
    if (!m) return null;
    var t = m[0];
    if (t.indexOf(",") > -1) t = t.replace(/\./g, "").replace(",", ".");
    var n = parseFloat(t);
    return isNaN(n) ? null : Math.round(n * 100) / 100;
  }
  function tijdUit(s) {
    var m = String(s || "").match(/(\d{1,2})[:.](\d{2})/);
    return m ? String(Number(m[1])).padStart(2, "0") + ":" + m[2] : "";
  }
  function locatieUit(txt) {
    if (/deluxe|zwembad/i.test(txt)) return "PSMD";
    if (/jacuzzi/i.test(txt)) return "PSM";
    if (/angie|almere/i.test(txt)) return "PSA";
    return "";
  }

  function leesIncheck(tekst) {
    var delen = String(tekst).split(/(?=Incheckformulier\s*[\u2014\u2013-])/)
      .filter(function (d) { return /Datum:\s*\d{4}-\d{2}-\d{2}/.test(d); });
    if (!delen.length) delen = /Datum:\s*\d{4}-\d{2}-\d{2}/.test(tekst) ? [String(tekst)] : [];

    return delen.map(function (blok) {
      var datum = (blok.match(/Datum:\s*(\d{4}-\d{2}-\d{2})/) || [])[1] || "";
      var van = tijdUit(veld(blok, "In-check"));
      var tot = tijdUit(veld(blok, "Uit-check"));
      var totaal = bedragUit(veld(blok, "Totaalbedrag"));
      var open = bedragUit(veld(blok, "Nog te betalen"));
      var wijze = veld(blok, "Betaalwijze");
      var gast = veld(blok, "Gast");
      var pax = veld(blok, "Aantal personen");
      var arr = veld(blok, "Arrangementen");
      if (/^geen$/i.test(arr) || arr === "-") arr = "";
      var ref = veld(blok, "Reserveringsnr.") || veld(blok, "Reserveringsnr") || veld(blok, "Boekingsnr.") || veld(blok, "Boekingsnummer");
      var nacht = van && tot ? tot <= van : false;

      var notitie = [];
      if (gast) notitie.push(gast);
      if (pax) notitie.push(pax + " pers.");
      if (wijze) notitie.push(wijze);
      if (open) notitie.push("nog te betalen op locatie " + money(open));

      return {
        date: datum,
        loc: locatieUit(blok) || locatieUit(tekst) || draft.loc,
        ref: ref,
        van: van,
        tot: tot,
        arr: arr,
        bedrag: totaal === null ? "" : totaal,
        bank: open ? "" : 0,
        cash: open ? "" : 0,
        verg: nacht ? 130 : 60,
        note: notitie.join(" \u00b7 ")
      };
    }).filter(function (b) { return b.date; });
  }

  function bestaatAl(b) {
    return state.entries.some(function (e) {
      return isBoeking(e) && e.date === b.date && (e.ref || "") === (b.ref || "") && (b.ref || "") !== "";
    });
  }

  function verwerkPlak() {
    var el = document.getElementById("f-paste");
    var tekst = el ? el.value : view.paste;
    view.paste = tekst || "";
    var gevonden = leesIncheck(view.paste);
    if (!gevonden.length) {
      flashNotice("Ik kon er geen incheckformulier in herkennen. Plak de hele tekst van de mail, inclusief de regel met Datum en Reserveringsnr.");
      return;
    }
    view.pasteOpen = true;
    if (gevonden.length === 1) {
      draft = gevonden[0];
      view.editing = null;
      view.month = monthKey(draft.date);
      var dubbel = bestaatAl(draft);
      render();
      flashNotice(dubbel
        ? "Let op: er staat al een boeking van " + draft.date + " met nummer " + draft.ref + ". Formulier is wel ingelezen."
        : "Formulier ingelezen. Controleer vooral de vergoeding en klik daarna op Boeking toevoegen.");
      var f = document.getElementById("entryform");
      if (f && f.scrollIntoView) f.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    var overgeslagen = gevonden.filter(bestaatAl).length;
    gevonden = gevonden.filter(function (b) { return !bestaatAl(b); });
    if (!gevonden.length) { flashNotice("Deze boekingen staan er al in."); return; }
    if (!confirm(gevonden.length + " incheckformulieren gevonden" + (overgeslagen ? " (" + overgeslagen + " stond er al in)" : "") + ". Allemaal als boeking toevoegen? De vergoeding wordt geschat op " + money(60) + " bij een dagverblijf en " + money(130) + " bij een overnachting.")) return;
    var nieuw = gevonden.map(function (b) {
      var e = { id: uid(), soort: "boeking" };
      Object.keys(b).forEach(function (k) { e[k] = b[k]; });
      e.bedrag = numOrNull(e.bedrag); e.bank = numOrNull(e.bank);
      e.cash = numOrNull(e.cash); e.verg = numOrNull(e.verg);
      return e;
    });
    state.entries = state.entries.concat(nieuw);
    view.paste = "";
    view.month = monthKey(nieuw[nieuw.length - 1].date);
    cacheLocal();
    render();
    pushMany(nieuw);
    flashNotice(nieuw.length + " boekingen toegevoegd. Loop de vergoedingen even na.");
  }


  /* ---------- pdf en bestanden inlezen ---------- */

  var PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  var PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  function laadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (laadPdfJs.bezig) return laadPdfJs.bezig;
    laadPdfJs.bezig = new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = PDFJS_URL;
      s.onload = function () {
        if (!window.pdfjsLib) { rej(new Error("pdf.js niet geladen")); return; }
        try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; } catch (e) { /* laat staan */ }
        res(window.pdfjsLib);
      };
      s.onerror = function () { rej(new Error("pdf.js niet bereikbaar")); };
      document.head.appendChild(s);
    });
    return laadPdfJs.bezig;
  }

  function paginaTekst(page) {
    return page.getTextContent().then(function (tc) {
      var lijnen = {};
      tc.items.forEach(function (it) {
        if (!it.transform) return;
        var y = Math.round(it.transform[5]);
        if (!lijnen[y]) lijnen[y] = [];
        lijnen[y].push({ x: it.transform[4], s: it.str });
      });
      return Object.keys(lijnen).map(Number).sort(function (a, b) { return b - a; }).map(function (y) {
        return lijnen[y].sort(function (a, b) { return a.x - b.x; })
          .map(function (i) { return i.s; }).join("").replace(/\s+/g, " ").trim();
      }).join("\n");
    });
  }

  function pdfNaarTekst(file) {
    return laadPdfJs()
      .then(function () { return file.arrayBuffer(); })
      .then(function (buf) { return window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise; })
      .then(function (pdf) {
        var nrs = [];
        for (var i = 1; i <= pdf.numPages; i++) nrs.push(i);
        return nrs.reduce(function (p, nr) {
          return p.then(function (acc) {
            return pdf.getPage(nr).then(paginaTekst).then(function (t) { return acc + t + "\n"; });
          });
        }, Promise.resolve(""));
      });
  }

  function verwerkBestanden(files) {
    var lijst = Array.prototype.slice.call(files || []);
    if (!lijst.length) return;
    flashNotice(lijst.length === 1 ? "Bestand wordt gelezen\u2026" : lijst.length + " bestanden worden gelezen\u2026");
    lijst.reduce(function (p, f) {
      return p.then(function (acc) {
        var isPdf = /\.pdf$/i.test(f.name || "") || f.type === "application/pdf";
        return (isPdf ? pdfNaarTekst(f) : f.text()).then(function (t) { return acc + "\n" + t; });
      });
    }, Promise.resolve("")).then(function (tekst) {
      if (!/\S/.test(tekst)) throw new Error("leeg bestand");
      view.paste = (view.paste ? view.paste + "\n" : "") + tekst;
      view.pasteOpen = true;
      var el = document.getElementById("f-paste");
      if (el) el.value = view.paste;
      verwerkPlak();
    }).catch(function (err) {
      var m = (err && err.message) || "";
      if (/niet bereikbaar|niet geladen/.test(m)) {
        flashNotice("Voor het lezen van pdf's is internet nodig, en dat lukt nu niet. Open de pdf en plak de tekst hieronder.");
      } else {
        flashNotice("Uit dit bestand kwam geen tekst. Bij een gescande pdf of een schermafbeelding lukt het niet \u2014 plak in dat geval de tekst zelf.");
      }
    });
  }


  /* ---------- diensten (taxi) en maandstatus ---------- */

  function isBoeking(e) { return e.soort === "boeking" || !e.soort; }
  function diensten() { return sorted(state.entries.filter(function (e) { return e.soort === "dienst"; })); }
  function dienstenVanMaand(mk) { return diensten().filter(function (e) { return monthKey(e.date) === mk; }); }

  var DIENST_NUM = ["ritten", "bedrag", "contant", "rekening", "pin", "minuten",
                    "startKm", "eindKm", "dashStart", "dashEind", "totaalKm", "beladen", "onbeladen"];

  function dienstTotalen(list) {

  function kopNaam(v) {
    return String(v === null || v === undefined ? "" : v)
      .replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
  }

  function datumUitCel(v) {
    if (v === null || v === undefined || v === "") return "";
    if (Object.prototype.toString.call(v) === "[object Date]" && !isNaN(v.getTime())) {
      return v.getFullYear() + "-" + String(v.getMonth() + 1).padStart(2, "0") + "-" + String(v.getDate()).padStart(2, "0");
    }
    if (typeof v === "number" && v > 20000 && v < 80000) {
      var d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 86400000);
      return d.toISOString().slice(0, 10);
    }
    var s = String(v).trim();
    var m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[0];
    m = s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
    if (m) {
      var jaar = Number(m[3]) < 100 ? 2000 + Number(m[3]) : Number(m[3]);
      return jaar + "-" + String(Number(m[2])).padStart(2, "0") + "-" + String(Number(m[1])).padStart(2, "0");
    }
    return "";

  function tijdUitCel(v) {
    if (v === null || v === undefined || v === "") return "";

      return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
    }
    if (Object.prototype.toString.call(v) === "[object Date]" && !isNaN(v.getTime())) {
      return String(v.getHours()).padStart(2, "0") + ":" + String(v.getMinutes()).padStart(2, "0");
    }
    return tijdUit(v);
  }

  function rijenNaarDiensten(rijen) {

    for (var i = 0; i < Math.min(rijen.length, 30); i++) {
      var namen = (rijen[i] || []).map(kopNaam);
      if (namen.indexOf("dienstnummer") > -1 || namen.indexOf("begin dienst (datum)") > -1) { kopIndex = i; break; }
    }
    if (kopIndex < 0) return [];
    var map = {};
    (rijen[kopIndex] || []).forEach(function (cel, i) {
      var veld = KOLOM_NAAR_VELD[kopNaam(cel)];
      if (veld && map[veld] === undefined) map[veld] = i;
    });
    if (map.date === undefined) return [];

    var uit = [];
    for (var r = kopIndex + 1; r < rijen.length; r++) {
      var rij = rijen[r] || [];
      var datum = datumUitCel(rij[map.date]);
      if (!datum) continue;
      var d = { date: datum, note: "" };
      ["dienstnr", "chauffeur", "kenteken"].forEach(function (k) {
        d[k] = map[k] === undefined ? "" : String(rij[map[k]] === null || rij[map[k]] === undefined ? "" : rij[map[k]]).trim();
      });
      d.tijd = map.tijd === undefined ? "" : tijdUitCel(rij[map.tijd]);
      d.eindDate = map.eindDate === undefined ? "" : datumUitCel(rij[map.eindDate]);
      d.eindTijd = map.eindTijd === undefined ? "" : tijdUitCel(rij[map.eindTijd]);
      DIENST_NUM.forEach(function (k) {
        d[k] = map[k] === undefined ? null : bedragUit(rij[map[k]]);
      });
      uit.push(d);
    }
    return uit;
  }

  function csvNaarRijen(tekst) {
    var eerste = tekst.split(/\r?\n/)[0] || "";
    var scheiding = eerste.split(";").length > eerste.split(",").length ? ";" : ",";
    return tekst.split(/\r?\n/).map(function (regel) {
      return regel.split(scheiding).map(function (c) { return c.replace(/^"|"$/g, "").trim(); });
    });
  }

  function dienstenUitTekst(tekst) {
    var uit = [];
    String(tekst).split(/\r?\n/).forEach(function (regel) {

  /* ---------- CSV ---------- */

  function csvFor(list, betList, titel) {
    var rows = [["Datum","Locatie","Boeking#","Van","Tot","Arrangement","Bedrag","Bank op locatie","Cash op locatie","Vergoeding " + NAAM,"Opmerking"]];
    list.forEach(function (e) {
      rows.push([e.date, e.loc || "", e.ref || "", e.van || "", e.tot || "", e.arr || "",
        dec(e.bedrag), dec(e.bank), dec(e.cash), dec(e.verg), e.note || ""]);
    });
    var t = totalen(list);
    rows.push([]);
    rows.push(["Totaal " + titel, "", "", "", "", "", dec(t.bedrag), dec(t.bank), dec(t.cash), dec(t.verg), ""]);
    if (betList && betList.length) {
      rows.push([]);
      rows.push(["Facturen en uitbetalingen"]);
      rows.push(["Datum","Factuurnummer","Wijze","BTW","Bedrag","Voldaan","Opmerking"]);
      var bt = 0;
      betList.forEach(function (e) {
        bt += num(e.bedrag);
        rows.push([e.date, e.ref || "", e.wijze || "", dec(e.btw), dec(e.bedrag), e.voldaan ? "ja" : "nee", e.note || ""]);
      });
      rows.push(["Totaal uitbetaald", "", "", "", dec(bt), "", ""]);
    }
    return rows.map(function (r) {
      return r.map(function (c) {
        c = String(c == null ? "" : c);
        return /[";\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(";");
    }).join("\r\n");
  }
  function dec(v) {
    if (v === null || v === undefined || v === "") return "";
    return String(r2(v).toFixed(2)).replace(".", ",");
  }
  function exportCsv(scope) {
    var list = scope === "all" ? boekingen() : boekingenVanMaand(view.month);
    var betList = scope === "all" ? betalingen() : betalingenVanMaand(view.month);
    var titel = scope === "all" ? "alle maanden" : monthLabel(view.month);
    var naam = "administratie-" + NAAM.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + (scope === "all" ? "totaal" : view.month) + ".csv";
    var data = "\ufeff" + csvFor(list, betList, titel);
    try {
      var blob = new Blob([data], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = naam;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (err) { copyFallback(data); }
  }
  function copyFallback(data) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () {
        flashNotice("Het overzicht staat op je klembord \u2014 plak het in Excel of Numbers.");
      }).catch(function () {
        flashNotice("Downloaden lukt hier niet. Open de link in je browser en probeer het opnieuw.");
      });
    } else {
      flashNotice("Downloaden lukt hier niet. Open de link in je browser en probeer het opnieuw.");
    }
  }
  function flashNotice(msg) {
    var el = document.getElementById("ro-notice");
    if (!el) return;
    el.textContent = msg;
    el.classList.remove("hidden");
    setTimeout(function () { el.classList.add("hidden"); }, 9000);
  }

  /* ---------- interactie ---------- */

  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");

    if (act === "lokaal") {
      localMode = true;
      try { localStorage.setItem(LOCAL_FLAG, "1"); } catch (err) { /* geen opslag */ }
      render();
      setSave("local");
      flashNotice("Je werkt nu alleen op dit apparaat. Wat je invult wordt niet gedeeld.");
      return;
    }
    if (act === "tab") {
      view.tab = btn.getAttribute("data-tab");
      view.editing = null; view.editingBet = null; view.editingDienst = null;
      var lijst = view.tab === "taxi" ? diensten() : boekingen();
      var inMaand = lijst.filter(function (e) { return monthKey(e.date) === view.month; }).length;
      if (!inMaand && lijst.length) {
        var maanden = lijst.map(function (e) { return monthKey(e.date); }).sort();
        var dichtst = maanden.filter(function (mk) { return mk <= view.month; }).pop() || maanden[maanden.length - 1];
        view.month = dichtst;
      }
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (act === "kies-ritbestand") {
      var rf = document.getElementById("r-file");
      if (rf) rf.click();
      return;
    }
    if (act === "imp-diensten") {
      var alles = seedDiensten().filter(function (d) { return !dienstBestaatAl(d); });
      if (!alles.length) { flashNotice("De diensten staan er al in."); return; }
      if (!confirm(alles.length + " diensten uit de Cabman-rapportage 2026 toevoegen?")) return;
      voegDienstenToe(alles);
      return;
    }
    if (act === "csv-diensten-maand") { exportDiensten("month"); return; }
    if (act === "csv-diensten-alles") { exportDiensten("all"); return; }
    if (act === "cancel-dienst") { view.editingDienst = null; dienstDraft = leegDienst(); render(); return; }
    if (act === "edit-dienst") {
      var de = state.entries.filter(function (x) { return x.id === btn.getAttribute("data-id"); })[0];
      if (!de) return;
      view.editingDienst = de.id;
      dienstDraft = leegDienst();
      Object.keys(dienstDraft).forEach(function (k) {
        dienstDraft[k] = de[k] === null || de[k] === undefined ? "" : de[k];
      });
      render();
      var dform = document.getElementById("dienstform");
      if (dform && dform.scrollIntoView) dform.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (act === "kies-bestand") {
      var fi = document.getElementById("f-file");
      if (fi) fi.click();
      return;
    }
    if (act === "lees-plak") { verwerkPlak(); return; }
    if (act === "wis-plak") {
      view.paste = "";
      var pv = document.getElementById("f-paste");
      if (pv) pv.value = "";
      return;
    }
    if (act === "prev-month") { view.month = shiftMonth(view.month, -1); render(); }
    else if (act === "next-month") { view.month = shiftMonth(view.month, 1); render(); }
    else if (act === "this-month") { view.month = monthKey(todayISO()); render(); }
    else if (act === "goto-month") { view.month = btn.getAttribute("data-month"); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (act === "loc") { leesForm(); draft.loc = btn.getAttribute("data-loc"); render(); }
    else if (act === "verg") { leesForm(); draft.verg = btn.getAttribute("data-verg"); render(); }
    else if (act === "wijze") { leesBetForm(); betDraft.wijze = btn.getAttribute("data-wijze"); render(); }
    else if (act === "cancel-edit") { view.editing = null; draft = leegDraft(); render(); }
    else if (act === "cancel-bet") { view.editingBet = null; betDraft = leegBetaling(); render(); }
    else if (act === "logout") {
      if (localMode) {
        if (confirm("Naar het inlogscherm? Wat je zonder code hebt ingevuld staat alleen op dit apparaat \u2014 exporteer eerst een CSV als je het wilt bewaren.")) renderLogin();
      } else if (confirm("Uitloggen? Je moet daarna opnieuw inloggen.")) {
        logout();
      }
    }
    else if (act === "csv-month") exportCsv("month");
    else if (act === "csv-all") exportCsv("all");
    else if (act === "imp-boek") importeer(seedBoekingen(), "boekingen");
    else if (act === "imp-bet") importeer(seedBetalingen(), "betalingen");
    else if (act === "edit") {
      var e = state.entries.filter(function (x) { return x.id === btn.getAttribute("data-id"); })[0];
      if (!e) return;
      view.editing = e.id;
      draft = { date: e.date, loc: e.loc || "", ref: e.ref || "", van: e.van || "", tot: e.tot || "",
                arr: e.arr || "", bedrag: e.bedrag == null ? "" : e.bedrag, bank: e.bank == null ? "" : e.bank,
                cash: e.cash == null ? "" : e.cash, verg: e.verg == null ? "" : e.verg, note: e.note || "" };
      render();
      var f = document.getElementById("entryform");
      if (f) f.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    else if (act === "edit-bet") {
      var b = state.entries.filter(function (x) { return x.id === btn.getAttribute("data-id"); })[0];
      if (!b) return;
      view.editingBet = b.id;
      betDraft = { date: b.date, bedrag: b.bedrag == null ? "" : b.bedrag, btw: b.btw == null ? "" : b.btw,
                   wijze: b.wijze || "bank", ref: b.ref || "", voldaan: !!b.voldaan, note: b.note || "" };
      render();
      var bf = document.getElementById("betform");
      if (bf) bf.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    else if (act === "del") {
      var id = btn.getAttribute("data-id");

      if (!confirm("Regel van " + d.toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" }) + " verwijderen?")) return;
      state.entries = state.entries.filter(function (x) { return x.id !== id; });
      if (view.editing === id) view.editing = null;
      if (view.editingBet === id) view.editingBet = null;
      cacheLocal();
      render();
      pushDelete(id);
    }

  function importeer(nieuwe, wat) {
    var bestaand = {};
    state.entries.forEach(function (e) { bestaand[e.soort + "|" + e.date + "|" + (e.ref || "") + "|" + num(e.bedrag) + "|" + num(e.verg)] = true; });
    var toe = nieuwe.filter(function (e) {
      return !bestaand[e.soort + "|" + e.date + "|" + (e.ref || "") + "|" + num(e.bedrag) + "|" + num(e.verg)];
    });
    if (!toe.length) { flashNotice("Deze " + wat + " staan er al in."); return; }
    if (!confirm(toe.length + " " + wat + " uit het Excel-bestand toevoegen?")) return;
    state.entries = state.entries.concat(toe);
    cacheLocal();
    render();
    pushMany(toe);
    flashNotice(toe.length + " " + wat + " toegevoegd.");
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value : "";
  }
  function leesForm() {
    if (!document.getElementById("entryform")) return;
    draft.date = val("f-date") || draft.date;
    draft.ref = val("f-ref").trim();
    draft.van = val("f-van");
    draft.tot = val("f-tot");
    draft.arr = val("f-arr").trim();
    draft.bedrag = val("f-bedrag");
    draft.bank = val("f-bank");
    draft.cash = val("f-cash");
    draft.verg = val("f-verg");
    draft.note = val("f-note").trim();
  }
  function leesBetForm() {
    if (!document.getElementById("betform")) return;
    betDraft.date = val("b-date") || betDraft.date;
    betDraft.bedrag = val("b-bedrag");
    betDraft.btw = val("b-btw");
    betDraft.ref = val("b-ref").trim();
    betDraft.note = val("b-note").trim();
    var c = document.querySelector('[data-act="voldaan"]');
    if (c) betDraft.voldaan = c.checked;
  }

  document.addEventListener("change", function (ev) {
    var el = ev.target;
    var act = el.getAttribute && el.getAttribute("data-act");
    if (act === "maand-betaald") {
      zetMaandBetaald(el.getAttribute("data-month") || view.month, el.checked);
      return;
    }
    if (act === "voldaan") {
      betDraft.voldaan = el.checked;
      var wrap = el.closest(".chk");
      if (wrap) wrap.classList.toggle("on", el.checked);
    }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.id === "f-paste") view.paste = ev.target.value;
    if (ev.target.id === "f-verg") {
      var p = document.querySelector(".preview .u");
      if (p) p.textContent = money(ev.target.value);
    }
  });

  document.addEventListener("submit", function (ev) {
    if (ev.target.id === "entryform") {
      ev.preventDefault();
      leesForm();
      if (!draft.date) { var de = document.getElementById("f-date"); if (de) de.focus(); return; }
      var velden = {
        soort: "boeking", date: draft.date, loc: draft.loc, ref: draft.ref, van: draft.van, tot: draft.tot,
        arr: draft.arr, bedrag: numOrNull(draft.bedrag), bank: numOrNull(draft.bank),
        cash: numOrNull(draft.cash), verg: numOrNull(draft.verg), note: draft.note
      };
      bewaar(velden, "editing");
      var vorigeLoc = draft.loc;
      draft = leegDraft();
      draft.date = velden.date;
      draft.loc = vorigeLoc;
      view.month = monthKey(velden.date);
      render();
      return;
    }
    if (ev.target.id === "dienstform") {
      ev.preventDefault();
      leesDienstForm();
      var dvelden = { soort: "dienst", date: dienstDraft.date, note: dienstDraft.note };
      ["dienstnr", "chauffeur", "kenteken", "tijd", "eindDate", "eindTijd"].forEach(function (k) {
        dvelden[k] = dienstDraft[k] || "";
      });
      DIENST_NUM.forEach(function (k) { dvelden[k] = numOrNull(dienstDraft[k]); });
      bewaar(dvelden, "editingDienst");
      var vorige = { chauffeur: dienstDraft.chauffeur, kenteken: dienstDraft.kenteken, date: dienstDraft.date };
      dienstDraft = leegDienst();
      dienstDraft.chauffeur = vorige.chauffeur;
      dienstDraft.kenteken = vorige.kenteken;
      dienstDraft.date = vorige.date;
      view.month = monthKey(dvelden.date);
      render();
      return;
    }
    if (ev.target.id === "betform") {
      ev.preventDefault();
      leesBetForm();
      if (!betDraft.date || numOrNull(betDraft.bedrag) === null) {
        flashNotice("Vul bij een betaling in elk geval een datum en een bedrag in.");
        return;
      }
      var bvelden = {
        soort: "betaling", date: betDraft.date, bedrag: numOrNull(betDraft.bedrag), btw: numOrNull(betDraft.btw),
        wijze: betDraft.wijze, ref: betDraft.ref, voldaan: !!betDraft.voldaan, note: betDraft.note
      };
      bewaar(bvelden, "editingBet");
      betDraft = leegBetaling();
      view.month = monthKey(bvelden.date);
      render();
    }
  });

  var DIENST_IDS = {
    dienstnr: "d-nr", chauffeur: "d-chauffeur", kenteken: "d-kenteken", ritten: "d-ritten",
    date: "d-date", tijd: "d-tijd", eindDate: "d-einddate", eindTijd: "d-eindtijd",
    bedrag: "d-bedrag", contant: "d-contant", rekening: "d-rekening", pin: "d-pin",
    minuten: "d-minuten", startKm: "d-startkm", eindKm: "d-eindkm",
    dashStart: "d-dashstart", dashEind: "d-dasheind", totaalKm: "d-totaalkm",
    beladen: "d-beladen", onbeladen: "d-onbeladen", note: "d-note"
  };

  function leesDienstForm() {
    if (!document.getElementById("dienstform")) return;
    Object.keys(DIENST_IDS).forEach(function (k) {
      var el = document.getElementById(DIENST_IDS[k]);
      if (el) dienstDraft[k] = typeof el.value === "string" ? el.value.trim() : el.value;
    });
    if (!dienstDraft.date) dienstDraft.date = todayISO();
  }

  function bewaar(velden, welk) {
    var saved = null, isNew = false;
    if (view[welk]) {
      var doelId = view[welk];
      state.entries = state.entries.map(function (e) {
        if (e.id !== doelId) return e;
        var upd = { id: e.id };
        Object.keys(velden).forEach(function (k) { upd[k] = velden[k]; });
        saved = upd;
        return upd;
      });
      view[welk] = null;
    } else {
      isNew = true;
      saved = { id: uid() };
      Object.keys(velden).forEach(function (k) { saved[k] = velden[k]; });
      state.entries.push(saved);
    }
    cacheLocal();
    if (saved) { if (isNew) pushNew(saved); else pushUpdate(saved); }
  }


  /* bestanden slepen */
  ["dragenter", "dragover"].forEach(function (n) {
    document.addEventListener(n, function (ev) {
      var zone = document.getElementById("ritzone") || document.getElementById("dropzone");
      if (!zone) return;
      ev.preventDefault();
      zone.classList.add("over");
    });
  });
  ["dragleave", "dragend"].forEach(function (n) {
    document.addEventListener(n, function (ev) {
      var zone = document.getElementById("ritzone") || document.getElementById("dropzone");
      if (zone && (!ev.relatedTarget || !zone.contains(ev.relatedTarget))) zone.classList.remove("over");
    });
  });
  document.addEventListener("drop", function (ev) {
    var zone = document.getElementById("ritzone") || document.getElementById("dropzone");
    if (!zone) return;
    ev.preventDefault();
    zone.classList.remove("over");
    if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) {
      if (view.tab === "taxi") verwerkDienstBestanden(ev.dataTransfer.files);
      else verwerkBestanden(ev.dataTransfer.files);
    }
  });

  document.addEventListener("change", function (ev) {
    if (ev.target && ev.target.id === "r-file" && ev.target.files && ev.target.files.length) {
      verwerkDienstBestanden(ev.target.files);
      ev.target.value = "";
      return;
    }
    if (ev.target && ev.target.id === "f-file" && ev.target.files && ev.target.files.length) {
      verwerkBestanden(ev.target.files);
      ev.target.value = "";
    }
  });

  /* ---------- start ---------- */

  function start() {
    render();
    pull(false);
    if (!pollTimer && !localMode) {
      pollTimer = setInterval(function () {
        if (!document.hidden && session && !localMode) pull(true);
      }, POLL_MS);
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && session && !localMode) pull(true);
  });
  window.addEventListener("online", function () { if (session && !localMode) pull(true); });

  if (localMode) {
    render();
    setSave("local");
  } else if (!configured) {
    render();
    setSave("setup");
  } else if (session) {
    start();
  } else {
    renderLogin();
  }
})();
</script>
</body>
</html>
